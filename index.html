<style>
:root{

  --green:#1E5A3E; --green-dk:#143F2A;

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:13.5px;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.wrap>*{min-width:0}

.num{font-variant-numeric:tabular-nums;font-family:var(--f-disp)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);overflow:hidden}
.hb{display:flex;flex-direction:column;gap:16px;margin-top:4px}.hb-h{display:flex;align-items:center;gap:8px;margin:0 2px 8px}.hb-h b{font-size:13px;font-weight:700;color:var(--fg)}
.hb-hi{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;color:#fff}
.rtd-box.bal-now{background:linear-gradient(160deg,#1E5A3E,#143D2A);color:#fff;padding:14px 16px;border-radius:16px;margin-bottom:10px}.rtd-box.bal-now span{color:rgba(255,255,255,.8)}.rtd-box.bal-now b{font-size:21px;color:#fff}.rtd-box.bal-now small{color:#E9D58B;font-size:12px}

.fa-ph{display:none}
.fa-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(160deg,#1E5A3E,#143D2A);color:#fff;border-radius:20px;padding:18px 16px;margin-bottom:10px;box-shadow:0 10px 24px rgba(20,61,42,.25)}
.fa-hl small{display:block;font-size:11.5px;opacity:.8}.fa-hl>b{display:block;font-size:28px;font-weight:800;margin:4px 0;color:#F3E3A6}.fa-hl span{font-size:11.5px;opacity:.95}.fa-hl em{font-style:normal;font-size:10.5px;margin-inline-start:4px}

.fa-ks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.fa-k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:3px}
.fa-k small{font-size:10.5px;color:var(--muted)}.fa-k b{font-size:17px}.fa-k span{font-size:10.5px;color:var(--muted)}
.fa-ks em,.fa-cs em,.fa-hl em{font-style:normal;font-weight:700}.fa-ks em.u,.fa-cs em.u{color:#16794C}.fa-ks em.d,.fa-cs em.d{color:#B42318}.fa-hl em.u{color:#9BE3B8}.fa-hl em.d{color:#FFB4A8}
.fa-c h3{margin:0 0 8px;font-size:14.5px}
.fa-cs{margin:9px 0}.fa-csh{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}.fa-csh .ac{font-style:normal;font-size:10px;color:var(--muted);margin:0 4px}
.fa-csb{height:8px;border-radius:99px;background:var(--bg);margin:5px 0 3px;overflow:hidden}.fa-csb span{display:block;height:100%;border-radius:99px}.fa-csm{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.fa-in{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}.fa-in:last-child{border:0}.fa-in span{flex:none;font-size:16px}.fa-in p{margin:0;font-size:12.5px;line-height:1.7}
#fsPrint{display:none}
@media print{body.fsprinting>*:not(#fsPrint){display:none!important}body.fsprinting #fsPrint{display:block;padding:0 4mm;direction:rtl}#fsPrint .fa-ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #143D2A;padding-bottom:8px;margin-bottom:12px}#fsPrint .fa-ph b{font-size:18px;color:#143D2A}#fsPrint .fa-ph span{font-size:12px;color:#555}#fsPrint .card,#fsPrint .fa-hero,#fsPrint .fa-ks{break-inside:avoid;box-shadow:none}#fsPrint .fa-hero,#fsPrint .fa-pdf{-webkit-print-color-adjust:exact;print-color-adjust:exact}#fsPrint *{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4;margin:12mm}}
.pm-sw{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;margin:2px 0 8px}.pm-sw button{border:0;background:none;border-radius:9px;padding:8px 6px;font:inherit;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}.pm-sw button[aria-pressed="true"]{background:var(--card);color:#143D2A;box-shadow:0 1px 4px rgba(20,24,20,.12)}
.pm-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:14px;background:var(--card);-webkit-overflow-scrolling:touch}
.pm{border-collapse:separate;border-spacing:0;font-size:10px}.pm th,.pm td{border-bottom:1px solid #D5D9CF;border-inline-start:1px solid #D5D9CF;padding:0;text-align:center}
.pm thead th{position:sticky;top:0;z-index:2;background:var(--card)}.pm thead tr:nth-child(2) th{top:26px}
.pm-g{height:26px;font-size:10px;font-weight:800;padding:0 5px!important;white-space:nowrap;border-inline-start:2px solid #B9C0B2!important}
.pm-h{height:104px;min-width:34px;vertical-align:bottom;padding:5px 2px!important}.pm-h span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-weight:600;font-size:9.5px;display:inline-block;max-height:98px;overflow:hidden;text-overflow:ellipsis}
.pm .g1{background:#F7F8F4}.pm thead .g1{background:#F1F3EC}
.pm-u{position:sticky;right:0;z-index:1;background:var(--card);text-align:start!important;padding:8px 10px!important;min-width:96px;max-width:116px;font-weight:700;font-size:10.5px;border-inline-end:2px solid #B9C0B2;box-shadow:-4px 0 8px rgba(0,0,0,.04)}
.pm thead .pm-u{z-index:3}.pm-u small{display:block;font-weight:400;font-size:8.5px;color:var(--muted);direction:ltr;text-align:right}
.pm-c{width:22px;height:22px;margin:5px;border-radius:6px;border:2px solid #CBD0C6;background:#fff;cursor:pointer;position:relative;padding:0}
.pm-c[aria-pressed="true"]{background:#1E5A3E;border-color:#1E5A3E}.pm-c[aria-pressed="true"]::after{content:'✓';color:#fff;font-weight:800;font-size:12px;position:absolute;inset:0;display:grid;place-items:center}
.pm-c:disabled{opacity:.5}
.um-list{display:flex;flex-direction:column;gap:6px}.um-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:inherit;color:inherit;cursor:pointer;text-align:start}
.um-row .uav{width:34px;height:34px}.um-n{flex:1;min-width:0;display:flex;flex-direction:column}.um-n b{font-size:13.5px}.um-n small{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.um-sw{flex:none;width:44px;height:26px;border-radius:99px;background:#D9DCD6;position:relative;transition:.2s}.um-sw::after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.um-row[aria-pressed="true"]{border-color:#1E5A3E;background:#EEF5F0}.um-row[aria-pressed="true"] .um-sw{background:#1E5A3E}.um-row[aria-pressed="true"] .um-sw::after{right:21px}
.um-copy{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.pw-why{border-inline-start:4px solid #B42318}.pw-all summary{list-style:none}.pw-all summary::before{content:'▸ '}.pw-all[open] summary::before{content:'▾ '}
.adv-fi{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}.adv-fi:last-of-type{border-bottom:0}.adv-fh{display:flex;justify-content:space-between;align-items:center;gap:8px}.adv-fh b{font-size:12.5px}
.adv-fm{font-size:11px;margin-top:2px}.adv-fr{font-size:11.5px;margin-top:4px;background:var(--bg);border-radius:10px;padding:6px 9px;line-height:1.6}
.adv-msg{position:relative;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 5px;font-size:11px;cursor:pointer;vertical-align:middle;margin-inline-start:4px}.adv-msg.on{border-color:#C9A227;background:var(--gold-soft)}.adv-msg i{position:absolute;top:-6px;left:-6px;background:#C0392B;color:#fff;font-style:normal;font-size:9px;border-radius:99px;min-width:14px;height:14px;display:grid;place-items:center;padding:0 3px}
.mg-rf{border-inline-start:4px solid #C9A227}.mg-rf h3{margin:0 0 4px;font-size:14px}.mg-rfi{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 0;font:inherit;color:inherit;cursor:pointer}.mg-rfi:last-of-type{border-bottom:0}
.mg-rfh{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}.mg-rfh span{font-size:10.5px}.mg-rfb{font-size:12.5px;margin-top:3px;background:var(--bg);border-radius:10px;padding:7px 10px;line-height:1.7;white-space:pre-wrap}.mg-rft{font-size:10.5px;margin-top:3px}
.ro-gen #view form,.ro-gen .lv-ov form{display:none!important}
.ro-bar{background:#EEF3F8;color:#2F5D8A;border:1px solid #CFDDEB;border-radius:12px;padding:8px 12px;font-size:11.5px;font-weight:600;margin:4px 0 10px}
body.ro-purch [data-prn],body.ro-purch [data-pradd],body.ro-purch [data-prst],body.ro-purch [data-prdel],body.ro-purch [data-pred],body.ro-maint [data-mtn],body.ro-maint [data-mtst],body.ro-maint [data-mtdel],body.ro-rets [data-rtok],body.ro-rets [data-rtno]{display:none!important}

.hm-t{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:0 1px 2px rgba(20,24,20,.04),0 6px 16px rgba(20,24,20,.06);font:inherit;color:inherit;cursor:pointer;text-align:start;position:relative;overflow:hidden}

.pw-al{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;margin-bottom:10px}.pw-al span{font-size:24px}.pw-al b{display:block;font-size:14px}.pw-al small{font-size:10.5px;opacity:.85}

.hb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hb-grid.one{grid-template-columns:1fr}

.pgrp{border:1px solid var(--line,#e5e7eb);border-radius:12px;padding:8px 10px;margin-bottom:8px}.pgh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.pgh b{font-size:12px}.pgh .btn{margin-inline-start:auto}
.tg{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:11.5px;display:inline-flex;gap:6px;align-items:center}
.tg[aria-pressed="true"]{background:var(--up);border-color:var(--up);color:#fff}
.tg:disabled{opacity:.55;cursor:not-allowed}
.role{font-size:11px;font-weight:700;padding:2px 10px;border-radius:99px}
.role.owner{background:var(--gold-soft);color:var(--gold-ink)}
.role.admin{background:rgba(91,143,208,.15);color:#3C6FB0}
.role.user,.role.sync{background:var(--chip);color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin:0 auto;max-width:360px;background:var(--fg);color:var(--bg);text-align:center;border-radius:12px;padding:10px 14px;z-index:30;transition:opacity .25s}
.toast.hide{opacity:0;pointer-events:none}
.loading{display:flex;justify-content:center;padding:40px;color:var(--muted)}
footer{font-size:11px;color:var(--muted);text-align:center}
.mark{background:linear-gradient(135deg,var(--green),var(--green-dk))!important;color:var(--gold)!important;box-shadow:0 4px 12px rgba(45,91,59,.25)}
.btn{background:var(--green-dk)}
.tabs button[aria-pressed="true"]{background:var(--green-dk);color:#fff;border-color:var(--green-dk);box-shadow:0 2px 8px rgba(20,63,42,.22)}
.tabs button{border-color:var(--line);color:#4F554F}
h1{color:var(--green-dk);letter-spacing:-.2px}
.kpi .val{color:var(--fg)}
.kpi .lbl{letter-spacing:.1px}
tr.total td{border-top-color:var(--green-dk)}
.chips button[aria-pressed="true"]{border-color:var(--green-dk);box-shadow:inset 0 0 0 1px var(--green-dk);color:var(--green-dk)}
.card{border-color:var(--line);box-shadow:0 1px 2px rgba(20,24,20,.04),0 4px 14px rgba(20,24,20,.05)}
.avatar{background:linear-gradient(135deg,#F6E7B0,var(--gold))!important;color:#4A3A08!important}
.tg[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.note{border-color:var(--gold)}
button:focus-visible,input:focus-visible,select:focus-visible{outline-color:var(--green)}
.appframe{display:block;width:calc(100% + 32px);margin-inline:-16px;border:0;border-radius:0;background:var(--bg);height:70vh}
@media (min-width:760px){.appframe{width:100%;margin-inline:0;border:1px solid var(--line);border-radius:16px}}
.pageframe{display:block;width:calc(100% + 32px);margin-inline:-16px;border:0;border-radius:0;background:var(--card);min-height:400px}
@media (min-width:760px){.pageframe{width:100%;margin-inline:0;border:1px solid var(--line);border-radius:14px}}
body.appmode .wrap{padding-bottom:8px;gap:10px}
body.appmode footer{display:none}

@media (max-width:760px){
  body{font-size:12px}
  .wrap{padding-inline:14px;padding-block:12px 40px;gap:12px}
  .brand h1{font-size:14.5px!important;line-height:1.25!important}
  .brand h1+div{font-size:10.5px!important}
  .mybtn{font-size:11px;padding:6px 12px}
  .tabs{gap:5px}
  .tabs button{font-size:11px;padding:5px 12px}
  .chips button{font-size:11px;padding:4px 10px}
  .card{padding:13px;border-radius:12px}
  .card h3{font-size:13px}
  .kpi .lbl{font-size:11px}.kpi .val{font-size:18px}.kpi .sub{font-size:10px}
  table{font-size:11px} th{font-size:10px} th,td{padding:7px 8px}
  .mon b{font-size:12.5px;min-width:96px}
  .icb{width:30px;height:30px}
  .note{font-size:11px}
  .tag{font-size:10px}
}

/* header actions + bottom nav */
.who{display:flex;align-items:center;gap:8px}
.hbtn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--green-dk);flex:none;box-shadow:0 2px 8px rgba(20,24,20,.06)}
.hbtn .bd{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--down);color:#fff;border-radius:99px;font-size:9.5px;font-weight:700;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;border:2px solid var(--bg)}
.avb{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(135deg,#F3E2A6,#D4AF37);color:#3E2F05;font-family:var(--f-disp);font-weight:700;font-size:14.5px;cursor:pointer;flex:none;box-shadow:0 3px 10px rgba(154,123,18,.25)}
.npanel{position:absolute;inset-inline-end:0;top:48px;z-index:41;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 34px rgba(20,24,20,.18);width:min(330px,calc(100vw - 28px));max-height:70vh;overflow:auto;padding:12px}
.npanel h4{margin:0 0 8px;font-family:var(--f-disp);font-size:13.5px}
.nitem{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:start;font:inherit;color:inherit;cursor:pointer}
.nitem:last-child{border-bottom:0}
.nitem .ic{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:12.5px}
.nitem .tx{font-size:11px;line-height:1.6}
.nitem .tx small{display:block;color:var(--muted);font-size:10px}
.bnav{position:fixed;inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:35;max-width:540px;margin:0 auto;display:flex;align-items:stretch;gap:4px;padding:6px;border-radius:26px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(30,90,62,.12);box-shadow:0 12px 32px rgba(16,40,28,.18),0 2px 6px rgba(16,40,28,.06),inset 0 1px 0 rgba(255,255,255,.9)}
.bnav button{flex:1;min-width:0;position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px 7px;border-radius:20px;color:#8A908A;font:inherit;font-size:9.5px;font-weight:700;letter-spacing:-.1px;cursor:pointer;transition:background .28s,color .28s,box-shadow .28s,transform .15s;-webkit-tap-highlight-color:transparent}
.bnav button:active{transform:scale(.94)}
.bnav button svg{width:22px;height:22px;transition:transform .28s}
.bnav .bi{position:relative;display:grid;place-items:center;height:24px}
.bnav button[aria-pressed="true"]{color:#fff;background:linear-gradient(155deg,#2A6B4C 0%,#1E5A3E 45%,#123A27 100%);box-shadow:0 8px 18px rgba(18,58,39,.38),inset 0 1px 0 rgba(255,255,255,.14)}
.bnav button[aria-pressed="true"] .bi{color:#F3DE9C}
.bnav button[aria-pressed="true"] svg{transform:translateY(-1px) scale(1.06)}
.bnav button[aria-pressed="true"]::after{content:"";position:absolute;top:4px;width:18px;height:3px;border-radius:9px;background:linear-gradient(90deg,#F3DE9C,#C9A227)}
.bnav .bdot{position:absolute;top:-5px;inset-inline-end:-9px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:#D0453A;color:#fff;font-size:9.5px;font-weight:800;line-height:17px;text-align:center;box-shadow:0 0 0 2px #fff}
.bnav button[aria-pressed="true"] .bdot{box-shadow:0 0 0 2px #1E5A3E}
body.hasnav .wrap{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
body.hasnav .toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.tabs:empty{display:none}
/* دوام الموظف */
.sh-card{border-top:4px solid var(--green)}
.sh-card.new{border-top-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.35),var(--shadow)}
.sh-card.none .sh-hd small{line-height:1.6}
.sh-new{background:var(--gold-soft);color:var(--gold-ink);font-weight:700;font-size:12px;border-radius:10px;padding:8px 10px;margin-bottom:10px;text-align:center}
.sh-hd{display:flex;align-items:center;gap:10px}.sh-ic{font-size:24px}.sh-hd b{display:block;font-size:14px;font-family:var(--f-disp)}.sh-hd small{display:block;font-size:11px;color:var(--muted)}
.sh-ls{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sh-sh{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center}
.sh-n{display:block;font-size:10.5px;color:var(--muted);margin-bottom:2px}
.sh-t{display:flex;align-items:center;justify-content:center;gap:14px;direction:rtl}.sh-t b{font-size:20px;color:var(--green-dk)}.sh-t i{font-style:normal;color:var(--gold);font-size:16px}
.sh-sh small{display:block;font-size:10px;color:var(--warn);margin-top:2px}

.sh-wk span small{display:block;font-size:9px;font-weight:400;opacity:.75}
.sh-wk span.off{background:rgba(208,69,58,.09);color:var(--down)}
.sh-wk span.td{box-shadow:inset 0 0 0 1.5px currentColor}

.cu-flag{margin-top:7px;border:1px solid rgba(201,138,12,.4);background:rgba(201,138,12,.08);border-radius:10px;padding:7px 9px;font-size:10.5px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}.cu-flag b{color:#9A6A00;font-size:11px;margin-inline-end:4px}.cu-flag span{background:rgba(201,138,12,.14);color:#7A5300;border-radius:99px;padding:1px 8px}
/* الأفكار التسويقية */
.mk-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.mk-hd b{display:block;font-family:var(--f-disp);font-size:15px}.mk-hd small{display:block;font-size:10.5px;color:var(--muted)}
.mk-load{display:flex;align-items:center;gap:12px}.mk-load b{display:block;font-size:12.5px}.mk-load small{display:block;font-size:10.5px;color:var(--muted)}
.mk-day{display:flex;flex-direction:column;gap:3px;margin:4px 2px 10px}.mk-day span{font-size:11px;color:var(--muted)}.mk-day b{font-size:13px;color:var(--gold-ink)}
.mk-it{border-inline-start:4px solid var(--gold)}.mk-tr h3{margin-bottom:6px}.mk-tri{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.7}.mk-tri:last-child{border-bottom:0}.mk-tri b{display:block;font-size:12.5px}.mk-use{color:var(--gold-ink);font-size:11.5px}.mk-tri a{font-size:11px;color:var(--green);font-weight:600}.mk-h3{font-size:13px;margin:6px 2px 8px}.mk-it.done{border-inline-start-color:var(--up);opacity:.85}
.mk-top{display:flex;gap:10px;align-items:flex-start}.mk-ic{font-size:26px;flex:none}.mk-tt b{display:block;font-size:13.5px;line-height:1.5}.mk-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.mk-tags .tag{font-size:10px;padding:1px 8px}

.mk-why{font-size:11px;color:var(--muted);margin-top:8px}
.mk-acts{display:flex;gap:6px;margin-top:10px}.mk-v{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 4px;font:inherit;font-size:11.5px;cursor:pointer;color:inherit}.mk-v.on{border-color:var(--gold);background:var(--gold-soft);font-weight:700}.mk-v.on.ok{border-color:var(--up);background:rgba(31,161,107,.1);color:var(--up)}
/* المراسلات */
.mg-ban{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:1px solid rgba(212,175,55,.45);background:var(--gold-soft);border-radius:16px;padding:12px 14px;margin-bottom:12px;font:inherit;color:inherit;cursor:pointer}
.mg-ban.urg{border-color:rgba(208,69,58,.45);background:rgba(208,69,58,.07)}
.mg-ban .ic{font-size:22px;flex:none}.mg-ban b{display:block;font-size:12.5px}.mg-ban small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}.mg-ban .chev{margin-inline-start:auto;color:var(--muted);font-size:18px}
.mg-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.mg-new{min-height:36px;padding:6px 14px;font-size:12px}
.mg-n{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:99px;background:var(--down);color:#fff;font-size:10px;font-weight:700;padding:0 5px;margin-inline-start:4px}
.mg-kf{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}.mg-kf::-webkit-scrollbar{display:none}.mg-kf button{flex:none}
.mg-list{display:flex;flex-direction:column;gap:8px}
.mg-it{display:block;width:100%;text-align:start;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--c);border-radius:14px;padding:11px 13px;cursor:pointer;box-shadow:var(--shadow);position:relative}
.mg-it.new{background:linear-gradient(0deg,var(--card),var(--card)) padding-box;border-color:var(--line) var(--line) var(--line) var(--c)}
.mg-it.new .mg-ttl::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--down);margin-inline-end:6px;vertical-align:middle}
.mg-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mg-k{font-size:10.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);border-radius:99px;padding:2px 9px}
.mg-p{font-size:10px;font-weight:700;color:#fff;background:var(--c);border-radius:99px;padding:2px 8px}
.mg-t{margin-inline-start:auto;font-size:10.5px;color:var(--muted)}
.mg-ttl{display:block;font-size:13px;margin-top:6px;line-height:1.5}
.mg-sn{font-size:11.5px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mg-f{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:var(--muted);margin-top:7px}
.mg-f .need{color:var(--down);font-weight:700}.mg-f .ok{color:var(--up);font-weight:700}
.mg-st{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:10.5px;color:var(--muted)}.mg-st .meter{flex:1}
.mg-back{border:0;background:none;color:var(--green);font:inherit;font-size:12.5px;font-weight:600;padding:4px 0 10px;cursor:pointer}
.mg-doc{border-top:4px solid var(--c)}
.mg-dt{font-family:var(--f-disp);font-size:17px;line-height:1.5;margin:10px 0 4px}
.mg-meta{font-size:11px;color:var(--muted)}
.mg-body{white-space:pre-wrap;font-size:13.5px;line-height:1.9;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);overflow-wrap:anywhere}
.mg-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:14px}
.mg-img img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.mg-pdf{grid-column:1/-1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:inherit;text-decoration:none;background:var(--bg)}
.mg-acts{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.mg-ack{width:100%;padding:14px;font-size:13.5px;margin-bottom:12px;background:var(--green)}
.mg-acked{text-align:center;color:var(--up);font-weight:600;font-size:12.5px}
.mg-kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;text-align:center}.mg-kp b{display:block;font-size:20px}.mg-kp span{font-size:10.5px;color:var(--muted)}
.mg-rl{max-height:320px;overflow:auto}
.mg-r{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}.mg-r:last-child{border-bottom:0}
.mg-rn{flex:1;min-width:0}.mg-rn small{display:block;font-size:10px;color:var(--muted)}.mg-rt{font-size:10.5px;color:var(--muted);white-space:nowrap}
.mg-th{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.mg-b{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:12px;white-space:pre-wrap;max-width:88%}
.mg-b.me{align-self:flex-end;background:var(--gold-soft);border-color:rgba(212,175,55,.35)}
.mg-bh{display:flex;gap:6px;align-items:baseline;font-size:10.5px;margin-bottom:3px}.mg-bh>span:last-child{margin-inline-start:auto;color:var(--muted)}
.mg-rep{display:flex;gap:8px;align-items:flex-end}.mg-rep textarea{flex:1;resize:vertical}
.mg-form{display:flex;flex-direction:column;gap:12px}
.mg-kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.mg-kinds button span{font-size:19px}
.mg-kinds button[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);font-weight:700;color:var(--c)}
.mg-att{display:flex;flex-wrap:wrap;gap:8px}
.mg-af{position:relative;display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:4px;font-size:11px;max-width:100%}

.mg-pp input,.mg-ackt input{width:18px;height:18px;accent-color:var(--green);flex:none}

.mg-cnt{font-size:12px;text-align:center;background:var(--bg);border-radius:10px;padding:9px}
/* splash — هندسي */
#splash{--k:1;position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;cursor:pointer;color:#fff;
  background:radial-gradient(120% 85% at 50% 40%,#2F6B49 0%,#1E5A3E 38%,#0F3322 75%,#0A2116 100%);transition:opacity .7s ease,visibility .7s}
#splash.quick{--k:.45}
#splash.out{opacity:0;visibility:hidden}

// رسم أعمدة ذكي: يملأ العرض، متكدّس حسب الفروع، توقّع، خط متوسط، تمييز الأعلى/الأقل، تفاصيل عند الضغط
function smartBars({labels,series,proj=[],avg=null,avgLbl='المتوسط',avgEnd=false,info=[],marks={},h=190,sub=[]}){
  const n=labels.length; if(!n) return ''; const W=340, top=22, bot=sub.length?34:20, H=h, ch=H-top-bot;
  const tots=labels.map((_,i)=>sum(series.map(s=>s.vals[i]||0)));
  const mx=Math.max(1,...tots.map((t,i)=>t+(proj[i]||0)),avg||0)*1.08;
  const slot=W/n, bw=Math.max(4,Math.min(34,slot*0.66)); const Y=v=>top+ch-(v/mx)*ch;
  let g=`<defs><pattern id="sbp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="rgba(212,175,55,.10)"/><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(212,175,55,.55)" stroke-width="2"/></pattern></defs>`;
  [0.25,0.5,0.75,1].forEach(f=>{const y=top+ch-f*ch;g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width=".6"/>`;});
  labels.forEach((l,i)=>{ const x=i*slot+(slot-bw)/2; let y0=top+ch; const hl=marks[i];
    const op=hl||marks.focus==null?1:.9;
    series.forEach(s=>{const v=s.vals[i]||0; if(!v) return; const hh=(v/mx)*ch; y0-=hh; g+=`<rect x="${x}" y="${y0}" width="${bw}" height="${hh}" fill="${s.color}" opacity="${op}"/>`;});

async function mgSend(){
  mgKeep(); const f=st.mgD, err=$('#mgErr'), b=$('#mgGo');
  if(!f.title.trim()){err.textContent='اكتب عنوان المراسلة';return;}
  if(f.scope==='branches'&&!f.branches.length){err.textContent='اختر فرع واحد على الأقل';return;}
  if(!mgCount()){err.textContent='ما فيه مستلمين';return;}
  b.disabled=true; b.textContent='جارِ الإرسال…'; err.textContent='';
  const r=await sb.rpc('msg_send',{p_kind:f.kind,p_prio:f.prio,p_title:f.title.trim(),p_body:f.body.trim(),p_ack:!!f.ack,p_target:{scope:f.scope,who:f.who,branches:f.scope==='branches'?f.branches:[],users:f.scope==='users'?f.users:[]}});
  if(r.error){ b.disabled=false; b.textContent='إرسال المراسلة'; err.textContent=mgMissing(r.error)?'النظام يحتاج تشغيل ملف msgs.sql أولاً':r.error.message; return; }
  const id=r.data;
  if(f.files.length){ b.textContent='جارِ رفع المرفقات…'; const out=[];
    for(const x of f.files){ try{ const blob=x.t==='pdf'?x.file:await (await fetch(x.d)).blob(); const path='msg/'+id+'/'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2))+(x.t==='pdf'?'.pdf':'.jpg');
        const u=await sb.storage.from(MEDIA_BKT).upload(path,blob,{contentType:x.t==='pdf'?'application/pdf':'image/jpeg',upsert:false}); if(u.error) throw u.error; out.push({p:'sb:'+path,t:x.t,n:x.n}); }catch(e2){ console.warn('msg file',e2); toast('تعذّر رفع أحد المرفقات'); } }
    if(out.length) await sb.rpc('msg_attach',{p_id:id,p_files:out}); }
  st.mgD=null; st.mgT='out'; st.mgOpen=id; st._mgIn=null; toast('تم إرسال المراسلة ✓'); window.scrollTo({top:0}); render();
}

    const name=$('#nun').value.trim(),u=$('#nuu').value.trim().toLowerCase(),p=$('#nup').value;
    if(!/^[a-z0-9._-]{3,30}$/.test(u)){$('#nue').textContent='اسم المستخدم بالإنجليزي (حروف وأرقام فقط، 3 أحرف على الأقل)';return;}
    if(p.length<8){$('#nue').textContent='كلمة المرور 8 أحرف على الأقل';return;}
    $('#nub').disabled=true;$('#nue').textContent='';
    const {error}=await sb.rpc('admin_create_user',{p_username:u,p_password:p,p_full_name:name});
    $('#nub').disabled=false;
    if(error){$('#nue').textContent=/admin_create_user|schema cache|function/i.test(error.message)?'شغّل ملف «إنشاء الحسابات» في Supabase أولاً':'تعذّر الإنشاء: '+error.message;return;}
    toast('تم إنشاء الحساب — حدّد صلاحياته'); render(); }
  if(e.target.classList.contains('pwf')){ e.preventDefault(); const uid=e.target.dataset.uid, inp=$('#pw_'+uid), pw=inp.value;
    if(pw.length<8){toast('كلمة المرور 8 أحرف على الأقل');return;}
    const {error}=await sb.rpc('admin_set_password',{target:uid,new_password:pw});
    if(error){toast(/function|schema cache/i.test(error.message)?'الميزة تحتاج تفعيل في قاعدة البيانات':'تعذّر التغيير: '+error.message);return;}
    inp.value=''; e.target.hidden=true; toast('تم تغيير كلمة المرور — أرسلها لصاحب الحساب'); return; }
  if(e.target.id==='cpf'){ e.preventDefault(); const {error}=await sb.auth.updateUser({password:$('#cpn').value}); toast(error?'تعذّر التغيير: '+error.message:'تم تغيير كلمة المرور'); if(!error) $('#cpn').value=''; }
});

document.addEventListener('input',e=>{ if(e.target.id!=='usq') return; st.uq=e.target.value; const q=e.target.value.trim().toLowerCase(); let n=0;
  document.querySelectorAll('.ucard[data-q]').forEach(c=>{const ok=!q||c.dataset.q.includes(q);c.hidden=!ok;if(ok)n++;}); const el=$('#usqn'); if(el) el.textContent=q?n+' نتيجة':n+' مستخدم'; });
// ----- data entry -----
V.data=async()=>{
  return `<div class="note">إدخال المبيعات والمنافذ وقوائم الدخل صار من داخل كل تطبيق (تبويب «الإدخال» أو «البيانات»)، والتحديث اليومي يصل تلقائياً من المهام المجدولة.</div>
  <div class="card"><h3>استيراد ملف بيانات</h3><p class="muted" style="margin-top:0;font-size:11.5px">ملف JSON يجهزه Claude من تطبيقاتك. المستندات الموجودة بنفس المعرّف تُستبدل بالجديدة.</p>
    <input type="file" id="impf" class="inp"><div id="impr" style="margin-top:10px"></div></div>`;
};
document.addEventListener('change',async e=>{
  if(e.target.id!=='impf'||!e.target.files[0]) return; const out=$('#impr'); out.innerHTML='<span class="muted">جارِ الاستيراد…</span>';
  try{
    const J=JSON.parse(await e.target.files[0].text()); const docs=J.app_docs||[]; if(!docs.length) throw new Error('الملف لا يحتوي بيانات تطبيقات');
    const now=new Date().toISOString(); const cnt={};
    for(let i=0;i<docs.length;i+=25){ const part=docs.slice(i,i+25).map(d=>({app:d.app,coll:d.coll,id:String(d.id),data:d.data,branches:d.branches||[],updated_at:now}));
      const {error}=await sb.from('app_docs').upsert(part,{onConflict:'app,coll,id'}); if(error) throw new Error(error.message);
      part.forEach(d=>cnt[d.app]=(cnt[d.app]||0)+1); out.innerHTML=`<span class="muted">جارِ الاستيراد… ${Math.min(i+25,docs.length)} / ${docs.length}</span>`; }
    st.cache={}; out.innerHTML=`<div class="ok">تم الاستيراد ✓ — ${Object.entries(cnt).map(([k,v])=>k+': '+v).join(' · ')}</div>`;
  }catch(err){ out.innerHTML=`<div class="err">تعذّر الاستيراد: ${esc(err.message)}</div>`; }
  e.target.value='';
});

// ================= render =================
async function render(){
  if(!SECTIONS.find(s=>s.id===st.tab)||(!allowed(st.tab)&&!isAdmin())) st.tab='home';
  if(st.f!=='all'&&!st.branches.some(b=>b.id===st.f)) st.f='all';
  if(st.branches.length===1) st.f=st.branches[0].id;
  const v=$('#view'); v.innerHTML='<div class="loading">جارِ التحميل…</div>';
  const sec=SECTIONS.find(s=>s.id===st.tab)||{}; document.body.classList.toggle('appmode',!!sec.app); document.body.classList.toggle('aimode',st.tab==='ai');
  const OBS={purch:['purch_view',['purch','purch_sup']],maint:['maint_view',['maint','maint_sup']],rets:['rets_view',['rets']]}; const ob=OBS[st.tab]; const ro=!!ob&&!isAdmin()&&st.mySections.includes(ob[0])&&!ob[1].some(k=>st.mySections.includes(k));
  ['purch','maint','rets'].forEach(k=>document.body.classList.toggle('ro-'+k,ro&&st.tab===k));
  const secX=SECTIONS.find(x=>x.id===st.tab)||{}; const roG=!ro&&!isAdmin()&&(st.myRO||[]).includes(secX.perm||st.tab); document.body.classList.toggle('ro-gen',roG); roWatch(roG);
  try{ v.innerHTML=(ro||roG?'<div class="ro-bar">👁️ وضع المراقبة — تشوف كل شي بدون موافقة أو تعديل</div>':'')+(st.tab==='home'?pushBox(false):st.tab==='me'?pushBox(false)+await mgBanner():'')+await V[st.tab](); v.querySelectorAll('.sc-end').forEach(s=>s.scrollLeft=s.scrollWidth); if(sec.app) fitApp(); if(sec.page) mountPage(sec); }
  catch(err){ console.error(err); v.innerHTML=`<div class="card"><div class="err">تعذّر تحميل البيانات: ${esc(err.message||err)}</div><button class="btn ghost sm" onclick="location.reload()">إعادة المحاولة</button></div>`; }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState!=='visible'||!st.profile) return; if(st.tab==='fleet'&&st.flEdit) return; const sec=SECTIONS.find(s=>s.id===st.tab)||{}; st.cache={}; st._aiCtx=null; st._alertsAt=0; st._mgIn=null; loadAlerts(); if(!sec.app&&st.tab!=='data'&&st.tab!=='ai') render(); });
sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){ $('#app').hidden=true; $('#login').hidden=false; } });
boot();
})();
</script>
</body>
