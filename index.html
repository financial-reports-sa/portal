      <form class="row nmf" data-uid="${u.id}" data-un="${esc(u.username)}" data-fn="${esc(u.full_name||'')}" hidden autocomplete="off"><div class="field"><label for="nu_${u.id}">اسم المستخدم للدخول (إنجليزي)</label><input class="inp" id="nu_${u.id}" name="un" required dir="ltr" autocapitalize="none" pattern="[a-z0-9._\-]{3,30}" value="${esc(u.username)}"></div><div class="field"><label for="nm_${u.id}">الاسم الظاهر</label><input class="inp" id="nm_${u.id}" name="fn" required maxlength="60" value="${esc(u.full_name||'')}"></div><div class="field" style="justify-content:flex-end;flex:none"><button class="btn sm" type="submit">حفظ</button></div></form>
      ${m?`<form class="row pwf" data-uid="${u.id}" hidden autocomplete="off"><div class="field"><label for="pw_${u.id}">كلمة المرور الجديدة لـ ${esc(u.full_name||u.username)}</label><input class="inp" id="pw_${u.id}" dir="ltr" minlength="8" required autocomplete="new-password"></div><div class="field" style="justify-content:flex-end;flex:none"><button class="btn sm" type="submit">حفظ</button></div></form>`:''}
      ${adminLike?`<div class="muted" style="font-size:13px">${u.role==='owner'?'المالك يرى كل شيء، ولا يمكن تعديل حسابه.':u.role==='sync'?'حساب المهام التلقائية: يكتب أرقام التقارير فقط، ولا يدير المستخدمين.':'الآدمن يرى كل الفروع والأقسام، ويدير المستخدمين.'}</div>`:
      `<div><div class="muted" style="font-size:12px;margin-bottom:4px">الفروع</div><div class="tgrid">${st.branches.map(b=>{const on=ub.some(x=>x.user_id===u.id&&x.branch_id===b.id);return `<button class="tg" data-tb="${u.id}" data-k="b:${b.id}" aria-pressed="${on}" ${m?'':'disabled'}><i class="dot" style="background:${b.color}"></i>${esc(b.name)}</button>`;}).join('')}</div></div>
      <div><div class="muted" style="font-size:12px;margin-bottom:4px">الأقسام</div><div class="tgrid">${PERM_SECTIONS.map(s=>{const on=us.some(x=>x.user_id===u.id&&x.section===s);return `<button class="tg" data-tb="${u.id}" data-k="s:${s}" aria-pressed="${on}" ${m?'':'disabled'}>${SEC_NAME[s]}</button>`;}).join('')}</div></div>
      ${us.some(x=>x.user_id===u.id&&x.section==='income')?'':us.some(x=>x.user_id===u.id&&x.section==='wh')?'<div class="muted" style="font-size:12px">يرى نسبة تكلفة المستودعات فقط، بدون الإيرادات أو المصروفات.</div>':''}`}
    </div></div>`;}).join('');
  h+=`<div class="card usr"><h3 style="font-size:15px">تغيير كلمة المرور الخاصة بك</h3><form class="row" id="cpf"><div class="field"><label for="cpn">كلمة المرور الجديدة</label><input class="inp" id="cpn" type="password" minlength="8" required dir="ltr" autocomplete="new-password"></div><div class="field" style="justify-content:flex-end"><button class="btn" type="submit">تغيير</button></div></form></div>`;
  return h;
};
document.addEventListener('click',async e=>{
  const uo=e.target.closest('[data-uo]'); if(uo){st.uOpen=st.uOpen||{};const o=!st.uOpen[uo.dataset.uo];st.uOpen[uo.dataset.uo]=o;uo.setAttribute('aria-expanded',o);uo.nextElementSibling.hidden=!o;return;}
  if(e.target.closest('[data-uadd]')){st.uAdd=!st.uAdd;render();return;}
  const t=e.target.closest('[data-tb]'); if(t&&!t.disabled){
    const uid=t.dataset.tb,[k,id]=t.dataset.k.split(':'),on=t.getAttribute('aria-pressed')==='true';
    const tbl=k==='b'?'user_branches':'user_sections',col=k==='b'?'branch_id':'section';
    t.disabled=true;
    const r=on?await sb.from(tbl).delete().eq('user_id',uid).eq(col,id):await sb.from(tbl).insert({user_id:uid,[col]:id});
    t.disabled=false; if(r.error){toast('تعذّر الحفظ: '+r.error.message);return;}
    t.setAttribute('aria-pressed',String(!on)); toast('تم الحفظ'); return;}
  const nt=e.target.closest('[data-nmt]'); if(nt){const f=document.querySelector(`.nmf[data-uid="${nt.dataset.nmt}"]`); if(f){f.hidden=!f.hidden; if(!f.hidden){const i=f.querySelector('input');i.focus();i.select();}} return;}
  const pt=e.target.closest('[data-pwt]'); if(pt){const f=document.querySelector(`.pwf[data-uid="${pt.dataset.pwt}"]`); if(f){f.hidden=!f.hidden; if(!f.hidden) f.querySelector('input').focus();} return;}
  const a=e.target.closest('[data-act]'); if(a){const {error}=await sb.from('profiles').update({active:a.dataset.to==='1'}).eq('id',a.dataset.act);if(error){toast('تعذّر: '+error.message);return;}render();return;}
  const r=e.target.closest('[data-role]'); if(r){const {error}=await sb.from('profiles').update({role:r.dataset.to}).eq('id',r.dataset.role);if(error){toast('تعذّر: '+error.message);return;}render();}
});
document.addEventListener('submit',async e=>{
  if(e.target.classList.contains('nmf')){ e.preventDefault();
    const f=e.target,uid=f.dataset.uid,un=f.querySelector('[name=un]').value.trim().toLowerCase(),fn=f.querySelector('[name=fn]').value.trim(),b=f.querySelector('button');
    if(!/^[a-z0-9._-]{3,30}$/.test(un)){toast('اسم المستخدم بالإنجليزي: حروف وأرقام فقط، 3 أحرف على الأقل');return;}
    if(!fn){toast('اكتب الاسم الظاهر');return;}
    const need=e=>/set_username|set_full_name|function|schema cache/i.test(e.message)?'شغّل ملف names.sql مرة واحدة في Supabase أولاً':e.message;
    b.disabled=true; let err=null;
    if(un!==f.dataset.un){ const r=await sb.rpc('set_username',{p_uid:uid,p_username:un}); if(r.error) err=need(r.error); }
    if(!err&&fn!==f.dataset.fn){ const r=await sb.rpc('set_full_name',{p_uid:uid,p_name:fn}); if(r.error) err=need(r.error); }
    b.disabled=false;
    if(err){toast('تعذّر: '+err);return;}
    if(uid===st.user.id&&st.profile){ st.profile.full_name=fn; st.profile.username=un; $('#uname').textContent=fn||un; $('#urole').textContent=ROLE_NAME[st.profile.role]+' · '+un; }
    toast(un!==f.dataset.un?'تم — الدخول من الآن باسم المستخدم: '+un:'تم الحفظ'); render(); return; }
  if(e.target.id==='nuf'){ e.preventDefault();
    const name=$('#nun').value.trim(),u=$('#nuu').value.trim().toLowerCase(),p=$('#nup').value;
    if(!/^[a-z0-9._-]{3,30}$/.test(u)){$('#nue').textContent='اسم المستخدم بالإنجليزي (حروف وأرقام فقط، 3 أحرف على الأقل)';return;}
    if(p.length<8){$('#nue').textContent='كلمة المرور 8 أحرف على الأقل';return;}
    $('#nub').disabled=true;$('#nue').textContent='';
    const tmp=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'tmp-signup'}});
    const {data,error}=await tmp.auth.signUp({email:u+'@'+DOMAIN,password:p,options:{data:{username:u,full_name:name}}});
    $('#nub').disabled=false;
    if(error){$('#nue').textContent=/registered|exists/i.test(error.message)?'اسم المستخدم مستخدم من قبل':'تعذّر الإنشاء: '+error.message;return;}
    if(data.user&&data.user.identities&&data.user.identities.length===0){$('#nue').textContent='اسم المستخدم مستخدم من قبل';return;}
    toast('تم إنشاء الحساب — حدّد صلاحياته'); render(); }
  if(e.target.classList.contains('pwf')){ e.preventDefault(); const uid=e.target.dataset.uid, inp=$('#pw_'+uid), pw=inp.value;
    if(pw.length<8){toast('كلمة المرور 8 أحرف على الأقل');return;}
    const {error}=await sb.rpc('admin_set_password',{target:uid,new_password:pw});
    if(error){toast(/function|schema cache/i.test(error.message)?'الميزة تحتاج تفعيل في قاعدة البيانات':'تعذّر التغيير: '+error.message);return;}
    inp.value=''; e.target.hidden=true; toast('تم تغيير كلمة المرور — أرسلها لصاحب الحساب'); return; }
  if(e.target.id==='cpf'){ e.preventDefault(); const {error}=await sb.auth.updateUser({password:$('#cpn').value}); toast(error?'تعذّر التغيير: '+error.message:'تم تغيير كلمة المرور'); if(!error) $('#cpn').value=''; }
});

document.addEventListener('input',e=>{ if(e.target.id!=='usq') return; st.uq=e.target.value; const q=e.target.value.trim().toLowerCase(); let n=0;
  document.querySelectorAll('.ucard[data-q]').forEach(c=>{const ok=!q||c.dataset.q.includes(q);c.hidden=!ok;if(ok)n++;}); const el=$('#usqn'); if(el) el.textContent=q?n+' نتيجة':n+' مستخدم'; });
// ----- data entry -----
V.data=async()=>{
  return `<div class="note">إدخال المبيعات والمنافذ وقوائم الدخل صار من داخل كل تطبيق (تبويب «الإدخال» أو «البيانات»)، والتحديث اليومي يصل تلقائياً من المهام المجدولة.</div>
  <div class="card"><h3>استيراد ملف بيانات</h3><p class="muted" style="margin-top:0;font-size:13px">ملف JSON يجهزه Claude من تطبيقاتك. المستندات الموجودة بنفس المعرّف تُستبدل بالجديدة.</p>
    <input type="file" id="impf" class="inp"><div id="impr" style="margin-top:10px"></div></div>`;
};
document.addEventListener('change',async e=>{
  if(e.target.id!=='impf'||!e.target.files[0]) return; const out=$('#impr'); out.innerHTML='<span class="muted">جارِ الاستيراد…</span>';
  try{
    const J=JSON.parse(await e.target.files[0].text()); const docs=J.app_docs||[]; if(!docs.length) throw new Error('الملف لا يحتوي بيانات تطبيقات');
    const now=new Date().toISOString(); const cnt={};
    for(let i=0;i<docs.length;i+=25){ const part=docs.slice(i,i+25).map(d=>({app:d.app,coll:d.coll,id:String(d.id),data:d.data,branches:d.branches||[],updated_at:now}));
      const {error}=await sb.from('app_docs').upsert(part,{onConflict:'app,coll,id'}); if(error) throw new Error(error.message);
      part.forEach(d=>cnt[d.app]=(cnt[d.app]||0)+1); out.innerHTML=`<span class="muted">جارِ الاستيراد… ${Math.min(i+25,docs.length)} / ${docs.length}</span>`; }
    st.cache={}; out.innerHTML=`<div class="ok">تم الاستيراد ✓ — ${Object.entries(cnt).map(([k,v])=>k+': '+v).join(' · ')}</div>`;
  }catch(err){ out.innerHTML=`<div class="err">تعذّر الاستيراد: ${esc(err.message)}</div>`; }
  e.target.value='';
});

// ================= render =================
async function render(){
  if(!allowed(st.tab)&&!(isAdmin()&&SECTIONS.find(s=>s.id===st.tab))) st.tab='home';
  if(st.f!=='all'&&!st.branches.some(b=>b.id===st.f)) st.f='all';
  if(st.branches.length===1) st.f=st.branches[0].id;
  const v=$('#view'); v.innerHTML='<div class="loading">جارِ التحميل…</div>';
  const sec=SECTIONS.find(s=>s.id===st.tab)||{}; document.body.classList.toggle('appmode',!!sec.app);
  try{ v.innerHTML=(['home','me'].includes(st.tab)?pushBox(false):'')+await V[st.tab](); v.querySelectorAll('.sc-end').forEach(s=>s.scrollLeft=s.scrollWidth); if(sec.app) fitApp(); if(sec.page) mountPage(sec); }
  catch(err){ console.error(err); v.innerHTML=`<div class="card"><div class="err">تعذّر تحميل البيانات: ${esc(err.message||err)}</div><button class="btn ghost sm" onclick="location.reload()">إعادة المحاولة</button></div>`; }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState!=='visible'||!st.profile) return; if(st.tab==='fleet'&&st.flEdit) return; const sec=SECTIONS.find(s=>s.id===st.tab)||{}; st.cache={}; st._alertsAt=0; loadAlerts(); if(!sec.app&&st.tab!=='data') render(); });
sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){ $('#app').hidden=true; $('#login').hidden=false; } });
boot();
})();
</script>
