<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#143F2A">
<title>MyHub · منصة الإدارة الموحّدة</title>
<link rel="manifest" href="manifest.json?v=5">
<link rel="icon" href="icon.svg?v=4" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyHub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=Montserrat:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=7"></script>
<style>
:root{
  --bg:#F5F5F1; --card:#FFFFFF; --line:#E6E6E0; --fg:#18231C; --muted:#6B706A;
  --green:#1E5A3E; --green-dk:#143F2A;
  --gold:#D4AF37; --gold-ink:#9A7B12; --gold-soft:#FBF5E1;
  --up:#1FA16B; --down:#D0453A; --warn:#C98A0C; --chip:#EEEEE8;
  --shadow:0 1px 2px rgba(22,35,58,.05),0 4px 16px rgba(22,35,58,.05);
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-disp:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.wrap>*{min-width:0}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-disp)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);overflow:hidden}
.card h3{font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.est{background:rgba(201,138,12,.15);color:var(--warn);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:19px;flex:none}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.inp{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-height:42px}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;font-weight:600;min-height:42px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--down);font-size:13px;min-height:1.2em}
.ok{color:var(--up);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}


/* الشريط المتحرك */
.tkr{display:flex;align-items:stretch;height:36px;border-radius:12px;overflow:hidden;background:linear-gradient(90deg,#123A27,#1E5A3E 50%,#123A27);border:1px solid rgba(212,175,55,.45);box-shadow:0 4px 14px -8px rgba(18,58,39,.6);position:relative}
.tkr[hidden]{display:none}
.tkr-lbl{flex:none;display:flex;align-items:center;gap:6px;padding-inline:11px 10px;background:linear-gradient(135deg,#F3E2A6,#D4AF37);color:#3E2F05;font-family:var(--f-disp);font-weight:700;font-size:12.5px;position:relative;z-index:2;box-shadow:-6px 0 12px -4px rgba(0,0,0,.35)}
.tkr-lbl i{width:7px;height:7px;border-radius:50%;background:#C0392B;box-shadow:0 0 0 0 rgba(192,57,43,.6);animation:tkrPulse 1.6s infinite}
.tkr-vp{flex:1;min-width:0;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.tkr-track{display:flex;width:max-content;height:100%;align-items:center;animation:tkrMove var(--tkd,40s) linear infinite;will-change:transform}
.tkr-seq{display:flex;align-items:center;flex:none}
.tkr:hover .tkr-track,.tkr.paused .tkr-track{animation-play-state:paused}
.tkr-it{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:#fff;font:inherit;font-size:13px;white-space:nowrap;padding:0 4px;cursor:pointer}
.tkr-it b{color:#F6E7B0;font-weight:700}
.tkr-it.bad b{color:#FFB4A8}
.tkr-it .up{color:#8EE3B5;font-weight:700}.tkr-it .dn{color:#FFB4A8;font-weight:700}
.tkr-sep{flex:none;color:#D4AF37;font-size:9px;padding:0 12px;opacity:.85}
@keyframes tkrMove{from{transform:translateX(0)}to{transform:translateX(50%)}}
@keyframes tkrPulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.6)}70%{box-shadow:0 0 0 7px rgba(192,57,43,0)}100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}}
@media (prefers-reduced-motion:reduce){.tkr-track{animation:none}.tkr-vp{overflow-x:auto;scrollbar-width:none}}
body.appmode .tkr{display:none}

.advdel{border:1px solid var(--line);background:var(--card);border-radius:9px;width:30px;height:30px;display:grid;place-items:center;font-size:13px;cursor:pointer;flex:none;padding:0}
.advdel:active{background:rgba(208,69,58,.12)}

/* الرئيسية */
.hx-hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 14px;color:#fff;background:radial-gradient(130% 120% at 100% 0%,#2E7350 0%,#1E5A3E 42%,#0F3322 100%);box-shadow:0 18px 40px -22px rgba(15,51,34,.75);border:1px solid rgba(212,175,55,.25)}
.hx-glow{position:absolute;inset-inline-start:-60px;bottom:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(233,207,122,.20),transparent 70%);pointer-events:none}
.hx-hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px);pointer-events:none}
.hx-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hx-date{font-size:12px;opacity:.7}.hx-hi{font-family:var(--f-disp);font-size:18px;font-weight:600}
.hx-tag{flex:none;font-size:11.5px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15)}
.hx-main{position:relative;z-index:1;display:flex;align-items:center;gap:12px;margin-top:14px}
.hx-lbl{font-size:12px;opacity:.78}
.hx-big{font-size:clamp(28px,9vw,38px);font-weight:700;color:#F6E7B0;line-height:1.15;letter-spacing:-.5px;white-space:nowrap}
.hx-big small{font-size:12px;color:#fff;opacity:.75;font-weight:500;margin-inline-start:5px;letter-spacing:0}
.hx-chg{font-size:12px;opacity:.9;margin-top:2px}.hx-chg b.u,.hx-pace.u i,.hx-stats em.u{color:#8EE3B5}.hx-chg b.d,.hx-stats em.d{color:#FFB4A8}
.hx-ring{position:relative;flex:none;width:84px;height:84px}
.hx-rtx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.hx-rtx b{font-size:18px;color:#F6E7B0}.hx-rtx span{font-size:9.5px;opacity:.75}
.hx-arc{animation:hxArc 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes hxArc{from{stroke-dashoffset:var(--c)}}
.hx-pace{position:relative;z-index:1;margin-top:10px;font-size:11.5px;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.18);border-radius:10px;padding:6px 10px;line-height:1.5}
.hx-pace i{flex:none;width:8px;height:8px;border-radius:50%;background:#8EE3B5;box-shadow:0 0 0 3px rgba(142,227,181,.18)}
.hx-pace.d i{background:#FFB4A8;box-shadow:0 0 0 3px rgba(255,180,168,.18)}
.hx-spark{position:relative;z-index:1;margin:8px -4px 0}.hx-spark svg{width:100%;height:auto}
.hx-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.hx-stats button{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);border-radius:13px;padding:8px 8px;color:#fff;font:inherit;text-align:start;display:flex;flex-direction:column;gap:1px;min-width:0;cursor:pointer}
.hx-stats span{font-size:10.5px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hx-stats b{font-size:15px}.hx-stats em{font-style:normal;font-size:10px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hx-tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:start;font:inherit;color:inherit;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0;box-shadow:0 6px 18px -14px rgba(20,40,30,.35)}
.hx-tile:last-child:nth-child(odd){grid-column:span 2;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}.hx-tile:last-child:nth-child(odd) .hx-ic{grid-row:span 3;margin:0;width:42px;height:42px;font-size:20px}
.hx-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;margin-bottom:6px}
.hx-tl{font-size:11.5px;color:var(--muted)}.hx-tile b{font-size:19px;font-weight:700}.hx-ts{font-size:11px;color:var(--muted)}
.hx-tasks h3,.hx-ai h3{font-size:15px}
.hx-cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--down,#D0453A);color:#fff;font-size:11px;padding:0 6px;margin-inline-start:4px;vertical-align:2px}
.hx-tk,.hx-in{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;font:inherit;color:inherit;text-align:start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hx-tk:last-child,.hx-in:last-child{border-bottom:0}
.hx-tki,.hx-ii{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;background:var(--gold-soft)}
.hx-tki.bad{background:rgba(208,69,58,.12)}
.hx-tkt{flex:1;min-width:0;display:flex;flex-direction:column}.hx-tkt b{font-size:13px;font-weight:600}.hx-tkt small{font-size:11.5px;color:var(--muted)}
.hx-ia{flex:none;color:var(--muted);font-size:18px;opacity:.6}
.hx-clear{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(30,90,62,.07);border:1px dashed rgba(30,90,62,.3)}.hx-clear>span{font-size:22px}
.hx-ai{background:linear-gradient(180deg,rgba(212,175,55,.08),var(--card) 90px)}
.hx-aih{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.hx-aib{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:17px;color:#3E2F05;background:linear-gradient(135deg,#F6E7B0,#D4AF37);box-shadow:0 6px 14px -6px rgba(212,175,55,.8)}
.hx-it{flex:1;font-size:13px;line-height:1.75}
.hx-in.bad .hx-ii{background:rgba(208,69,58,.12)}.hx-in.warn .hx-ii{background:rgba(230,150,40,.15)}.hx-in.ok .hx-ii{background:rgba(30,140,90,.12)}
.hx-rank{display:flex;flex-direction:column;gap:4px}
.hx-rk{display:flex;align-items:center;gap:10px;border:0;background:none;font:inherit;color:inherit;text-align:start;padding:8px 0;cursor:pointer;border-bottom:1px solid var(--line)}.hx-rk:last-child{border-bottom:0}
.hx-md{flex:none;width:30px;text-align:center;font-size:20px}
.hx-g{font-weight:700;padding:1px 7px;border-radius:99px}.hx-g.u{color:#17804F;background:rgba(23,128,79,.1)}.hx-g.d{color:#C0392B;background:rgba(192,57,43,.1)}
.hx-sc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hx-sc button{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font:inherit;color:inherit}
.hx-sc button span{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--card);box-shadow:0 4px 10px -6px rgba(20,40,30,.35)}
.hx-sc small{font-size:10.5px;line-height:1.3;text-align:center}
@media (prefers-reduced-motion:reduce){.hx-arc{animation:none}}


.sbw{margin-top:4px}
.sb-info{margin-top:8px;min-height:40px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12.5px;line-height:1.7;display:flex;flex-direction:column;justify-content:center}.sb-info>div{display:block}
.sb-info>span.muted{font-size:11.5px;text-align:center}
.sb-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 10px}
.sb-kpi>div{background:var(--bg);border-radius:12px;padding:7px 8px;display:flex;flex-direction:column;min-width:0}
.sb-kpi span{font-size:10.5px;color:var(--muted)}.sb-kpi b{font-size:14.5px}.sb-kpi em{font-style:normal;font-size:10.5px;color:var(--muted);line-height:1.35}
.sb-leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted);margin-top:8px}.sb-leg span{display:inline-flex;align-items:center;gap:5px}
.sb-pj{width:12px;height:10px;border:1px dashed rgba(212,175,55,.9);background:repeating-linear-gradient(45deg,rgba(212,175,55,.5) 0 2px,rgba(212,175,55,.1) 2px 5px);border-radius:2px;display:inline-block}
.sb-av{width:14px;height:0;border-top:2px dashed #1E5A3E;display:inline-block}
.sb-note{margin-top:10px;font-size:12.5px;line-height:1.7;background:linear-gradient(90deg,rgba(212,175,55,.10),transparent);border-inline-start:3px solid #D4AF37;border-radius:8px;padding:7px 10px}


/* تقييم العملاء */
.fb-hero{position:relative;overflow:hidden;border-radius:22px;padding:18px;color:#fff;background:radial-gradient(130% 120% at 100% 0%,#2E7350 0%,#1E5A3E 42%,#0F3322 100%);border:1px solid rgba(212,175,55,.25)}
.fb-k{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);border-radius:13px;padding:8px;display:flex;flex-direction:column;min-width:0}.fb-k span{font-size:10.5px;opacity:.75;white-space:nowrap}.fb-k b{font-size:15px}
.fb-stars{color:#E2B93B;letter-spacing:1px;direction:ltr;display:inline-block}.fb-stars i{font-style:normal;color:rgba(160,160,150,.35)}
.fb-row{display:flex;gap:10px;align-items:flex-start;width:100%;border:0;background:none;font:inherit;color:inherit;text-align:start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.fb-row:last-child{border-bottom:0}.fb-row.late{background:linear-gradient(90deg,transparent,rgba(208,69,58,.05))}
.fb-face{flex:none;width:40px;height:40px;border-radius:13px;background:var(--bg);display:grid;place-items:center;font-size:22px}
.fb-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fb-cm{font-size:13.5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fb-meta{font-size:11.5px;color:var(--muted)}
.fb-end{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.fb-late{font-size:10.5px;font-weight:700;color:#fff;background:var(--down);border-radius:99px;padding:2px 8px}
.fb-dist{display:flex;align-items:center;gap:10px;font-size:12.5px;margin:6px 0}.fb-dist span{width:30px;flex:none;color:var(--gold-ink);font-weight:700}.fb-dist .meter{flex:1;margin:0}.fb-dist b{width:28px;text-align:end}
.fb-tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.fb-tg .tag{margin:0 0 4px 4px;display:inline-block}
.mtd-act .btn{flex:1 1 auto}
#fbqr{position:fixed;inset:0;z-index:72;background:var(--bg);display:flex;flex-direction:column}.fbq-body>*{flex:none}
.fbq-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center;gap:16px}
.fbq-card{width:100%;max-width:380px;background:#fff;border-radius:22px;padding:22px 20px;text-align:center;border:2px solid var(--c);box-shadow:0 14px 30px -22px rgba(0,0,0,.5);position:relative;overflow:hidden;color:#16231B}
.fbq-card::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,#1E5A3E,var(--c),#D4AF37)}
.fbq-top b{display:block;font-family:var(--f-disp);font-size:20px;color:#1E5A3E}.fbq-top span{font-size:13px;color:#6B746C}
.fbq-h{font-family:var(--f-disp);font-size:26px;font-weight:700;margin-top:12px}.fbq-s{font-size:14px;color:#4A544C}.fbq-st{color:#D4AF37;font-size:22px;letter-spacing:3px;margin:6px 0}
.fbq-qr{width:72%;margin:6px auto 4px;padding:10px;border-radius:16px;border:1.5px dashed #D4AF37}.fbq-qr svg{width:100%;height:auto;display:block}
.fbq-en{font-size:12.5px;color:#6B746C;letter-spacing:.3px}
.fbq-u{margin-top:12px;font-size:11px;color:#6B746C;display:flex;flex-direction:column;gap:6px;align-items:center;word-break:break-all}
@media print{body.fbprinting>*:not(#fbqr){display:none!important}body.fbprinting #fbqr{position:static}body.fbprinting .noprint{display:none!important}body.fbprinting .fbq-body{overflow:visible;padding:0}body.fbprinting .fbq-card{page-break-after:always;max-width:none;width:100%;box-shadow:none;margin-top:40px}}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding-inline:16px;padding-block:40px}
.login-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}

/* header + nav */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.who{position:relative}
.top{flex-wrap:nowrap!important}
.mark{width:38px!important;height:38px!important;border-radius:11px!important;font-size:17px!important}
.avatar{border:0;cursor:pointer;font:inherit;font-weight:700}
.mybtn{border:1px solid #D9BC5C;cursor:pointer;background:linear-gradient(135deg,#F3E2A6,#D4AF37);color:#3E2F05;font-family:var(--f-disp);font-weight:700;font-size:14px;letter-spacing:.2px;padding:8px 14px;border-radius:99px;box-shadow:0 3px 10px rgba(154,123,18,.22);white-space:nowrap}
.umenu{position:absolute;inset-inline-end:0;top:46px;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(22,35,58,.15);padding:12px;width:240px;display:flex;flex-direction:column;gap:10px}
.umenu .scope{font-size:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;font-weight:700;flex:none}
.scope{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:20;background:var(--bg);padding-block:8px;margin-block:-8px;box-shadow:0 6px 10px -10px rgba(20,24,20,.3)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chips button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg);font-weight:600}
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mon{display:flex;align-items:center;gap:6px}
.mon b{font-family:var(--f-disp);font-weight:600;min-width:110px;text-align:center}
.icb{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:16px}
.icb:disabled{opacity:.35}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi .val{font-size:23px;font-weight:700}
.kpi .sub{font-size:12px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid2>*{min-width:0}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
svg text{font-family:var(--f-body)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;border-top:2px solid var(--fg)}
tr.sub td{font-weight:600;background:var(--bg)}
.branch-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.bc{border-top:4px solid var(--c);display:flex;flex-direction:column;gap:8px}
.bc .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meter{height:6px;border-radius:99px;background:var(--chip);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c)}
.note{font-size:13px;border-inline-start:3px solid var(--gold);padding-inline-start:10px}
.note.bad{border-color:var(--down)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* users */
.ucard{display:flex;flex-direction:column;gap:10px}
.uhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tgrid{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.tg[aria-pressed="true"]{background:var(--up);border-color:var(--up);color:#fff}
.tg:disabled{opacity:.55;cursor:not-allowed}
.role{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.role.owner{background:var(--gold-soft);color:var(--gold-ink)}
.role.admin{background:rgba(91,143,208,.15);color:#3C6FB0}
.role.user,.role.sync{background:var(--chip);color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin:0 auto;max-width:360px;background:var(--fg);color:var(--bg);text-align:center;border-radius:12px;padding:10px 14px;z-index:30;transition:opacity .25s}
.toast.hide{opacity:0;pointer-events:none}
.loading{display:flex;justify-content:center;padding:40px;color:var(--muted)}
footer{font-size:12px;color:var(--muted);text-align:center}
.mark{background:linear-gradient(135deg,var(--green),var(--green-dk))!important;color:var(--gold)!important;box-shadow:0 4px 12px rgba(45,91,59,.25)}
.btn{background:var(--green-dk)}
.tabs button[aria-pressed="true"]{background:var(--green-dk);color:#fff;border-color:var(--green-dk);box-shadow:0 2px 8px rgba(20,63,42,.22)}
.tabs button{border-color:var(--line);color:#4F554F}
h1{color:var(--green-dk);letter-spacing:-.2px}
.kpi .val{color:var(--fg)}
.kpi .lbl{letter-spacing:.1px}
tr.total td{border-top-color:var(--green-dk)}
.chips button[aria-pressed="true"]{border-color:var(--green-dk);box-shadow:inset 0 0 0 1px var(--green-dk);color:var(--green-dk)}
.card{border-color:var(--line);box-shadow:0 1px 2px rgba(20,24,20,.04),0 4px 14px rgba(20,24,20,.05)}
.avatar{background:linear-gradient(135deg,#F6E7B0,var(--gold))!important;color:#4A3A08!important}
.tg[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.note{border-color:var(--gold)}
button:focus-visible,input:focus-visible,select:focus-visible{outline-color:var(--green)}
.appframe{display:block;width:calc(100% + 32px);margin-inline:-16px;border:0;border-radius:0;background:var(--bg);height:70vh}
@media (min-width:760px){.appframe{width:100%;margin-inline:0;border:1px solid var(--line);border-radius:16px}}
.pageframe{display:block;width:calc(100% + 32px);margin-inline:-16px;border:0;border-radius:0;background:var(--card);min-height:400px}
@media (min-width:760px){.pageframe{width:100%;margin-inline:0;border:1px solid var(--line);border-radius:14px}}
body.appmode .wrap{padding-bottom:8px;gap:10px}
body.appmode footer{display:none}

@media (max-width:760px){
  body{font-size:13.5px}
  .wrap{padding-inline:14px;padding-block:12px 40px;gap:12px}
  .brand h1{font-size:16px!important;line-height:1.25!important}
  .brand h1+div{font-size:11.5px!important}
  .mybtn{font-size:12px;padding:6px 12px}
  .tabs{gap:5px}
  .tabs button{font-size:12.5px;padding:5px 12px}
  .chips button{font-size:12px;padding:4px 10px}
  .card{padding:13px;border-radius:12px}
  .card h3{font-size:14.5px}
  .kpi .lbl{font-size:12px}.kpi .val{font-size:20px}.kpi .sub{font-size:11px}
  table{font-size:12.5px} th{font-size:11px} th,td{padding:7px 8px}
  .mon b{font-size:14px;min-width:96px}
  .icb{width:30px;height:30px}
  .note{font-size:12px}
  .tag{font-size:11px}
}

/* header actions + bottom nav */
.who{display:flex;align-items:center;gap:8px}
.hbtn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--green-dk);flex:none;box-shadow:0 2px 8px rgba(20,24,20,.06)}
.hbtn .bd{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--down);color:#fff;border-radius:99px;font-size:10px;font-weight:700;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;border:2px solid var(--bg)}
.avb{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(135deg,#F3E2A6,#D4AF37);color:#3E2F05;font-family:var(--f-disp);font-weight:700;font-size:16px;cursor:pointer;flex:none;box-shadow:0 3px 10px rgba(154,123,18,.25)}
.npanel{position:absolute;inset-inline-end:0;top:48px;z-index:41;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 34px rgba(20,24,20,.18);width:min(330px,calc(100vw - 28px));max-height:70vh;overflow:auto;padding:12px}
.npanel h4{margin:0 0 8px;font-family:var(--f-disp);font-size:15px}
.nitem{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:start;font:inherit;color:inherit;cursor:pointer}
.nitem:last-child{border-bottom:0}
.nitem .ic{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:14px}
.nitem .tx{font-size:12.5px;line-height:1.6}
.nitem .tx small{display:block;color:var(--muted);font-size:11px}
.bnav{position:fixed;bottom:0;inset-inline:0;z-index:35;display:flex;justify-content:space-around;align-items:stretch;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(20,24,20,.06)}
.bnav button{flex:1;max-width:110px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border-radius:14px;color:#7A7F78;font:inherit;font-size:10.5px;font-weight:600;cursor:pointer}
.bnav button svg{width:23px;height:23px}
.bnav button[aria-pressed="true"]{color:var(--green-dk)}
.bnav button[aria-pressed="true"] .bi{background:rgba(30,90,62,.1)}
.bnav .bi{width:46px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
body.hasnav .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.hasnav .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.tabs:empty{display:none}
/* splash */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;cursor:pointer;color:#fff;
  background:radial-gradient(130% 95% at 50% 38%,#3C7550 0%,#2A5638 42%,#14301F 78%,#0D2216 100%);transition:opacity .7s ease,visibility .7s}
#splash.out{opacity:0;visibility:hidden}
#splash.out .sp-in{transform:scale(1.06);filter:blur(3px)}
#splash .sp-grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(233,207,122,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(233,207,122,.05) 1px,transparent 1px);background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 42%,#000 0%,transparent 62%);-webkit-mask-image:radial-gradient(circle at 50% 42%,#000 0%,transparent 62%);animation:spGrid 8s linear infinite,spFade 1.2s ease-out both}
#splash .sp-sweep{position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(246,231,176,.09) 50%,transparent 62%);transform:translateX(-120%);animation:spSweep 1.6s 2.75s ease-in-out forwards}
#splash .sp-vig{position:absolute;inset:0;box-shadow:inset 0 0 160px 40px rgba(0,0,0,.45);pointer-events:none}
#splash .sp-dust i{position:absolute;bottom:-10px;width:2.5px;height:2.5px;border-radius:50%;background:#F6E7B0;box-shadow:0 0 8px 2px rgba(233,207,122,.55);opacity:0;animation:spDust 5.5s linear infinite}
#splash .sp-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;padding:24px;transition:transform .7s ease,filter .7s ease}
#splash .sp-logo{position:relative;width:120px;height:120px;display:grid;place-items:center}
#splash .sp-ring{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}
#splash .sp-ring circle{fill:none;stroke-linecap:round}
#splash .sp-ring .r1{stroke:rgba(233,207,122,.14);stroke-width:1}
#splash .sp-ring .r2{stroke:url(#spg);stroke-width:1.6;stroke-dasharray:390;stroke-dashoffset:390;animation:spRing 1.4s .2s cubic-bezier(.6,.05,.25,1) forwards}
#splash .sp-orbit{position:absolute;inset:0;opacity:0;animation:spFade .4s 1.6s forwards,spSpin 3.2s 1.6s linear infinite}
#splash .sp-orbit::before{content:"";position:absolute;top:-2.5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#FFF7DC;box-shadow:0 0 10px 3px rgba(246,231,176,.7)}
#splash .sp-ping{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(246,231,176,.55);opacity:0;animation:spPing 1.2s 2.85s cubic-bezier(.2,.7,.3,1) forwards}
#splash .sp-glow{position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle,rgba(233,207,122,.26),transparent 70%);opacity:0;animation:spPulse 2.6s 1.2s ease-in-out infinite}
#splash .sp-mark{position:relative;width:74px;height:74px;border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.03));border:1px solid rgba(233,207,122,.45);
  display:grid;place-items:center;padding:0;box-shadow:0 18px 40px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.22);backdrop-filter:blur(6px);animation:spPop .8s .1s cubic-bezier(.2,.9,.25,1.15) both}
#splash .sp-g4{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:40px;height:40px;direction:ltr}#splash .sp-g4 i{display:block;border-radius:6px;background:linear-gradient(#FFF4CC,#C9A227);transform:scale(0);animation:spG4 .55s cubic-bezier(.2,.9,.3,1.3) forwards}#splash .sp-g4 i:nth-child(1){animation-delay:.6s}#splash .sp-g4 i:nth-child(2){background:none;border:2.5px solid #E9CF7A;animation-delay:.75s}#splash .sp-g4 i:nth-child(3){animation-delay:.9s}#splash .sp-g4 i:nth-child(4){animation-delay:1.05s;box-shadow:0 0 12px rgba(246,231,176,.5)}
#splash .sp-bars{display:flex;align-items:flex-end;gap:6px;height:40px;direction:ltr}
#splash .sp-bars i{display:block;width:9px;border-radius:3px 3px 1.5px 1.5px;background:linear-gradient(#F6E7B0,#C9A227);transform-origin:bottom;animation:spBar .8s cubic-bezier(.2,.8,.2,1) both}
#splash .sp-bars i:nth-child(1){height:40%;animation-delay:.7s}#splash .sp-bars i:nth-child(2){height:68%;animation-delay:.85s}#splash .sp-bars i:nth-child(3){height:100%;animation-delay:1s;background:linear-gradient(#FFF7DC,#E9CF7A);box-shadow:0 0 12px rgba(246,231,176,.5)}
#splash .sp-stage{display:grid;place-items:center;min-height:86px;width:300px;max-width:88vw}
#splash .sp-stage>div{grid-area:1/1;display:flex;flex-direction:column;align-items:center;gap:10px}
/* المرحلة الأولى: My Reports */
#splash .sp-a{animation:spOutA .65s 2.75s cubic-bezier(.5,0,.75,0) forwards}
#splash .sp-word{position:relative;font-family:"Montserrat","Readex Pro",sans-serif;font-weight:600;font-size:21px;text-transform:uppercase;direction:ltr;padding-inline-start:.38em;
  background:linear-gradient(100deg,#D9B850 0%,#F3E3A8 35%,#FFFFFF 48%,#F3E3A8 61%,#C9A227 100%);background-size:250% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:.38em;opacity:0;filter:blur(8px);animation:spTrack 1.25s 1.15s cubic-bezier(.2,.75,.2,1) forwards,spGleam 1.3s 1.9s ease-in-out forwards}
#splash .sp-orn{display:flex;align-items:center;gap:10px;direction:ltr}
#splash .sp-orn s{display:block;height:1px;width:0;background:linear-gradient(90deg,transparent,#E9CF7A)}
#splash .sp-orn s:last-child{background:linear-gradient(90deg,#E9CF7A,transparent)}
#splash .sp-orn s{animation:spHair .9s 1.7s cubic-bezier(.6,.05,.25,1) forwards}
#splash .sp-orn em{width:5px;height:5px;transform:rotate(45deg) scale(0);background:#E9CF7A;box-shadow:0 0 8px #F6E7B0;animation:spGem .5s 1.6s cubic-bezier(.2,.9,.3,1.4) forwards}
#splash .sp-tag{font-family:"Montserrat",sans-serif;font-weight:400;font-size:9.5px;letter-spacing:.42em;padding-inline-start:.42em;text-transform:uppercase;direction:ltr;color:rgba(232,238,220,.6);opacity:0;animation:spRise .7s 1.9s ease-out forwards}
/* المرحلة الثانية: منصة الإدارة الموحّدة */
#splash .sp-b{gap:12px}
#splash .sp-ar{font-family:"Readex Pro",var(--f-disp);font-weight:600;font-size:23px;white-space:nowrap;line-height:1.3;
  background:linear-gradient(180deg,#FFFDF3 0%,#F3E3A8 60%,#D9B850 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  clip-path:inset(0 0 0 100%);filter:drop-shadow(0 4px 18px rgba(0,0,0,.25));animation:spWipe 1s 3.2s cubic-bezier(.65,0,.25,1) forwards}
#splash .sp-b .sp-orn s{animation:spHair .8s 3.75s cubic-bezier(.6,.05,.25,1) forwards}
#splash .sp-b .sp-orn em{animation:spGem .5s 3.65s cubic-bezier(.2,.9,.3,1.4) forwards}
#splash .sp-grp{font-size:13px;color:#DCE6CF;letter-spacing:.3px;opacity:0;animation:spRise .7s 3.95s ease-out forwards}
#splash .sp-load{width:150px;display:flex;flex-direction:column;align-items:center;gap:9px;opacity:0;animation:spFade .5s 3.9s ease-out forwards}
#splash .sp-bar{width:100%;height:1.5px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#splash .sp-bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#C9A227,#F6E7B0);box-shadow:0 0 8px #E9CF7A;animation:spFill 1.5s 4s cubic-bezier(.4,0,.2,1) forwards}
#splash .sp-msg{font-size:11px;color:rgba(232,238,220,.6);letter-spacing:.4px}
#splash .sp-skip{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;font-size:11px;color:rgba(232,238,220,.42);opacity:0;animation:spFade .6s 1.5s forwards}
@keyframes spGrid{to{background-position:44px 44px,44px 44px}}
@keyframes spSweep{to{transform:translateX(120%)}}
@keyframes spDust{0%{transform:translateY(0);opacity:0}10%{opacity:.85}100%{transform:translateY(-105vh);opacity:0}}
@keyframes spRing{to{stroke-dashoffset:0}}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spPing{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@keyframes spPulse{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.9;transform:scale(1.08)}}
@keyframes spPop{from{opacity:0;transform:scale(.55) translateY(12px)}}
@keyframes spBar{from{transform:scaleY(0)}}
@keyframes spTrack{0%{opacity:0;letter-spacing:.9em;padding-inline-start:.9em;filter:blur(8px)}100%{opacity:1;letter-spacing:.38em;padding-inline-start:.38em;filter:none}}
@keyframes spGleam{to{background-position:0 0}}
@keyframes spHair{to{width:54px}}
@keyframes spG4{to{transform:scale(1)}}
@keyframes spGem{to{transform:rotate(45deg) scale(1)}}
@keyframes spOutA{to{opacity:0;transform:translateY(-14px);filter:blur(6px)}}
@keyframes spWipe{to{clip-path:inset(0 0 0 0)}}
@keyframes spRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spFill{to{width:100%}}
@keyframes spFade{to{opacity:1}}

#splash.quick .sp-a{display:none}
#splash.quick .sp-ring .r2{animation-duration:.9s;animation-delay:0s}
#splash.quick .sp-mark{animation-delay:0s}
#splash.quick .sp-g4 i:nth-child(1){animation-delay:.15s}#splash.quick .sp-g4 i:nth-child(2){animation-delay:.25s}#splash.quick .sp-g4 i:nth-child(3){animation-delay:.35s}#splash.quick .sp-g4 i:nth-child(4){animation-delay:.45s}
#splash.quick .sp-orbit{animation-delay:.6s,.6s}
#splash.quick .sp-ping,#splash.quick .sp-sweep{animation-delay:.5s}
#splash.quick .sp-ar{animation-duration:.8s;animation-delay:.35s}
#splash.quick .sp-b .sp-orn s{animation-delay:.8s}#splash.quick .sp-b .sp-orn em{animation-delay:.75s}
#splash.quick .sp-grp{animation-delay:.9s}
#splash.quick .sp-load{animation-delay:.9s}#splash.quick .sp-bar b{animation-duration:1s;animation-delay:1s}
#splash.quick .sp-skip{display:none}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
.afm{padding:0;overflow:hidden}
.afm-hd{background:linear-gradient(135deg,#1E5A3E,#123A27);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.afm-hd h3{color:#fff;font-size:17px}.afm-hd small{display:block;font-size:11.5px;opacity:.75;margin-top:2px}
.afm-code{font-family:var(--f-disp);font-size:10.5px;letter-spacing:.6px;border:1px solid rgba(233,207,122,.5);color:#F6E7B0;border-radius:6px;padding:3px 7px;white-space:nowrap}
.afm-bd{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.afm-sec{display:flex;flex-direction:column;gap:8px}
.afm-t{font-family:var(--f-disp);font-size:12px;font-weight:700;color:var(--gold-ink);letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.afm-t:before{content:attr(data-n);width:20px;height:20px;border-radius:6px;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;font-size:11px}
.afm-t:after{content:"";flex:1;height:1px;background:var(--line)}
.afm-kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.afm-kv div{background:var(--card);padding:8px 10px}.afm-kv span{display:block;font-size:11px;color:var(--muted)}.afm-kv b{font-size:13.5px}

const pct=(x,d=1)=>x==null||isNaN(x)?'—':(x*100).toFixed(d)+'%';
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const monLbl=m=>{const [y,mm]=m.split('-');return MONTHS[+mm-1]+' '+y;};
const monShort=m=>MONTHS[+m.split('-')[1]-1];
const daysIn=m=>{const [y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate();};
const todayIso=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hide'),2200);}
function delta(a,b,lbl){if(!b)return '';const d=a/b-1;return `<span class="${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${pct(Math.abs(d))}</span> <span class="muted">${lbl}</span>`;}
function kpi(l,v,s){return `<div class="card kpi"><span class="lbl">${l}</span><span class="val num">${v}</span>${s?`<span class="sub">${s}</span>`:''}</div>`;}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('#app').hidden=true; $('#login').hidden=false; return; }
  st.user=session.user; st.cache={};
  const [p,b,ub,us]=await Promise.all([
    sb.from('profiles').select('*').eq('id',st.user.id).maybeSingle(),
    sb.from('branches').select('*').order('sort'),
    sb.from('user_branches').select('branch_id').eq('user_id',st.user.id),
    sb.from('user_sections').select('section').eq('user_id',st.user.id)
  ]);
  st.profile=p.data;
  if(!st.profile||!st.profile.active){ await sb.auth.signOut(); $('#login').hidden=false; $('#app').hidden=true; $('#lerr').textContent='هذا الحساب موقوف — تواصل مع مدير النظام'; return; }
  try{ const r=await sb.rpc('has_all_branches'); st.allBranches=!!r.data; }catch(e){ st.allBranches=false; }
  st.branches=b.data||[]; st.mySections=(us.data||[]).map(x=>x.section);
  $('#login').hidden=true; $('#app').hidden=false;
  if(isEmp()) st.tab='me'; else { try{ const t=localStorage.getItem('tab'); if(t&&allowed(t)) st.tab=t; }catch(e){} }
  try{ const qt=new URLSearchParams(location.search).get('tab'); if(qt&&allowed(qt)) st.tab=qt; if(qt) history.replaceState(null,'',location.pathname); }catch(e){}

}

function smartBars({labels,series,proj=[],avg=null,avgLbl='المتوسط',avgEnd=false,info=[],marks={},h=190,sub=[]}){
  const n=labels.length; if(!n) return ''; const W=340, top=22, bot=sub.length?34:20, H=h, ch=H-top-bot;
  const tots=labels.map((_,i)=>sum(series.map(s=>s.vals[i]||0)));
  const mx=Math.max(1,...tots.map((t,i)=>t+(proj[i]||0)),avg||0)*1.08;
  const slot=W/n, bw=Math.max(4,Math.min(34,slot*0.66)); const Y=v=>top+ch-(v/mx)*ch;
  let g=`<defs><pattern id="sbp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="rgba(212,175,55,.10)"/><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(212,175,55,.55)" stroke-width="2"/></pattern></defs>`;
  [0.25,0.5,0.75,1].forEach(f=>{const y=top+ch-f*ch;g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width=".6"/>`;});
  labels.forEach((l,i)=>{ const x=i*slot+(slot-bw)/2; let y0=top+ch; const hl=marks[i];
    const op=hl||marks.focus==null?1:.9;
    series.forEach(s=>{const v=s.vals[i]||0; if(!v) return; const hh=(v/mx)*ch; y0-=hh; g+=`<rect x="${x}" y="${y0}" width="${bw}" height="${hh}" fill="${s.color}" opacity="${op}"/>`;});
    if(proj[i]){ const hh=(proj[i]/mx)*ch; g+=`<rect x="${x+.5}" y="${y0-hh+.5}" width="${bw-1}" height="${hh-1}" fill="url(#sbp)" stroke="rgba(212,175,55,.75)" stroke-dasharray="3 2" rx="2"/>`; y0-=hh; }
    if(y0<top+ch&&!proj[i]) g+=`<rect x="${x}" y="${y0}" width="${bw}" height="3" rx="1.5" fill="rgba(255,255,255,.35)"/>`;
    if(hl){ const t=tots[i]+(proj[i]||0); g+=`<text x="${x+bw/2}" y="${Y(t)-6}" text-anchor="middle" font-size="${n>14?8.5:10}" font-weight="700" fill="${hl.c}">${hl.t}</text>`; }
    const lab=n>16?((i===0||i===n-1||(+l)%5===0)?l:''):l;
    if(lab!=='') g+=`<text x="${x+bw/2}" y="${top+ch+13}" text-anchor="middle" font-size="${n>8?8.5:10}" fill="var(--muted)">${lab}</text>`;
    if(sub[i]) g+=`<text x="${x+bw/2}" y="${top+ch+27}" text-anchor="middle" font-size="8.5" font-weight="700" fill="${sub[i].c}">${sub[i].t}</text>`;
    g+=`<rect x="${i*slot}" y="0" width="${slot}" height="${H}" fill="transparent" data-sbi="${i}" style="cursor:pointer"/>`;
  });
  if(avg){ const y=Y(avg), lw=avgLbl.length*5.6+12; g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#1E5A3E" stroke-width="1.2" stroke-dasharray="5 4" opacity=".75"/><rect x="${avgEnd?W-lw:0}" y="${y-15}" width="${lw}" height="13" rx="6.5" fill="#1E5A3E"/><text x="${avgEnd?W-lw/2:lw/2}" y="${y-5.5}" text-anchor="middle" font-size="8.5" fill="#F6E7B0" font-weight="600">${avgLbl}</text>`; }
  return `<div class="sbw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;direction:ltr;overflow:visible">${g}</svg><div class="sb-info" data-sbinfo='${esc(JSON.stringify(info))}'><span class="muted">اضغط على أي عمود لعرض التفاصيل</span></div></div>`;
}
document.addEventListener('click',e=>{ const r=e.target.closest('[data-sbi]'); if(!r) return; const w=r.closest('.sbw'); const box=w.querySelector('.sb-info'); let L=[]; try{L=JSON.parse(box.dataset.sbinfo);}catch(_){}
  const it=L[+r.dataset.sbi]; if(!it) return; w.querySelectorAll('.sb-sel').forEach(x=>x.remove());
  const svg=w.querySelector('svg'); const sel=document.createElementNS('http://www.w3.org/2000/svg','rect'); sel.setAttribute('class','sb-sel'); ['x','y','width','height'].forEach(k=>sel.setAttribute(k,r.getAttribute(k))); sel.setAttribute('fill','rgba(30,90,62,.08)'); sel.setAttribute('rx','4'); svg.insertBefore(sel,svg.children[1]);
  box.innerHTML='<div>'+it+'</div>'; });
function stackBars(labels,series,{h=230,label=true,fv=fk}={}){
  const n=labels.length,U=Math.max(30,Math.min(64,700/n)),pl=46,pr=10,pt=22,pb=28,W=pl+pr+n*U,H=h;
  const tot=labels.map((_,i)=>sum(series.map(s=>s.vals[i]||0)));
  const mx=Math.max(1,...tot)*1.12,y=v=>H-pb-(v/mx)*(H-pt-pb),bw=U*.62;
  let g='';for(let t=0;t<=4;t++){const v=mx/4*t;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(v)+4}" font-size="10" fill="var(--muted)" text-anchor="end">${fk(v)}</text>`;}
  labels.forEach((l,i)=>{const x=pl+i*U+(U-bw)/2;let base=0;
    series.forEach(s=>{const v=s.vals[i]||0;if(!v)return;g+=`<rect x="${x}" y="${y(base+v)}" width="${bw}" height="${y(base)-y(base+v)}" fill="${s.color}"><title>${esc(s.name)} · ${esc(l)}: ${fmt(v)}</title></rect>`;base+=v;});
    if(label&&tot[i]) g+=`<text x="${x+bw/2}" y="${y(tot[i])-5}" font-size="10" fill="var(--fg)" text-anchor="middle">${fv(tot[i])}</text>`;
    g+=`<text x="${x+bw/2}" y="${H-9}" font-size="10.5" fill="var(--muted)" text-anchor="middle">${esc(l)}</text>`;});
  return `<div class="scroller sc-end" style="direction:ltr"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div>`;
}
function groupBars(labels,series,{h=220}={}){
  const n=labels.length,k=series.length,U=Math.max(48,k*18+20),pl=46,pr=10,pt=22,pb=28,W=pl+pr+n*U,H=h;
  const all=series.flatMap(s=>s.vals.map(v=>+v||0)); const mn=Math.min(0,...all), mx=Math.max(1,...all)*1.12;
  const y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb), bw=Math.min(18,(U-16)/k-2);
  let g='';for(let t=0;t<=4;t++){const v=mn+(mx-mn)/4*t;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(v)+4}" font-size="10" fill="var(--muted)" text-anchor="end">${fk(v)}</text>`;}
  if(mn<0) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/>`;
  labels.forEach((l,i)=>{const x0=pl+i*U+(U-k*(bw+2))/2;
    series.forEach((s,j)=>{const v=+s.vals[i]||0,x=x0+j*(bw+2),top=Math.min(y(v),y(0)),hh=Math.abs(y(v)-y(0));const col=typeof s.color==='function'?s.color(v):s.color;
      g+=`<rect x="${x}" y="${top}" width="${bw}" height="${hh}" rx="2" fill="${col}"><title>${esc(s.name)} · ${esc(l)}: ${fmt(v)}</title></rect>`;
      if(k===1) g+=`<text x="${x+bw/2}" y="${v>=0?y(v)-5:y(v)+12}" font-size="10" fill="var(--fg)" text-anchor="middle">${fk(v)}</text>`;});
    g+=`<text x="${pl+i*U+U/2}" y="${H-9}" font-size="11" fill="var(--muted)" text-anchor="middle">${esc(l)}</text>`;});
  return `<div class="scroller sc-end" style="direction:ltr"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div>`;
}
function lineChart(labels,series,{h=220,dec=0,suf='',fmtv}={}){
  const n=labels.length; if(n<1) return '';
  const W=Math.max(320,n*80),H=h,pl=50,pr=20,pt=22,pb=28;
  const all=series.flatMap(s=>s.vals.filter(v=>v!=null));if(!all.length) return '';
  let mn=Math.min(...all),mx=Math.max(...all);const pad=(mx-mn)*.15||Math.abs(mx)*.1||1;mn-=pad;mx+=pad;
  const x=i=>n===1?(pl+W-pr)/2:pl+i*(W-pl-pr)/(n-1),y=v=>H-pb-(v-mn)/(mx-mn)*(H-pt-pb);

  labels.forEach((l,i)=>g+=`<text x="${x(i)}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="middle">${esc(l)}</text>`);
  series.forEach(s=>{const pts=s.vals.map((v,i)=>v==null?null:[x(i),y(v),v,i]).filter(Boolean);if(!pts.length)return;
    let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2;d+=` C${cx},${y0} ${cx},${y1} ${x1},${y1}`;}
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`;
    pts.forEach((p,j)=>{const last=j===pts.length-1;g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${last?4.5:3}" fill="${s.color}" ${s.dash&&s.dash[p[3]]?'fill-opacity=".35" stroke="'+s.color+'"':''}><title>${esc(s.name)} · ${esc(labels[p[3]])}: ${F(p[2])}</title></circle>`;
      if(last||series.length===1||n<=14) g+=`<text x="${p[0]}" y="${p[1]-9}" font-size="${last?10.5:9.5}" font-weight="600" fill="${series.length>1?s.color:'var(--fg)'}" text-anchor="middle" paint-order="stroke" stroke="var(--card)" stroke-width="3">${F(p[2])}</text>`;});});
  return `<div class="scroller sc-end" style="direction:ltr"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div>`;
}
function donut(parts){
  const t=sum(parts.map(p=>p.v));if(!t) return '<div class="empty">لا توجد بيانات</div>';
  let a=-Math.PI/2,g='';const R=62,r=40,c=70;

document.addEventListener('click',async e=>{
  const f=e.target.closest('[data-lf]'); if(f){st.loanF=f.dataset.lf;render();return;}
  const b=e.target.closest('[data-lp]'); if(!b||b.disabled) return;
  const [id,n]=b.dataset.lp.split('|'); b.disabled=true;
  try{
    const r=await sb.from('app_docs').select('data').eq('app','loans').eq('coll','contracts').eq('id',id).maybeSingle();
    if(r.error||!r.data) throw new Error(r.error?r.error.message:'غير موجود');
    const d=r.data.data,x=(d.sched||[]).find(s=>s.n===+n); if(!x) throw new Error('القسط غير موجود');
    const due=x.date<=todayIso(); let nowPaid;
    if(due){ if(x.unpaid){delete x.unpaid; nowPaid=true;} else {x.unpaid=true; nowPaid=false;} delete x.paid; delete x.paidOn; }
    else { x.paid=!x.paid; nowPaid=x.paid; if(x.paid) x.paidOn=todayIso(); else delete x.paidOn; }
    const u=await sb.from('app_docs').update({data:d,updated_at:new Date().toISOString()}).eq('app','loans').eq('coll','contracts').eq('id',id);
    if(u.error) throw new Error(u.error.message);
    const open=[...document.querySelectorAll('#view details')].map(el=>el.open);
    delete st.cache['loans/contracts']; toast(nowPaid?'القسط مسدد':'القسط غير مسدد'); await render();
    document.querySelectorAll('#view details').forEach((el,i)=>{if(open[i]) el.open=true;});
  }catch(err){ b.disabled=false; toast('تعذّر: '+err.message); }
});

const FL_ENT={wafra:{id:'wafra',name:'وفرة المدينة',color:'#C2603A'}};
const flEnt=k=>FL_ENT[k]||brById(k);
const FL_USE=['توصيل','نقل وتوريد','سيارة إدارة','دباب توصيل','أخرى'];
const FL_COND=['ممتازة','جيدة','متوسطة','تحتاج صيانة'];
const FL_OWN=['ملك','تمويل','إيجار'];
const FL_STATUS=['في الخدمة','خارج الخدمة','مباعة'];
const flEnts=()=>{const b=st.branches.map(x=>x.id).filter(x=>['az','sh','pc'].includes(x));return isAdmin()?[...b,'wafra']:b;};
const flDays=d=>d?Math.round((new Date(d+'T12:00:00')-new Date(todayIso()+'T12:00:00'))/864e5):null;
function flAlerts(v){const a=[];[['regExp','الاستمارة','reg'],['insExp','التأمين','ins']].forEach(([k,n,ty])=>{const d=flDays(v[k]);if(d==null)return;if(d<0)a.push({bad:true,ty,date:v[k],d,t:n+' منتهية منذ '+(-d)+' يوم'});else if(d<=30)a.push({bad:false,ty,date:v[k],d,t:n+' تنتهي بعد '+d+' يوم'});});if(v.cond==='تحتاج صيانة')a.push({bad:true,ty:'maint',t:'تحتاج صيانة'});return a;}
function flImg(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};im.src=fr.result;};fr.readAsDataURL(file);});}
function flForm(v,id){
  v=v||{};const ents=flEnts();const opt=(arr,cur)=>arr.map(x=>`<option ${x===cur?'selected':''}>${x}</option>`).join('');
  const f=(k,l,t='text',x='')=>`<div class="field"><label for="fl_${k}">${l}</label><input class="inp" id="fl_${k}" name="${k}" type="${t}" value="${esc(v[k]==null?'':v[k])}" ${x}></div>`;
  return `<div class="card" id="flFormCard"><h3>${id?'تعديل سيارة':'إضافة سيارة'} <small>الحقول المعلّمة * مطلوبة</small></h3>
  <form id="fleetForm" data-id="${esc(id||'')}" autocomplete="off" style="display:flex;flex-direction:column;gap:10px">
    <div class="field"><label>صور السيارة (حتى 3: أمام، جنب، العداد)</label>
      <label class="btn ghost" style="display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer">📷 التقط أو اختر صور<input type="file" id="flImgs" accept="image/*" multiple hidden></label>
      <div id="flPrev" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${v.thumb?`<img src="${v.thumb}" style="width:84px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)"><span class="muted" style="font-size:11.5px;align-self:center">الصور الحالية تبقى إذا ما اخترت صور جديدة</span>`:''}</div></div>
    <div class="row">
      <div class="field"><label for="fl_br">الجهة *</label><select class="inp" id="fl_br" name="br" required>${ents.map(k=>`<option value="${k}" ${v.br===k?'selected':''}>${esc(flEnt(k).name)}</option>`).join('')}</select></div>
      <div class="field"><label for="fl_status">الوضع</label><select class="inp" id="fl_status" name="status">${opt(FL_STATUS,v.status||'في الخدمة')}</select></div></div>
    <div class="row">${f('make','الماركة *','text','required placeholder="تويوتا"')}${f('model','الموديل *','text','required placeholder="هايلكس"')}</div>
    <div class="row">${f('year','سنة الصنع *','number','required min="1980" max="2035" inputmode="numeric"')}${f('plate','رقم اللوحة *','text','required placeholder="أ ب ج 1234"')}</div>
    <div class="row">${f('color','اللون')}<div class="field"><label for="fl_use">الاستخدام</label><select class="inp" id="fl_use" name="use">${opt(FL_USE,v.use||'توصيل')}</select></div></div>
    <div class="row">${f('km','قراءة العداد (كم)','number','inputmode="numeric" min="0"')}<div class="field"><label for="fl_cond">حالة السيارة</label><select class="inp" id="fl_cond" name="cond">${opt(FL_COND,v.cond||'جيدة')}</select></div></div>
    <div class="row">${f('driver','السائق / المسؤول')}<div class="field"><label for="fl_own">الملكية</label><select class="inp" id="fl_own" name="own">${opt(FL_OWN,v.own||'ملك')}</select></div></div>
    <div class="row">${f('regExp','انتهاء الاستمارة','date')}${f('insExp','انتهاء التأمين','date')}</div>
    <div class="row">${f('value','القيمة السوقية التقديرية (ر.س) *','number','required min="0" step="100" inputmode="numeric"')}${f('vin','رقم الهيكل (اختياري)','text','dir="ltr"')}</div>
    <div class="field"><label for="fl_notes">ملاحظات</label><textarea class="inp" id="fl_notes" name="notes" rows="2">${esc(v.notes||'')}</textarea></div>
    <div class="err" id="flErr"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="submit" id="flSave">حفظ السيارة</button><button class="btn ghost" type="button" data-fcancel="1">إلغاء</button>${id&&isAdmin()?`<button class="btn ghost" type="button" data-fdel="${esc(id)}" style="color:var(--down);margin-inline-start:auto">حذف</button>`:''}</div>
  </form></div>`;
}
V.fleet=async()=>{
  const docs=await appList('fleet','vehicles');
  const all=docs.map(d=>({...d.data,id:d.id})).sort((a,b)=>(+b.value||0)-(+a.value||0));
  const ents=flEnts(); const canAdd=ents.length>0;
  const fe=st.flF||'all', fs=st.flS||'active';
  const inEnt=v=>fe==='all'||v.br===fe;
  const act=all.filter(v=>(v.status||'في الخدمة')!=='مباعة');
  const vis=all.filter(v=>inEnt(v)&&(fs==='all'||(fs==='active'?(v.status||'في الخدمة')==='في الخدمة':(v.status||'في الخدمة')!=='في الخدمة')));
  let h='';
  if(st.flEdit) h+=flForm(st.flEdit==='new'?{br:fe!=='all'?fe:ents[0]}:all.find(v=>v.id===st.flEdit),st.flEdit==='new'?null:st.flEdit);
  else if(canAdd) h+=`<button class="btn" data-fadd="1" style="display:flex;align-items:center;justify-content:center;gap:8px">＋ إضافة سيارة</button>`;
  if(!all.length) return h+`<div class="card empty">ما فيه سيارات مسجلة بعد${canAdd?' — اضغط «إضافة سيارة» وصوّر السيارة وسجّل بياناتها.':''}</div>`;
  // لوحة
  const scope=act.filter(inEnt), tv=sum(scope.map(v=>+v.value||0));
  const byE={};act.forEach(v=>{(byE[v.br]=byE[v.br]||{n:0,v:0}).n++;byE[v.br].v+=+v.value||0;});
  const tAll=sum(Object.values(byE).map(x=>x.v))||1;
  h+=`<div class="card" style="background:linear-gradient(140deg,#1E5A3E,#143F2A);color:#fff;border:0">
    <div style="font-size:12.5px;opacity:.8">القيمة السوقية التقديرية للأسطول${fe!=='all'?' · '+esc(flEnt(fe).name):''}</div>
    <div class="num" style="font-size:27px;font-weight:700;color:#F6E7B0">${fmt(tv)} <small style="font-size:12px;color:#fff;opacity:.8">ر.س</small></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;border-top:1px solid rgba(255,255,255,.15);padding-top:10px;text-align:center">
      <div><div style="font-size:11px;opacity:.75">سيارات</div><b class="num" style="font-size:15px">${scope.length}</b></div>
      <div><div style="font-size:11px;opacity:.75">متوسط القيمة</div><b class="num" style="font-size:15px">${fmt(scope.length?tv/scope.length:0)}</b></div>
      <div><div style="font-size:11px;opacity:.75">تحتاج انتباه</div><b class="num" style="font-size:15px;color:${scope.some(v=>flAlerts(v).length)?'#FFB4A8':'#fff'}">${scope.filter(v=>flAlerts(v).length).length}</b></div></div></div>`;
  // تبويبات الجهات
  const ORDER=['az','sh','pc','wafra']; const eKeys=[...new Set(all.map(v=>v.br))].sort((x,y)=>(ORDER.indexOf(x)+1||9)-(ORDER.indexOf(y)+1||9));
  if(eKeys.length>1) h+=`<div class="fl-tabs">${[['all','الكل',act.length]].concat(eKeys.map(k=>[k,flEnt(k).name,act.filter(v=>v.br===k).length])).map(([k,n,c])=>`<button data-ff="${k}" aria-pressed="${fe===k}" style="${k!=='all'&&fe===k?`background:${flEnt(k).color};border-color:${flEnt(k).color}`:''}">${k!=='all'&&fe!==k?`<i class="dot" style="background:${flEnt(k).color}"></i>`:''}${esc(n)} <span>${c}</span></button>`).join('')}</div>`;
  h+=`<div class="chips" style="margin-top:-4px">${[['active','في الخدمة'],['out','خارج الخدمة / مباعة'],['all','الكل']].map(([k,n])=>`<button data-fs="${k}" aria-pressed="${fs===k}">${n}</button>`).join('')}</div>`;
  // التنبيهات — قابلة للضغط
  const al=scope.flatMap(v=>flAlerts(v).map((x,i)=>({v,a:x,i})));
  if(al.length) h+=`<div class="card fl-al"><div class="bar-row"><h3 style="margin:0;font-size:14px">⚠️ تنبيهات تحتاج انتباه</h3><span class="muted" style="font-size:11.5px">اضغط على أي تنبيه للتفاصيل</span></div>
    <div class="fl-alist">${al.sort((x,y)=>(y.a.bad-x.a.bad)).filter((o,i)=>st.flAlAll||i<3).map(o=>`<button class="fl-ai ${o.a.bad?'bad':'warn'}" data-fal="${esc(o.v.id)}|${o.i}"><span class="ic">${{reg:'🪪',ins:'🛡️',maint:'🔧'}[o.a.ty]||'⚠️'}</span><span style="flex:1;min-width:0;text-align:right"><b>${esc(o.a.t)}</b><small>${esc(o.v.make+' '+o.v.model)} · <span dir="auto">${esc(o.v.plate||'')}</span>${fe==='all'?' · '+esc(flEnt(o.v.br).name):''}</small></span><span class="chev">‹</span></button>`).join('')}</div>${al.length>3?`<button class="btn ghost sm" data-falall="1" style="align-self:center">${st.flAlAll?'إخفاء':'عرض كل التنبيهات ('+al.length+')'}</button>`:''}</div>`;
  // السيارات مقسّمة حسب الجهة
  const row=v=>{const a=flAlerts(v),stt=v.status||'في الخدمة';return `<button class="fl-row" data-fopen="${esc(v.id)}"><span class="th">${v.thumb?`<img src="${v.thumb}" alt="">`:'🚗'}</span>
    <span style="flex:1;min-width:0;text-align:right"><b>${esc(v.make)} ${esc(v.model)}</b> <span class="muted">${esc(v.year||'')}</span><small><span dir="auto">${esc(v.plate||'—')}</span>${v.use?' · '+esc(v.use):''}${v.driver?' · '+esc(v.driver):''}</small>
    ${stt!=='في الخدمة'?`<span class="tag" style="font-size:10px;margin-top:3px">${esc(stt)}</span>`:''}${a.length?`<span class="fl-badge ${a.some(x=>x.bad)?'bad':'warn'}" data-fal="${esc(v.id)}|0">${a.length===1?esc(a[0].t):a.length+' تنبيهات'}</span>`:''}</span>
    <span class="val num">${fmt(v.value)}<small>ر.س</small></span></button>`;};
  const groups=(fe==='all'?eKeys:[fe]).map(k=>({k,list:vis.filter(v=>v.br===k)})).filter(g=>g.list.length);
  h+=groups.length?groups.map(g=>{const e=flEnt(g.k),gv=sum(g.list.map(v=>+v.value||0)),ga=g.list.filter(v=>flAlerts(v).length).length;
    return `<div class="card fl-grp" style="border-top:4px solid ${e.color}"><div class="fl-gh"><div><b>${esc(e.name)}</b><span class="muted"> · ${g.list.length} سيارة${ga?` · <span class="down">${ga} تحتاج انتباه</span>`:''}</span></div><div class="num" style="font-weight:700;color:var(--green-dk)">${fmt(gv)} <small class="muted" style="font-weight:400">ر.س</small></div></div>${g.list.map(row).join('')}</div>`;}).join(''):'<div class="card empty">لا توجد سيارات بهذا الفلتر</div>';
  // تفاصيل السيارة المختارة
  const sel=st.flOpen&&all.find(v=>v.id===st.flOpen);
  if(sel){const e=flEnt(sel.br),a=flAlerts(sel),can=isAdmin()||(sel.br!=='wafra'&&ents.includes(sel.br));
    const rows=[['الجهة',esc(e.name)],['الوضع',esc(sel.status||'في الخدمة')],['الماركة والموديل',esc(sel.make+' '+sel.model+' '+(sel.year||''))],['رقم اللوحة',`<span dir="auto">${esc(sel.plate||'')}</span>`],['اللون',esc(sel.color||'—')],['الاستخدام',esc(sel.use||'—')],['قراءة العداد',sel.km?fmt(sel.km)+' كم':'—'],['حالة السيارة',esc(sel.cond||'—')],['السائق / المسؤول',esc(sel.driver||'—')],['الملكية',esc(sel.own||'—')],['انتهاء الاستمارة',sel.regExp?dLbl(sel.regExp):'—'],['انتهاء التأمين',sel.insExp?dLbl(sel.insExp):'—'],['رقم الهيكل',sel.vin?`<span dir="ltr">${esc(sel.vin)}</span>`:'—'],['القيمة السوقية التقديرية',`<b>${fmt(sel.value)}</b> ر.س`],['آخر تحديث',(sel.updatedBy?esc(sel.updatedBy)+' · ':'')+(sel.updatedAt?dLbl(String(sel.updatedAt).slice(0,10)):'')]];
    h+=`<div class="card" id="flDetail" style="border-top:4px solid ${e.color}"><div class="bar-row"><h3 style="margin:0">${esc(sel.make)} ${esc(sel.model)} ${esc(sel.year||'')}</h3><button class="icb" data-fclose="1" aria-label="إغلاق">✕</button></div>
      <div id="flPhotos" data-id="${esc(sel.id)}" style="display:flex;gap:8px;overflow-x:auto;margin:10px 0">${sel.thumb?`<img src="${sel.thumb}" style="height:150px;border-radius:12px">`:'<span class="muted">ما فيه صور</span>'}</div>
      ${a.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${a.map(x=>`<span class="tag" style="background:${x.bad?'rgba(208,69,58,.12)':'rgba(201,138,12,.15)'};color:${x.bad?'var(--down)':'var(--warn)'};font-weight:600">${esc(x.t)}</span>`).join('')}</div>`:''}
      <table><tbody>${rows.map(([k,v])=>`<tr><td class="muted">${k}</td><td class="n" style="white-space:normal">${v}</td></tr>`).join('')}</tbody></table>
      ${sel.notes?`<div style="font-size:13px;margin-top:8px"><span class="muted">ملاحظات:</span> ${esc(sel.notes)}</div>`:''}
      ${can?`<button class="btn ghost" data-fedit="${esc(sel.id)}" style="margin-top:10px;width:100%">تعديل البيانات أو الصور</button>`:''}</div>`;}
  return h;
};

function flAlertInfo(v,ix){
  const A=flAlerts(v); if(!A.length) return; const e=flEnt(v.br);
  const TY={reg:['🪪','الاستمارة (رخصة السير)','جدّد الاستمارة من أبشر قبل انتهائها، وحدّث تاريخها هنا بعد التجديد.'],ins:['🛡️','التأمين','جدّد وثيقة التأمين، ثم حدّث تاريخ الانتهاء في بيانات السيارة.'],maint:['🔧','الصيانة','حالة السيارة مسجّلة «تحتاج صيانة». ارفع طلب صيانة، وبعد الإصلاح حدّث الحالة في بيانات السيارة.']};
  const m=document.createElement('div'); m.className='fl-modal';
  m.innerHTML=`<div class="card" style="max-width:420px;width:100%;gap:10px"><div class="bar-row"><h3 style="margin:0;font-size:15px">${esc(v.make)} ${esc(v.model)} <span class="muted" style="font-weight:400" dir="auto">${esc(v.plate||'')}</span></h3><button class="icb" data-x="1">✕</button></div>
    <div class="muted" style="font-size:12px;margin-top:-6px"><i class="dot" style="background:${e.color}"></i> ${esc(e.name)}${v.driver?' · المسؤول: '+esc(v.driver):''}</div>
    ${A.map((a,i)=>{const t=TY[a.ty]||['⚠️','تنبيه',''];return `<div class="fl-ad ${a.bad?'bad':'warn'} ${i===ix?'on':''}"><div class="bar-row"><b>${t[0]} ${t[1]}</b><span class="tag" style="background:${a.bad?'rgba(208,69,58,.12)':'rgba(201,138,12,.15)'};color:${a.bad?'var(--down)':'var(--warn)'};font-weight:700">${a.bad?(a.ty==='maint'?'تحتاج إجراء':'منتهية'):'قريبة الانتهاء'}</span></div>
      ${a.date?`<div class="fl-kv"><span>تاريخ الانتهاء</span><b>${dLbl(a.date)}</b></div><div class="fl-kv"><span>${a.d<0?'منتهية منذ':'متبقي'}</span><b class="${a.d<0?'down':''}">${Math.abs(a.d)} يوم</b></div>`:''}
      <div style="font-size:12.5px;line-height:1.7;margin-top:4px">${t[2]}</div></div>`;}).join('')}
    <div style="display:flex;gap:8px"><button class="btn" data-go="1" style="flex:1">فتح بيانات السيارة</button><button class="btn ghost" data-x="1">إغلاق</button></div></div>`;
  m.addEventListener('click',async ev=>{ if(ev.target===m||ev.target.closest('[data-x]')){m.remove();return;} if(ev.target.closest('[data-go]')){m.remove();st.flOpen=v.id;await render();const el=$('#flDetail');if(el)el.scrollIntoView({behavior:'smooth'});flLoadPhotos();} });
  document.body.appendChild(m);
}
async function flLoadPhotos(){const box=document.getElementById('flPhotos');if(!box)return;const r=await sb.rpc('fleet_photos',{p_id:box.dataset.id});if(r.error||!Array.isArray(r.data)||!r.data.length)return;box.innerHTML=r.data.map(src=>`<img src="${src}" style="height:190px;border-radius:12px;flex:none">`).join('');}
let flNewImgs=null;
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-falall],[data-fal],[data-fadd],[data-fcancel],[data-fopen],[data-fclose],[data-fedit],[data-fdel],[data-ff],[data-fs]'); if(!t||!$('#view').contains(t)) return;
  if(t.dataset.falall){ st.flAlAll=!st.flAlAll; render(); return; }
  if(t.dataset.fal){ e.stopPropagation(); const [vid,ix]=t.dataset.fal.split('|'); const v=((await appList('fleet','vehicles')).find(x=>x.id===vid)||{}).data; if(v) flAlertInfo({...v,id:vid},+ix||0); return; }
  const d=t.dataset;
  if(d.fadd){st.flEdit='new';flNewImgs=null;await render();$('#flFormCard')&&$('#flFormCard').scrollIntoView({behavior:'smooth'});return;}
  if(d.fcancel){st.flEdit=null;flNewImgs=null;render();return;}
  if(d.ff){st.flF=d.ff;render();return;}
  if(d.fs){st.flS=d.fs;render();return;}
  if(d.fopen){st.flOpen=d.fopen;await render();const el=$('#flDetail');if(el)el.scrollIntoView({behavior:'smooth'});flLoadPhotos();return;}
  if(d.fclose){st.flOpen=null;render();return;}
  if(d.fedit){st.flEdit=d.fedit;flNewImgs=null;await render();window.scrollTo({top:0,behavior:'smooth'});return;}
  if(d.fdel){if(!confirm('حذف السيارة نهائياً؟'))return;const r=await sb.rpc('fleet_delete',{p_id:d.fdel});if(r.error){toast('تعذّر: '+r.error.message);return;}st.flEdit=null;st.flOpen=null;delete st.cache['fleet/vehicles'];toast('تم الحذف');render();}
});
document.addEventListener('change',async e=>{
  if(e.target.id!=='flImgs') return; const files=[...e.target.files].slice(0,3); if(!files.length) return;
  const pv=$('#flPrev'); pv.innerHTML='<span class="muted">جارِ تجهيز الصور…</span>';
  try{ flNewImgs=await Promise.all(files.map(f=>flImg(f,1100,.72))); const th=await flImg(files[0],320,.62); flNewImgs.thumb=th;
    pv.innerHTML=flNewImgs.map(src=>`<img src="${src}" style="width:84px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)">`).join('');
  }catch(err){ flNewImgs=null; pv.innerHTML='<span class="err">تعذّر قراءة الصورة</span>'; }
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='fleetForm') return; e.preventDefault();
  const f=e.target, fd=new FormData(f), v={}; fd.forEach((x,k)=>{v[k]=String(x).trim();});
  ['year','km','value'].forEach(k=>{v[k]=v[k]===''?null:+v[k];});
  const id=f.dataset.id||('v'+Date.now().toString(36)+Math.random().toString(36).slice(2,7));
  const old=(await appList('fleet','vehicles')).find(x=>x.id===id);
  if(old&&old.data){ if(old.data.thumb) v.thumb=old.data.thumb; if(old.data.nimg) v.nimg=old.data.nimg; }
  if(flNewImgs){ v.thumb=flNewImgs.thumb; v.nimg=flNewImgs.length; }

const PUSH_FN=()=>CFG.url+'/functions/v1/push';
const pushOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);

async function pushSub(){ if(!pushOK()) return null; const r=swReg||await navigator.serviceWorker.getRegistration(); return r?r.pushManager.getSubscription():null; }
const b64u=s=>{const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0));};
async function pushRegister(sub){ const j=sub.toJSON(); const r=await sb.rpc('push_register',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_ua:navigator.userAgent}); if(r.error) throw r.error; st.pushOn=true; }
async function pushEnable(){

  if(!pushOK()){ toast('المتصفح هذا ما يدعم الإشعارات — افتح المنصة من Chrome أو Safari'); return; }
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){ toast(perm==='denied'?'الإشعارات محظورة — فعّلها من إعدادات المتصفح للموقع':'لم يتم التفعيل'); return; }
  try{
    const reg=swReg||await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){ let key=null; for(let i=0;i<8&&!key;i++){ const r=await sb.rpc('push_key'); if(r.error) throw r.error; key=r.data; if(!key) await new Promise(z=>setTimeout(z,1500)); } if(!key) throw new Error('مفتاح الإشعارات ما جهز — تأكد من نشر دالة push وجرّب بعد دقيقة'); sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)}); }
    await pushRegister(sub);
    toast('تم تفعيل الإشعارات على هذا الجهاز ✓ — يوصلك إشعار تجريبي'); await sb.rpc('push_test');
    const pn=$('#npanel'); if(pn&&!pn.hidden) pn.innerHTML=npanelHtml(); if(['home','me'].includes(st.tab)) render();
  }catch(e){ console.error(e); toast('تعذّر التفعيل: '+(/push_key|push_register|schema cache/i.test(e.message||'')?'شغّل ملف تحديث الإشعارات أولاً':(e.message||e))); }
}
async function pushSync(){ try{ if(!pushOK()||Notification.permission!=='granted') return; const sub=await pushSub(); if(sub){ await pushRegister(sub); const pn=$('#npanel'); if(pn&&!pn.hidden) pn.innerHTML=npanelHtml(); } }catch(e){} }
function pushBox(inPanel){

  if(!inPanel){ try{ if(localStorage.getItem('pushHide')) return ''; }catch(e){} }
  if(!pushOK()&&!isIOS()) return '';

  return `<div class="pushbox"><div style="font-size:22px">🔔</div><div style="flex:1;min-width:0"><b>فعّل إشعارات الجوال</b><div>${denied?'الإشعارات محظورة — فعّلها من إعدادات المتصفح لهذا الموقع':isIOS()&&!isStandalone()?'على الآيفون: ثبّت التطبيق على الشاشة الرئيسية أولاً':'توصلك التنبيهات حتى والتطبيق مقفل'}</div></div>${denied?'':`<button class="btn sm" data-pon="1">تفعيل</button>`}${inPanel?'':`<button class="pclose" data-phide="1" aria-label="إخفاء">×</button>`}</div>`;

// ----- السلف وبوابة الموظف -----
const ADV_ST={pending_mgr:{t:'بانتظار مدير الفرع',c:'flat'},pending_owner:{t:'بانتظار الاعتماد',c:'flat'},approved:{t:'معتمدة',c:'up'},rejected:{t:'مرفوضة',c:'down'},cancelled:{t:'ملغاة',c:'muted'}};
const curMon=()=>todayIso().slice(0,7);
const monDiff=(a,b)=>{const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1);};
function advCalc(a){ const mo=+a.amount/a.months; if(a.status!=='approved'||!a.start_month) return {mo,done:0,rem:a.status==='approved'?+a.amount:0};
  const done=Math.max(0,Math.min(a.months,monDiff(a.start_month,curMon()))); return {mo,done,rem:Math.max(0,+a.amount-mo*done)}; }

function mtAsk(title,fields,sub){return new Promise(res=>{const m=document.createElement('div');m.style.cssText='position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px';
  const F=f=>f.type==='file'?`<input class="inp" type="file" name="${f.name}" accept="image/*" capture="environment">`:f.type==='area'?`<textarea class="inp" name="${f.name}" rows="2" ${f.req?'required':''}></textarea>`:f.type==='stars'?`<div class="stars" data-n="${f.name}">${[1,2,3,4,5].map(i=>`<button type="button" data-v="${i}">★</button>`).join('')}<input type="hidden" name="${f.name}" value="5"></div>`:`<input class="inp ${f.type==='number'?'num':''}" name="${f.name}" type="${f.type||'text'}" value="${esc(f.val||'')}" ${f.list?`list="mtl_${f.name}"`:''} ${f.type==='number'?'inputmode="decimal" min="0" step="0.01"':''} ${f.req?'required':''}>${f.list?`<datalist id="mtl_${f.name}">${f.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}`;
  m.innerHTML=`<form class="card" style="max-width:390px;width:100%;display:flex;flex-direction:column;gap:10px"><h3>${title}</h3>${sub?`<div class="muted" style="font-size:12px;margin-top:-6px">${sub}</div>`:''}${fields.map(f=>`<div class="field"><label>${f.label}</label>${F(f)}</div>`).join('')}<div style="display:flex;gap:8px"><button class="btn" type="submit" style="flex:1">تأكيد</button><button class="btn ghost" type="button" data-x="1">إلغاء</button></div></form>`;
  const f=m.querySelector('form');
  const paint=w=>{const v=+w.querySelector('input').value;w.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v<=v));}; f.querySelectorAll('.stars').forEach(paint);
  m.addEventListener('click',e=>{const sb2=e.target.closest('.stars button');if(sb2){const w=sb2.parentElement;w.querySelector('input').value=sb2.dataset.v;paint(w);return;} if(e.target===m||e.target.closest('[data-x]')){m.remove();res(null);}});
  f.addEventListener('submit',async e=>{e.preventDefault();const o={};for(const x of fields){const el=f.elements[x.name];o[x.name]=x.type==='file'?(el.files[0]?await flImg(el.files[0],1100,.72):null):el.value.trim();}m.remove();res(o);});
  document.body.appendChild(m);setTimeout(()=>{const i=f.querySelector('input:not([type=file]):not([type=hidden]),textarea');if(i)i.focus();},50);});}

  if(d.mtst){const s=d.mtst, m=(st._mtList||[]).find(x=>String(x.id)===d.id)||{}; let o={};
    const prev=[...new Set((st._mtList||[]).map(x=>x.assignee).filter(Boolean))];
    const due=(()=>{const x=new Date(Date.now()+mtSla(m)*36e5);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');})();
    if(s==='assigned'){o=await mtAsk('قبول الطلب وإسناده',[{name:'as',label:'الفني أو الجهة المنفذة',req:1,list:prev},{name:'due',label:'الموعد المتوقع للإنجاز',type:'date',val:due},{name:'note',label:'ملاحظة (اختياري)',type:'area'}],`${mtRef(m)} · ${esc(m.title||'')}`);if(!o)return;}
    else if(s==='rejected'){o=await mtAsk('رفض الطلب',[{name:'note',label:'سبب الرفض',type:'area',req:1}],`${mtRef(m)} · ${esc(m.title||'')}`);if(!o)return;}
    else if(s==='hold'){o=await mtAsk('تعليق التنفيذ',[{name:'note',label:'سبب التعليق (مثل: بانتظار قطعة غيار)',type:'area',req:1}]);if(!o)return;}
    else if(s==='done'){o=await mtAsk('تقرير الإنجاز',[{name:'note',label:'وش اللي تم إصلاحه؟',type:'area',req:1},{name:'cost',label:'التكلفة ر.س (اختياري)',type:'number'},{name:'ph',label:'صورة بعد الإصلاح (اختياري)',type:'file'}],'بعد الإنجاز يروح الطلب لمدير الفرع يأكد الاستلام');if(!o)return;}
    else if(s==='closed'){o=await mtAsk('تأكيد استلام الصيانة',[{name:'rt',label:'تقييمك للخدمة',type:'stars'},{name:'note',label:'ملاحظة (اختياري)',type:'area'}],'بالتأكيد يُغلق أمر العمل نهائياً');if(!o)return;}
    else if(s==='progress'&&m.status==='done'){o=await mtAsk('رفض الإنجاز',[{name:'note',label:'وش المشكلة اللي باقية؟',type:'area',req:1}],'يرجع الطلب للتنفيذ عند مشرف الصيانة');if(!o)return;}

    t.disabled=true;const r=await sb.rpc('maint_update',{p_id:d.id,p_status:s,p_note:o.note||null,p_cost:o.cost?+o.cost:null,p_done_photo:o.ph||null,p_assignee:o.as||null,p_due:o.due||null,p_rating:o.rt?+o.rt:null});t.disabled=false;

  if(d.mtph){const r=await sb.rpc('maint_photos',{p_id:d.mtph});const p=r.data||{};const ims=[[p.photo,'قبل الإصلاح'],[p.done_photo,'بعد الإصلاح']].filter(x=>x[0]);if(!ims.length){toast('ما فيه صور');return;}
    const m=document.createElement('div');m.style.cssText='position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.85);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:16px;overflow:auto';
    m.innerHTML=ims.map(([s,l])=>`<figure style="margin:0;text-align:center;color:#fff"><img src="${s}" style="max-width:100%;max-height:70vh;border-radius:12px"><figcaption style="font-size:13px;margin-top:4px">${l}</figcaption></figure>`).join('');m.onclick=()=>m.remove();document.body.appendChild(m);return;}
  if(d.mtdel){if(!confirm('حذف الطلب نهائياً؟'))return;const r=await sb.rpc('maint_delete',{p_id:d.mtdel});if(r.error){toast('تعذّر: '+r.error.message);return;}toast('تم الحذف');render();}
});

    if(!rows.length) return `<div class="card empty">لا يوجد تقرير بعد — يُضاف تلقائياً مع التحديث اليومي</div>`;
    let id=st.page[sec.id]; if(!rows.some(r=>r.id===id)) id=st.page[sec.id]=rows[0].id;

}
