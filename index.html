<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#143F2A">
<title>MyHub · منصة الإدارة الموحّدة</title>
<link rel="manifest" href="manifest.json?v=5">
<link rel="icon" href="icon.svg?v=4" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyHub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=Montserrat:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=7"></script>
<style>
:root{
  --bg:#F5F5F1; --card:#FFFFFF; --line:#E6E6E0; --fg:#18231C; --muted:#6B706A;
  --green:#1E5A3E; --green-dk:#143F2A;
  --gold:#D4AF37; --gold-ink:#9A7B12; --gold-soft:#FBF5E1;
  --up:#1FA16B; --down:#D0453A; --warn:#C98A0C; --chip:#EEEEE8;
  --shadow:0 1px 2px rgba(22,35,58,.05),0 4px 16px rgba(22,35,58,.05);
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-disp:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.wrap>*{min-width:0}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-disp)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);overflow:hidden}
.card h3{font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.est{background:rgba(201,138,12,.15);color:var(--warn);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:19px;flex:none}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.inp{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-height:42px}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;font-weight:600;min-height:42px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--down);font-size:13px;min-height:1.2em}
.ok{color:var(--up);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}


/* الشريط المتحرك */
.tkr{display:flex;align-items:stretch;height:36px;border-radius:12px;overflow:hidden;background:linear-gradient(90deg,#123A27,#1E5A3E 50%,#123A27);border:1px solid rgba(212,175,55,.45);box-shadow:0 4px 14px -8px rgba(18,58,39,.6);position:relative}
.tkr[hidden]{display:none}
.tkr-lbl{flex:none;display:flex;align-items:center;gap:6px;padding-inline:11px 10px;background:linear-gradient(135deg,#F3E2A6,#D4AF37);color:#3E2F05;font-family:var(--f-disp);font-weight:700;font-size:12.5px;position:relative;z-index:2;box-shadow:-6px 0 12px -4px rgba(0,0,0,.35)}
.tkr-lbl i{width:7px;height:7px;border-radius:50%;background:#C0392B;box-shadow:0 0 0 0 rgba(192,57,43,.6);animation:tkrPulse 1.6s infinite}
.tkr-vp{flex:1;min-width:0;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.tkr-track{display:flex;width:max-content;height:100%;align-items:center;animation:tkrMove var(--tkd,40s) linear infinite;will-change:transform}
.tkr-seq{display:flex;align-items:center;flex:none}
.tkr:hover .tkr-track,.tkr.paused .tkr-track{animation-play-state:paused}
.tkr-it{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:#fff;font:inherit;font-size:13px;white-space:nowrap;padding:0 4px;cursor:pointer}
.tkr-it b{color:#F6E7B0;font-weight:700}
.tkr-it.bad b{color:#FFB4A8}
.tkr-it .up{color:#8EE3B5;font-weight:700}.tkr-it .dn{color:#FFB4A8;font-weight:700}
.tkr-sep{flex:none;color:#D4AF37;font-size:9px;padding:0 12px;opacity:.85}
@keyframes tkrMove{from{transform:translateX(0)}to{transform:translateX(50%)}}
@keyframes tkrPulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.6)}70%{box-shadow:0 0 0 7px rgba(192,57,43,0)}100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}}
@media (prefers-reduced-motion:reduce){.tkr-track{animation:none}.tkr-vp{overflow-x:auto;scrollbar-width:none}}
body.appmode .tkr{display:none}

.advdel{border:1px solid var(--line);background:var(--card);border-radius:9px;width:30px;height:30px;display:grid;place-items:center;font-size:13px;cursor:pointer;flex:none;padding:0}
.advdel:active{background:rgba(208,69,58,.12)}

/* الرئيسية */
.hx-hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 14px;color:#fff;background:radial-gradient(130% 120% at 100% 0%,#2E7350 0%,#1E5A3E 42%,#0F3322 100%);box-shadow:0 18px 40px -22px rgba(15,51,34,.75);border:1px solid rgba(212,175,55,.25)}
.hx-glow{position:absolute;inset-inline-start:-60px;bottom:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(233,207,122,.20),transparent 70%);pointer-events:none}
.hx-hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px);pointer-events:none}
.hx-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hx-date{font-size:12px;opacity:.7}.hx-hi{font-family:var(--f-disp);font-size:18px;font-weight:600}
.hx-tag{flex:none;font-size:11.5px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15)}
.hx-main{position:relative;z-index:1;display:flex;align-items:center;gap:12px;margin-top:14px}
.hx-lbl{font-size:12px;opacity:.78}
.hx-big{font-size:clamp(28px,9vw,38px);font-weight:700;color:#F6E7B0;line-height:1.15;letter-spacing:-.5px;white-space:nowrap}
.hx-big small{font-size:12px;color:#fff;opacity:.75;font-weight:500;margin-inline-start:5px;letter-spacing:0}
.hx-chg{font-size:12px;opacity:.9;margin-top:2px}.hx-chg b.u,.hx-pace.u i,.hx-stats em.u{color:#8EE3B5}.hx-chg b.d,.hx-stats em.d{color:#FFB4A8}
.hx-ring{position:relative;flex:none;width:84px;height:84px}
.hx-rtx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.hx-rtx b{font-size:18px;color:#F6E7B0}.hx-rtx span{font-size:9.5px;opacity:.75}
.hx-arc{animation:hxArc 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes hxArc{from{stroke-dashoffset:var(--c)}}
.hx-pace{position:relative;z-index:1;margin-top:10px;font-size:11.5px;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.18);border-radius:10px;padding:6px 10px;line-height:1.5}
.hx-pace i{flex:none;width:8px;height:8px;border-radius:50%;background:#8EE3B5;box-shadow:0 0 0 3px rgba(142,227,181,.18)}
.hx-pace.d i{background:#FFB4A8;box-shadow:0 0 0 3px rgba(255,180,168,.18)}
.hx-spark{position:relative;z-index:1;margin:8px -4px 0}.hx-spark svg{width:100%;height:auto}
.hx-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.hx-stats button{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);border-radius:13px;padding:8px 8px;color:#fff;font:inherit;text-align:start;display:flex;flex-direction:column;gap:1px;min-width:0;cursor:pointer}
.hx-stats span{font-size:10.5px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hx-stats b{font-size:15px}.hx-stats em{font-style:normal;font-size:10px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hx-tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:start;font:inherit;color:inherit;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0;box-shadow:0 6px 18px -14px rgba(20,40,30,.35)}
.hx-tile:last-child:nth-child(odd){grid-column:span 2;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}.hx-tile:last-child:nth-child(odd) .hx-ic{grid-row:span 3;margin:0;width:42px;height:42px;font-size:20px}
.hx-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;margin-bottom:6px}
.hx-tl{font-size:11.5px;color:var(--muted)}.hx-tile b{font-size:19px;font-weight:700}.hx-ts{font-size:11px;color:var(--muted)}
.hx-tasks h3,.hx-ai h3{font-size:15px}
.hx-cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--down,#D0453A);color:#fff;font-size:11px;padding:0 6px;margin-inline-start:4px;vertical-align:2px}
.hx-tk,.hx-in{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;font:inherit;color:inherit;text-align:start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hx-tk:last-child,.hx-in:last-child{border-bottom:0}
.hx-tki,.hx-ii{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;background:var(--gold-soft)}
.hx-tki.bad{background:rgba(208,69,58,.12)}
.hx-tkt{flex:1;min-width:0;display:flex;flex-direction:column}.hx-tkt b{font-size:13px;font-weight:600}.hx-tkt small{font-size:11.5px;color:var(--muted)}
.hx-ia{flex:none;color:var(--muted);font-size:18px;opacity:.6}
.hx-clear{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(30,90,62,.07);border:1px dashed rgba(30,90,62,.3)}.hx-clear>span{font-size:22px}
.hx-ai{background:linear-gradient(180deg,rgba(212,175,55,.08),var(--card) 90px)}
.hx-aih{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.hx-aib{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:17px;color:#3E2F05;background:linear-gradient(135deg,#F6E7B0,#D4AF37);box-shadow:0 6px 14px -6px rgba(212,175,55,.8)}
.hx-it{flex:1;font-size:13px;line-height:1.75}
.hx-in.bad .hx-ii{background:rgba(208,69,58,.12)}.hx-in.warn .hx-ii{background:rgba(230,150,40,.15)}.hx-in.ok .hx-ii{background:rgba(30,140,90,.12)}
.hx-rank{display:flex;flex-direction:column;gap:4px}
.hx-rk{display:flex;align-items:center;gap:10px;border:0;background:none;font:inherit;color:inherit;text-align:start;padding:8px 0;cursor:pointer;border-bottom:1px solid var(--line)}.hx-rk:last-child{border-bottom:0}
.hx-md{flex:none;width:30px;text-align:center;font-size:20px}
.hx-g{font-weight:700;padding:1px 7px;border-radius:99px}.hx-g.u{color:#17804F;background:rgba(23,128,79,.1)}.hx-g.d{color:#C0392B;background:rgba(192,57,43,.1)}
.hx-sc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hx-sc button{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font:inherit;color:inherit}
.hx-sc button span{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--card);box-shadow:0 4px 10px -6px rgba(20,40,30,.35)}
.hx-sc small{font-size:10.5px;line-height:1.3;text-align:center}
@media (prefers-reduced-motion:reduce){.hx-arc{animation:none}}


.sbw{margin-top:4px}
.sb-info{margin-top:8px;min-height:40px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12.5px;line-height:1.7;display:flex;flex-direction:column;justify-content:center}.sb-info>div{display:block}
.sb-info>span.muted{font-size:11.5px;text-align:center}
.sb-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 10px}
.sb-kpi>div{background:var(--bg);border-radius:12px;padding:7px 8px;display:flex;flex-direction:column;min-width:0}
.sb-kpi span{font-size:10.5px;color:var(--muted)}.sb-kpi b{font-size:14.5px}.sb-kpi em{font-style:normal;font-size:10.5px;color:var(--muted);line-height:1.35}
.sb-leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted);margin-top:8px}.sb-leg span{display:inline-flex;align-items:center;gap:5px}
.sb-pj{width:12px;height:10px;border:1px dashed rgba(212,175,55,.9);background:repeating-linear-gradient(45deg,rgba(212,175,55,.5) 0 2px,rgba(212,175,55,.1) 2px 5px);border-radius:2px;display:inline-block}
.sb-av{width:14px;height:0;border-top:2px dashed #1E5A3E;display:inline-block}
.sb-note{margin-top:10px;font-size:12.5px;line-height:1.7;background:linear-gradient(90deg,rgba(212,175,55,.10),transparent);border-inline-start:3px solid #D4AF37;border-radius:8px;padding:7px 10px}


/* تقييم العملاء */
.fb-hero{position:relative;overflow:hidden;border-radius:22px;padding:18px;color:#fff;background:radial-gradient(130% 120% at 100% 0%,#2E7350 0%,#1E5A3E 42%,#0F3322 100%);border:1px solid rgba(212,175,55,.25)}
.fb-k{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);border-radius:13px;padding:8px;display:flex;flex-direction:column;min-width:0}.fb-k span{font-size:10.5px;opacity:.75;white-space:nowrap}.fb-k b{font-size:15px}
.fb-stars{color:#E2B93B;letter-spacing:1px;direction:ltr;display:inline-block}.fb-stars i{font-style:normal;color:rgba(160,160,150,.35)}
.fb-row{display:flex;gap:10px;align-items:flex-start;width:100%;border:0;background:none;font:inherit;color:inherit;text-align:start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.fb-row:last-child{border-bottom:0}.fb-row.late{background:linear-gradient(90deg,transparent,rgba(208,69,58,.05))}
.fb-face{flex:none;width:40px;height:40px;border-radius:13px;background:var(--bg);display:grid;place-items:center;font-size:22px}
.fb-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fb-cm{font-size:13.5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fb-meta{font-size:11.5px;color:var(--muted)}
.fb-end{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.fb-late{font-size:10.5px;font-weight:700;color:#fff;background:var(--down);border-radius:99px;padding:2px 8px}
.fb-dist{display:flex;align-items:center;gap:10px;font-size:12.5px;margin:6px 0}.fb-dist span{width:30px;flex:none;color:var(--gold-ink);font-weight:700}.fb-dist .meter{flex:1;margin:0}.fb-dist b{width:28px;text-align:end}
.fb-tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.fb-tg .tag{margin:0 0 4px 4px;display:inline-block}
.mtd-act .btn{flex:1 1 auto}
#fbqr{position:fixed;inset:0;z-index:72;background:var(--bg);display:flex;flex-direction:column}.fbq-body>*{flex:none}
.fbq-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center;gap:16px}
.fbq-card{width:100%;max-width:380px;background:#fff;border-radius:22px;padding:22px 20px;text-align:center;border:2px solid var(--c);box-shadow:0 14px 30px -22px rgba(0,0,0,.5);position:relative;overflow:hidden;color:#16231B}
.fbq-card::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,#1E5A3E,var(--c),#D4AF37)}
.fbq-top b{display:block;font-family:var(--f-disp);font-size:20px;color:#1E5A3E}.fbq-top span{font-size:13px;color:#6B746C}
.fbq-h{font-family:var(--f-disp);font-size:26px;font-weight:700;margin-top:12px}.fbq-s{font-size:14px;color:#4A544C}.fbq-st{color:#D4AF37;font-size:22px;letter-spacing:3px;margin:6px 0}
.fbq-qr{width:72%;margin:6px auto 4px;padding:10px;border-radius:16px;border:1.5px dashed #D4AF37}.fbq-qr svg{width:100%;height:auto;display:block}
.fbq-en{font-size:12.5px;color:#6B746C;letter-spacing:.3px}
.fbq-u{margin-top:12px;font-size:11px;color:#6B746C;display:flex;flex-direction:column;gap:6px;align-items:center;word-break:break-all}
@media print{body.fbprinting>*:not(#fbqr){display:none!important}body.fbprinting #fbqr{position:static}body.fbprinting .noprint{display:none!important}body.fbprinting .fbq-body{overflow:visible;padding:0}body.fbprinting .fbq-card{page-break-after:always;max-width:none;width:100%;box-shadow:none;margin-top:40px}}

.mt-late{border:0;background:rgba(208,69,58,.1);color:var(--down);font:inherit;font-weight:700;border-radius:99px;padding:1px 8px;cursor:pointer}

/* المساعد الذكي */
@keyframes aiRot{to{transform:rotate(360deg)}}
body.aimode{overflow:hidden}body.aimode .wrap>.top,body.aimode #tkr,body.aimode #tabs,body.aimode footer{display:none!important}
.aiv{position:fixed;left:0;right:0;top:0;bottom:var(--navh,0px);z-index:25;display:flex;flex-direction:column;background:var(--bg);max-width:760px;margin:0 auto;padding-top:env(safe-area-inset-top)}
.ai-top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.ai-brand{display:flex;align-items:center;gap:8px}.ai-brand b{font-family:var(--f-disp);font-size:18px;letter-spacing:.3px}
.ai-dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#FFF3CF;background:linear-gradient(135deg,#2E7350,#0F3322);font-size:14px}
.ai-badge{font-size:10.5px;font-weight:700;color:#7A5A06;background:linear-gradient(135deg,#FFF3CF,#E9CF7A);border-radius:99px;padding:2px 8px}
.ai-new{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:inherit}
.ai-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 10px;overscroll-behavior:contain}
.ai-hero{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100%;padding:6px 0}
.aiv.welcome .ai-hero{display:flex}
.ai-hero h2{font-family:var(--f-disp);font-size:21px;line-height:1.5;margin-top:16px}.ai-hero h2 span{display:block}.ai-hero h2 span{background:linear-gradient(90deg,#1E5A3E,#B8901E);-webkit-background-clip:text;background-clip:text;color:transparent}

.ai-spin i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 25%,#D4AF37 55%,#1E5A3E 85%,transparent);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));animation:aiRot .9s linear infinite}

/* header actions + bottom nav */
.who{display:flex;align-items:center;gap:8px}
.hbtn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--green-dk);flex:none;box-shadow:0 2px 8px rgba(20,24,20,.06)}
.hbtn .bd{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--down);color:#fff;border-radius:99px;font-size:10px;font-weight:700;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;border:2px solid var(--bg)}
.avb{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(135deg,#F3E2A6,#D4AF37);color:#3E2F05;font-family:var(--f-disp);font-weight:700;font-size:16px;cursor:pointer;flex:none;box-shadow:0 3px 10px rgba(154,123,18,.25)}
.npanel{position:absolute;inset-inline-end:0;top:48px;z-index:41;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 34px rgba(20,24,20,.18);width:min(330px,calc(100vw - 28px));max-height:70vh;overflow:auto;padding:12px}

.nitem{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:start;font:inherit;color:inherit;cursor:pointer}
.nitem:last-child{border-bottom:0}
.nitem .ic{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:14px}
.nitem .tx{font-size:12.5px;line-height:1.6}
.nitem .tx small{display:block;color:var(--muted);font-size:11px}
.bnav{position:fixed;inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:35;max-width:540px;margin:0 auto;display:flex;align-items:stretch;gap:4px;padding:6px;border-radius:26px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(30,90,62,.12);box-shadow:0 12px 32px rgba(16,40,28,.18),0 2px 6px rgba(16,40,28,.06),inset 0 1px 0 rgba(255,255,255,.9)}
.bnav button{flex:1;min-width:0;position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px 7px;border-radius:20px;color:#8A908A;font:inherit;font-size:10.5px;font-weight:700;letter-spacing:-.1px;cursor:pointer;transition:background .28s,color .28s,box-shadow .28s,transform .15s;-webkit-tap-highlight-color:transparent}
.bnav button:active{transform:scale(.94)}
.bnav button svg{width:22px;height:22px;transition:transform .28s}
.bnav .bi{position:relative;display:grid;place-items:center;height:24px}
.bnav button[aria-pressed="true"]{color:#fff;background:linear-gradient(155deg,#2A6B4C 0%,#1E5A3E 45%,#123A27 100%);box-shadow:0 8px 18px rgba(18,58,39,.38),inset 0 1px 0 rgba(255,255,255,.14)}
.bnav button[aria-pressed="true"] .bi{color:#F3DE9C}
.bnav button[aria-pressed="true"] svg{transform:translateY(-1px) scale(1.06)}
.bnav button[aria-pressed="true"]::after{content:"";position:absolute;top:4px;width:18px;height:3px;border-radius:9px;background:linear-gradient(90deg,#F3DE9C,#C9A227)}
.bnav .bdot{position:absolute;top:-5px;inset-inline-end:-9px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:#D0453A;color:#fff;font-size:10px;font-weight:800;line-height:17px;text-align:center;box-shadow:0 0 0 2px #fff}
.bnav button[aria-pressed="true"] .bdot{box-shadow:0 0 0 2px #1E5A3E}
body.hasnav .wrap{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
body.hasnav .toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.tabs:empty{display:none}
/* splash */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;cursor:pointer;color:#fff;
  background:radial-gradient(130% 95% at 50% 38%,#3C7550 0%,#2A5638 42%,#14301F 78%,#0D2216 100%);transition:opacity .7s ease,visibility .7s}
#splash.out{opacity:0;visibility:hidden}
#splash.out .sp-in{transform:scale(1.06);filter:blur(3px)}
#splash .sp-grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(233,207,122,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(233,207,122,.05) 1px,transparent 1px);background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 42%,#000 0%,transparent 62%);-webkit-mask-image:radial-gradient(circle at 50% 42%,#000 0%,transparent 62%);animation:spGrid 8s linear infinite,spFade 1.2s ease-out both}
#splash .sp-sweep{position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(246,231,176,.09) 50%,transparent 62%);transform:translateX(-120%);animation:spSweep 1.6s 2.75s ease-in-out forwards}
#splash .sp-vig{position:absolute;inset:0;box-shadow:inset 0 0 160px 40px rgba(0,0,0,.45);pointer-events:none}
#splash .sp-dust i{position:absolute;bottom:-10px;width:2.5px;height:2.5px;border-radius:50%;background:#F6E7B0;box-shadow:0 0 8px 2px rgba(233,207,122,.55);opacity:0;animation:spDust 5.5s linear infinite}
#splash .sp-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;padding:24px;transition:transform .7s ease,filter .7s ease}
#splash .sp-logo{position:relative;width:120px;height:120px;display:grid;place-items:center}
#splash .sp-ring{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}
#splash .sp-ring circle{fill:none;stroke-linecap:round}
#splash .sp-ring .r1{stroke:rgba(233,207,122,.14);stroke-width:1}
#splash .sp-ring .r2{stroke:url(#spg);stroke-width:1.6;stroke-dasharray:390;stroke-dashoffset:390;animation:spRing 1.4s .2s cubic-bezier(.6,.05,.25,1) forwards}
#splash .sp-orbit{position:absolute;inset:0;opacity:0;animation:spFade .4s 1.6s forwards,spSpin 3.2s 1.6s linear infinite}
#splash .sp-orbit::before{content:"";position:absolute;top:-2.5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#FFF7DC;box-shadow:0 0 10px 3px rgba(246,231,176,.7)}
#splash .sp-ping{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(246,231,176,.55);opacity:0;animation:spPing 1.2s 2.85s cubic-bezier(.2,.7,.3,1) forwards}
#splash .sp-glow{position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle,rgba(233,207,122,.26),transparent 70%);opacity:0;animation:spPulse 2.6s 1.2s ease-in-out infinite}
#splash .sp-mark{position:relative;width:74px;height:74px;border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.03));border:1px solid rgba(233,207,122,.45);
  display:grid;place-items:center;padding:0;box-shadow:0 18px 40px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.22);backdrop-filter:blur(6px);animation:spPop .8s .1s cubic-bezier(.2,.9,.25,1.15) both}
#splash .sp-g4{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:40px;height:40px;direction:ltr}#splash .sp-g4 i{display:block;border-radius:6px;background:linear-gradient(#FFF4CC,#C9A227);transform:scale(0);animation:spG4 .55s cubic-bezier(.2,.9,.3,1.3) forwards}#splash .sp-g4 i:nth-child(1){animation-delay:.6s}#splash .sp-g4 i:nth-child(2){background:none;border:2.5px solid #E9CF7A;animation-delay:.75s}#splash .sp-g4 i:nth-child(3){animation-delay:.9s}#splash .sp-g4 i:nth-child(4){animation-delay:1.05s;box-shadow:0 0 12px rgba(246,231,176,.5)}
#splash .sp-bars{display:flex;align-items:flex-end;gap:6px;height:40px;direction:ltr}
#splash .sp-bars i{display:block;width:9px;border-radius:3px 3px 1.5px 1.5px;background:linear-gradient(#F6E7B0,#C9A227);transform-origin:bottom;animation:spBar .8s cubic-bezier(.2,.8,.2,1) both}
#splash .sp-bars i:nth-child(1){height:40%;animation-delay:.7s}#splash .sp-bars i:nth-child(2){height:68%;animation-delay:.85s}#splash .sp-bars i:nth-child(3){height:100%;animation-delay:1s;background:linear-gradient(#FFF7DC,#E9CF7A);box-shadow:0 0 12px rgba(246,231,176,.5)}
#splash .sp-stage{display:grid;place-items:center;min-height:86px;width:300px;max-width:88vw}
#splash .sp-stage>div{grid-area:1/1;display:flex;flex-direction:column;align-items:center;gap:10px}
/* المرحلة الأولى: My Reports */
#splash .sp-a{animation:spOutA .65s 2.75s cubic-bezier(.5,0,.75,0) forwards}
#splash .sp-word{position:relative;font-family:"Montserrat","Readex Pro",sans-serif;font-weight:600;font-size:21px;text-transform:uppercase;direction:ltr;padding-inline-start:.38em;
  background:linear-gradient(100deg,#D9B850 0%,#F3E3A8 35%,#FFFFFF 48%,#F3E3A8 61%,#C9A227 100%);background-size:250% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:.38em;opacity:0;filter:blur(8px);animation:spTrack 1.25s 1.15s cubic-bezier(.2,.75,.2,1) forwards,spGleam 1.3s 1.9s ease-in-out forwards}
#splash .sp-orn{display:flex;align-items:center;gap:10px;direction:ltr}
#splash .sp-orn s{display:block;height:1px;width:0;background:linear-gradient(90deg,transparent,#E9CF7A)}
#splash .sp-orn s:last-child{background:linear-gradient(90deg,#E9CF7A,transparent)}
#splash .sp-orn s{animation:spHair .9s 1.7s cubic-bezier(.6,.05,.25,1) forwards}
#splash .sp-orn em{width:5px;height:5px;transform:rotate(45deg) scale(0);background:#E9CF7A;box-shadow:0 0 8px #F6E7B0;animation:spGem .5s 1.6s cubic-bezier(.2,.9,.3,1.4) forwards}
#splash .sp-tag{font-family:"Montserrat",sans-serif;font-weight:400;font-size:9.5px;letter-spacing:.42em;padding-inline-start:.42em;text-transform:uppercase;direction:ltr;color:rgba(232,238,220,.6);opacity:0;animation:spRise .7s 1.9s ease-out forwards}
/* المرحلة الثانية: منصة الإدارة الموحّدة */
#splash .sp-b{gap:12px}
#splash .sp-ar{font-family:"Readex Pro",var(--f-disp);font-weight:600;font-size:23px;white-space:nowrap;line-height:1.3;
  background:linear-gradient(180deg,#FFFDF3 0%,#F3E3A8 60%,#D9B850 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  clip-path:inset(0 0 0 100%);filter:drop-shadow(0 4px 18px rgba(0,0,0,.25));animation:spWipe 1s 3.2s cubic-bezier(.65,0,.25,1) forwards}
#splash .sp-b .sp-orn s{animation:spHair .8s 3.75s cubic-bezier(.6,.05,.25,1) forwards}
#splash .sp-b .sp-orn em{animation:spGem .5s 3.65s cubic-bezier(.2,.9,.3,1.4) forwards}
#splash .sp-grp{font-size:13px;color:#DCE6CF;letter-spacing:.3px;opacity:0;animation:spRise .7s 3.95s ease-out forwards}
#splash .sp-load{width:150px;display:flex;flex-direction:column;align-items:center;gap:9px;opacity:0;animation:spFade .5s 3.9s ease-out forwards}
#splash .sp-bar{width:100%;height:1.5px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#splash .sp-bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#C9A227,#F6E7B0);box-shadow:0 0 8px #E9CF7A;animation:spFill 1.5s 4s cubic-bezier(.4,0,.2,1) forwards}
#splash .sp-msg{font-size:11px;color:rgba(232,238,220,.6);letter-spacing:.4px}
#splash .sp-skip{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;font-size:11px;color:rgba(232,238,220,.42);opacity:0;animation:spFade .6s 1.5s forwards}
@keyframes spGrid{to{background-position:44px 44px,44px 44px}}
@keyframes spSweep{to{transform:translateX(120%)}}
@keyframes spDust{0%{transform:translateY(0);opacity:0}10%{opacity:.85}100%{transform:translateY(-105vh);opacity:0}}
@keyframes spRing{to{stroke-dashoffset:0}}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spPing{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@keyframes spPulse{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.9;transform:scale(1.08)}}
@keyframes spPop{from{opacity:0;transform:scale(.55) translateY(12px)}}
@keyframes spBar{from{transform:scaleY(0)}}
@keyframes spTrack{0%{opacity:0;letter-spacing:.9em;padding-inline-start:.9em;filter:blur(8px)}100%{opacity:1;letter-spacing:.38em;padding-inline-start:.38em;filter:none}}
@keyframes spGleam{to{background-position:0 0}}
@keyframes spHair{to{width:54px}}
@keyframes spG4{to{transform:scale(1)}}
@keyframes spGem{to{transform:rotate(45deg) scale(1)}}
@keyframes spOutA{to{opacity:0;transform:translateY(-14px);filter:blur(6px)}}
@keyframes spWipe{to{clip-path:inset(0 0 0 0)}}
@keyframes spRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spFill{to{width:100%}}
@keyframes spFade{to{opacity:1}}

#splash.quick .sp-a{display:none}
#splash.quick .sp-ring .r2{animation-duration:.9s;animation-delay:0s}
#splash.quick .sp-mark{animation-delay:0s}
#splash.quick .sp-g4 i:nth-child(1){animation-delay:.15s}#splash.quick .sp-g4 i:nth-child(2){animation-delay:.25s}#splash.quick .sp-g4 i:nth-child(3){animation-delay:.35s}#splash.quick .sp-g4 i:nth-child(4){animation-delay:.45s}
#splash.quick .sp-orbit{animation-delay:.6s,.6s}
#splash.quick .sp-ping,#splash.quick .sp-sweep{animation-delay:.5s}
#splash.quick .sp-ar{animation-duration:.8s;animation-delay:.35s}
#splash.quick .sp-b .sp-orn s{animation-delay:.8s}#splash.quick .sp-b .sp-orn em{animation-delay:.75s}
#splash.quick .sp-grp{animation-delay:.9s}
#splash.quick .sp-load{animation-delay:.9s}#splash.quick .sp-bar b{animation-duration:1s;animation-delay:1s}
#splash.quick .sp-skip{display:none}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
.afm{padding:0;overflow:hidden}

.afm-bd{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.afm-sec{display:flex;flex-direction:column;gap:8px}

.afm-ft .btn:first-child{flex:1}
.advref{font-family:var(--f-disp);font-size:10.5px;color:var(--muted);letter-spacing:.4px}
.mt{padding:12px 0;border-bottom:1px solid var(--line)}.mt:last-child{border:0}
.mt-top{display:flex;gap:10px;align-items:flex-start}.mt-ic{flex:none;width:40px;height:40px;border-radius:11px;background:var(--gold-soft);display:grid;place-items:center;font-size:20px}

// رسم أعمدة ذكي: يملأ العرض، متكدّس حسب الفروع، توقّع، خط متوسط، تمييز الأعلى/الأقل، تفاصيل عند الضغط
function smartBars({labels,series,proj=[],avg=null,avgLbl='المتوسط',avgEnd=false,info=[],marks={},h=190,sub=[]}){
  const n=labels.length; if(!n) return ''; const W=340, top=22, bot=sub.length?34:20, H=h, ch=H-top-bot;
  const tots=labels.map((_,i)=>sum(series.map(s=>s.vals[i]||0)));
  const mx=Math.max(1,...tots.map((t,i)=>t+(proj[i]||0)),avg||0)*1.08;
  const slot=W/n, bw=Math.max(4,Math.min(34,slot*0.66)); const Y=v=>top+ch-(v/mx)*ch;
  let g=`<defs><pattern id="sbp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="rgba(212,175,55,.10)"/><line x1="0" y1="0" x2="0" y2="6" stroke="rgba(212,175,55,.55)" stroke-width="2"/></pattern></defs>`;
  [0.25,0.5,0.75,1].forEach(f=>{const y=top+ch-f*ch;g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width=".6"/>`;});
  labels.forEach((l,i)=>{ const x=i*slot+(slot-bw)/2; let y0=top+ch; const hl=marks[i];
    const op=hl||marks.focus==null?1:.9;
    series.forEach(s=>{const v=s.vals[i]||0; if(!v) return; const hh=(v/mx)*ch; y0-=hh; g+=`<rect x="${x}" y="${y0}" width="${bw}" height="${hh}" fill="${s.color}" opacity="${op}"/>`;});
    if(proj[i]){ const hh=(proj[i]/mx)*ch; g+=`<rect x="${x+.5}" y="${y0-hh+.5}" width="${bw-1}" height="${hh-1}" fill="url(#sbp)" stroke="rgba(212,175,55,.75)" stroke-dasharray="3 2" rx="2"/>`; y0-=hh; }
    if(y0<top+ch&&!proj[i]) g+=`<rect x="${x}" y="${y0}" width="${bw}" height="3" rx="1.5" fill="rgba(255,255,255,.35)"/>`;
    if(hl){ const t=tots[i]+(proj[i]||0); g+=`<text x="${x+bw/2}" y="${Y(t)-6}" text-anchor="middle" font-size="${n>14?8.5:10}" font-weight="700" fill="${hl.c}">${hl.t}</text>`; }
    const lab=n>16?((i===0||i===n-1||(+l)%5===0)?l:''):l;
    if(lab!=='') g+=`<text x="${x+bw/2}" y="${top+ch+13}" text-anchor="middle" font-size="${n>8?8.5:10}" fill="var(--muted)">${lab}</text>`;
    if(sub[i]) g+=`<text x="${x+bw/2}" y="${top+ch+27}" text-anchor="middle" font-size="8.5" font-weight="700" fill="${sub[i].c}">${sub[i].t}</text>`;
    g+=`<rect x="${i*slot}" y="0" width="${slot}" height="${H}" fill="transparent" data-sbi="${i}" style="cursor:pointer"/>`;
  });
  if(avg){ const y=Y(avg), lw=avgLbl.length*5.6+12; g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#1E5A3E" stroke-width="1.2" stroke-dasharray="5 4" opacity=".75"/><rect x="${avgEnd?W-lw:0}" y="${y-15}" width="${lw}" height="13" rx="6.5" fill="#1E5A3E"/><text x="${avgEnd?W-lw/2:lw/2}" y="${y-5.5}" text-anchor="middle" font-size="8.5" fill="#F6E7B0" font-weight="600">${avgLbl}</text>`; }
  return `<div class="sbw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;direction:ltr;overflow:visible">${g}</svg><div class="sb-info" data-sbinfo='${esc(JSON.stringify(info))}'><span class="muted">اضغط على أي عمود لعرض التفاصيل</span></div></div>`;
}
document.addEventListener('click',e=>{ const r=e.target.closest('[data-sbi]'); if(!r) return; const w=r.closest('.sbw'); const box=w.querySelector('.sb-info'); let L=[]; try{L=JSON.parse(box.dataset.sbinfo);}catch(_){}
  const it=L[+r.dataset.sbi]; if(!it) return; w.querySelectorAll('.sb-sel').forEach(x=>x.remove());
  const svg=w.querySelector('svg'); const sel=document.createElementNS('http://www.w3.org/2000/svg','rect'); sel.setAttribute('class','sb-sel'); ['x','y','width','height'].forEach(k=>sel.setAttribute(k,r.getAttribute(k))); sel.setAttribute('fill','rgba(30,90,62,.08)'); sel.setAttribute('rx','4'); svg.insertBefore(sel,svg.children[1]);
  box.innerHTML='<div>'+it+'</div>'; });

function donut(parts){
  const t=sum(parts.map(p=>p.v));if(!t) return '<div class="empty">لا توجد بيانات</div>';
  let a=-Math.PI/2,g='';const R=62,r=40,c=70;
  parts.forEach(p=>{const f=p.v/t;if(f<=0)return;const da=f*Math.PI*2,a2=a+da,l=da>Math.PI?1:0,P=(ang,rr)=>[c+rr*Math.cos(ang),c+rr*Math.sin(ang)];
    const [x1,y1]=P(a,R),[x2,y2]=P(a2,R),[x3,y3]=P(a2,r),[x4,y4]=P(a,r);
    g+=f>.9999?`<circle cx="${c}" cy="${c}" r="${(R+r)/2}" fill="none" stroke="${p.color}" stroke-width="${R-r}"/>`:`<path d="M${x1},${y1} A${R},${R} 0 ${l} 1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${l} 0 ${x4},${y4}Z" fill="${p.color}" stroke="var(--card)" stroke-width="2"/>`;a=a2;});
  return `<svg width="140" height="140" viewBox="0 0 140 140" style="flex:none">${g}<text x="70" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fg)">${fk(t)}</text></svg>`;
}

function stmtTotals(s){ const t={rev:0,cogs:0,opex:0,groups:{}}; (s.groups||[]).forEach(g=>{const v=sum((g.a||[]).map(a=>a.v));t[g.cat]=(t[g.cat]||0)+v; const k=g.cat+'|'+g.n; t.groups[k]=(t.groups[k]||0)+v;}); t.gross=t.rev-t.cogs; t.net=t.gross-t.opex; return t; }
function aggTotals(list){ const t={rev:0,cogs:0,opex:0,groups:{},est:false}; list.forEach(s=>{const x=stmtTotals(s);t.rev+=x.rev;t.cogs+=x.cogs;t.opex+=x.opex;for(const k in x.groups)t.groups[k]=(t.groups[k]||0)+x.groups[k];if(s.is_estimate)t.est=true;}); t.gross=t.rev-t.cogs;t.net=t.gross-t.opex; return t; }

// تجميع بيانات فرع لشهر
function wsCalc(cfg,docs,per,b,m){

  const D=docs.filter(d=>d.br===b&&(d.from||'').slice(0,7)===m&&(!asOf||d.from<=asOf));
  const cover=new Set(); D.forEach(d=>wsDays(d.from,d.to||d.from).forEach(x=>{ if(!asOf||x<=asOf) cover.add(x); }));

    if(k){ const u=(it.unit||'').trim()||'—'; t.qty[u]=(t.qty[u]||0)+q; } }));

function wsMerge(cfg,list){ // دمج عدة فروع

  list.forEach(x=>Object.values(x.other.items).forEach(i=>{const k=i.code||i.name;const y=o.other.items[k]=o.other.items[k]||{...i,qty:0,cost:0};y.qty+=i.qty;y.cost+=i.cost;}));

const ATT_DOW=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const attHM=ts=>{ if(!ts) return '—'; const d=new Date(ts); return d.toLocaleTimeString('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Riyadh'}); };
const attMin=t=>{ if(!t) return null; const [h,m]=String(t).split(':').map(Number); return h*60+(m||0); };
const attLocMin=ts=>{ const s=new Date(ts).toLocaleTimeString('en-GB',{hour12:false,hour:'2-digit',minute:'2-digit',timeZone:'Asia/Riyadh'}); return attMin(s); };
const attDur=m=>m==null?'—':(m>=60?Math.floor(m/60)+' س'+(m%60?' '+(m%60)+' د':''):m+' د');
const attDist=(a,b,c,d)=>{const R=6371000,r=x=>x*Math.PI/180;const h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h)));};
function attGeo(){ return new Promise((res,rej)=>{ if(!navigator.geolocation) return rej(new Error('الجوال ما يدعم تحديد الموقع')); navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),e=>rej(new Error(e.code===1?'لازم تسمح للتطبيق باستخدام الموقع من إعدادات الجوال':'ما قدرنا نحدد موقعك — تأكد إن الموقع (GPS) شغّال')),{enableHighAccuracy:true,timeout:20000,maximumAge:0}); }); }
// حالة يوم لموظف: late/early/worked
function attEval(rec,sh,day){ const o={}; if(!rec) return o; if(sh&&rec.in_at){ const st=attMin(sh.start_t||sh.start), g=+(sh.grace??10); let im=attLocMin(rec.in_at); if(im<st-12*60) im+=1440; o.late=Math.max(0,im-st-g); if(o.late===0) o.late=0; }
  if(sh&&rec.out_at&&rec.in_at){ const st=attMin(sh.start_t||sh.start); let en=attMin(sh.end_t||sh.end); if(en<=st) en+=1440; let om=attLocMin(rec.out_at); if(om<st-6*60) om+=1440; o.early=Math.max(0,en-om); }
  if(rec.in_at&&rec.out_at) o.worked=Math.round((new Date(rec.out_at)-new Date(rec.in_at))/60000); return o; }
const attSince=(sh,D,br)=>{ const a=sh&&sh.created_at?String(sh.created_at).slice(0,10):null; const f=(D.recs.filter(r=>r.branch===br).map(r=>r.day).sort()[0])||null; return [a,f].filter(Boolean).sort().pop()||'9999'; };
const attIsOff=(sh,day)=>!!(sh&&(sh.off_days||sh.off||[]).includes(new Date(day+'T12:00:00').getDay()));

async function attGo(kind,btn){ const A=st._attMe; if(!A||!A.geo) return; btn.disabled=true; const old=btn.textContent; btn.textContent='📡 جاري تحديد موقعك…';

  const sh={}; (S.data||[]).forEach(x=>sh[x.emp_id]=x); const geo={}; (G.data||[]).forEach(x=>geo[x.branch]=x); const acc=new Set((AC.data||[]).map(x=>x.emp_id));
  return {emps:(E.data||[]).filter(e=>bs.includes(e.branch)),sh,recs:R.data||[],geo,acc}; }

    h+=`<div class="hr-sg att-k">${[['in','حاضر',c('in')],['late','متأخرين',late,'#C0601F'],['abs','غايب',c('abs')],['out','انصرف',c('out')]].map(([k,n,v,col])=>`<div class="hr-st" style="--c:${col||SL[k][1]}"><b class="num">${v}</b><span>${n}</span></div>`).join('')}</div>`;
    const ord={abs:0,in:1,wait:2,out:3,nos:4,off:5};
    h+=`<div class="card">${rows.length?rows.sort((a,b)=>ord[a.stt]-ord[b.stt]||a.e.name.localeCompare(b.e.name,'ar')).map(x=>`<button class="hr-row" data-attemp="${x.e.id}"><span class="hr-ic">${x.stt==='in'?'🟢':x.stt==='out'?'🏁':x.stt==='abs'?'🔴':x.stt==='off'?'🌙':'⏳'}</span><span class="hr-m"><b>${esc(x.e.name)}</b><small>${esc(brById(x.e.branch).name)}${x.s?` · ${attHM('2000-01-01T'+x.s.start_t+'+03:00')}–${attHM('2000-01-01T'+x.s.end_t+'+03:00')}`:''}${x.r?` · دخل ${attHM(x.r.in_at)}${x.r.out_at?' · خرج '+attHM(x.r.out_at):''}`:''}${x.r&&x.r.manual?' · ✏️ تصحيح':''}${D.acc.has(x.e.id)?'':' · بدون حساب'}</small></span><span style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex:none"><span class="hr-b" style="background:${SL[x.stt][1]}1f;color:${SL[x.stt][1]}">${SL[x.stt][0]}</span>${x.ev.late?`<span class="hr-b warn">تأخير ${attDur(x.ev.late)}</span>`:''}${x.ev.early?`<span class="hr-b soon">خروج مبكر ${attDur(x.ev.early)}</span>`:''}</span></button>`).join(''):'<div class="empty">ما فيه موظفين</div>'}</div>

  const end=to<today?to:today; const days=[]; for(let d=1;d<=last;d++){ const x=m+'-'+String(d).padStart(2,'0'); if(x<=end) days.push(x); }

    return {e,s,pres,abs,late,lateN,early,work,man}; });
  st._attM={S,m,days};
  let h=`<div class="bar-row">${branchChips()}</div><div class="chips"><button data-attt="day" aria-pressed="false">📅 اليوم</button><button data-attt="month" aria-pressed="true">📊 الكشف الشهري</button></div>

    <div class="hr-sg att-k">${[['حضور',sum(S.map(x=>x.pres)),'#1B8A5C'],['غياب',sum(S.map(x=>x.abs)),'#C0392B'],['مرات تأخير',sum(S.map(x=>x.lateN)),'#C0601F'],['ساعات تأخير',Math.round(sum(S.map(x=>x.late))/6)/10,'#8A6A10']].map(([n,v,col])=>`<div class="hr-st" style="--c:${col}"><b class="num">${v}</b><span>${n}</span></div>`).join('')}</div>

document.addEventListener('click',async e=>{
  const f=e.target.closest('[data-lf]'); if(f){st.loanF=f.dataset.lf;render();return;}
  const b=e.target.closest('[data-lp]'); if(!b||b.disabled) return;
  const [id,n]=b.dataset.lp.split('|'); b.disabled=true;
  try{
    const r=await sb.from('app_docs').select('data').eq('app','loans').eq('coll','contracts').eq('id',id).maybeSingle();
    if(r.error||!r.data) throw new Error(r.error?r.error.message:'غير موجود');
    const d=r.data.data,x=(d.sched||[]).find(s=>s.n===+n); if(!x) throw new Error('القسط غير موجود');
    const due=x.date<=todayIso(); let nowPaid;
    if(due){ if(x.unpaid){delete x.unpaid; nowPaid=true;} else {x.unpaid=true; nowPaid=false;} delete x.paid; delete x.paidOn; }
    else { x.paid=!x.paid; nowPaid=x.paid; if(x.paid) x.paidOn=todayIso(); else delete x.paidOn; }
    const u=await sb.from('app_docs').update({data:d,updated_at:new Date().toISOString()}).eq('app','loans').eq('coll','contracts').eq('id',id);
    if(u.error) throw new Error(u.error.message);

    document.querySelectorAll('#view details').forEach((el,i)=>{if(open[i]) el.open=true;});
  }catch(err){ b.disabled=false; toast('تعذّر: '+err.message); }
});

// ----- إشعارات الجوال (Push) -----
const PUSH_FN=()=>CFG.url+'/functions/v1/push';
const pushOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let swReg=null;
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(r=>{swReg=r;}).catch(()=>{});
async function pushSub(){ if(!pushOK()) return null; const r=swReg||await navigator.serviceWorker.getRegistration(); return r?r.pushManager.getSubscription():null; }
const b64u=s=>{const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0));};
async function pushRegister(sub){ const j=sub.toJSON(); const r=await sb.rpc('push_register',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_ua:navigator.userAgent}); if(r.error) throw r.error; st.pushOn=true; }
async function pushEnable(){
  if(isIOS()&&!isStandalone()){ toast('على الآيفون: ثبّت التطبيق أولاً من زر المشاركة ← «إضافة إلى الشاشة الرئيسية»، وافتحه من الأيقونة'); return; }
  if(!pushOK()){ toast('المتصفح هذا ما يدعم الإشعارات — افتح المنصة من Chrome أو Safari'); return; }
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){ toast(perm==='denied'?'الإشعارات محظورة — فعّلها من إعدادات المتصفح للموقع':'لم يتم التفعيل'); return; }
  try{
    const reg=swReg||await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){ let key=null; for(let i=0;i<8&&!key;i++){ const r=await sb.rpc('push_key'); if(r.error) throw r.error; key=r.data; if(!key) await new Promise(z=>setTimeout(z,1500)); } if(!key) throw new Error('مفتاح الإشعارات ما جهز — تأكد من نشر دالة push وجرّب بعد دقيقة'); sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)}); }
    await pushRegister(sub);
    toast('تم تفعيل الإشعارات على هذا الجهاز ✓ — يوصلك إشعار تجريبي'); await sb.rpc('push_test');
    const pn=$('#npanel'); if(pn&&!pn.hidden) pn.innerHTML=npanelHtml(); if(['home','me'].includes(st.tab)) render();
  }catch(e){ console.error(e); toast('تعذّر التفعيل: '+(/push_key|push_register|schema cache/i.test(e.message||'')?'شغّل ملف تحديث الإشعارات أولاً':(e.message||e))); }
}
async function pushSync(){ try{ if(!pushOK()||Notification.permission!=='granted') return; const sub=await pushSub(); if(sub){ await pushRegister(sub); const pn=$('#npanel'); if(pn&&!pn.hidden) pn.innerHTML=npanelHtml(); } }catch(e){} }
function pushBox(inPanel){
  if(st.pushOn) return inPanel?`<div class="pushok">🔔 الإشعارات مفعّلة على هذا الجهاز <button class="lnk" data-ptest="1">تجربة</button></div>`:'';
  if(!inPanel){ try{ if(localStorage.getItem('pushHide')) return ''; }catch(e){} }
  if(!pushOK()&&!isIOS()) return '';
  const denied=pushOK()&&Notification.permission==='denied';
  return `<div class="pushbox"><div style="font-size:22px">🔔</div><div style="flex:1;min-width:0"><b>فعّل إشعارات الجوال</b><div>${denied?'الإشعارات محظورة — فعّلها من إعدادات المتصفح لهذا الموقع':isIOS()&&!isStandalone()?'على الآيفون: ثبّت التطبيق على الشاشة الرئيسية أولاً':'توصلك التنبيهات حتى والتطبيق مقفل'}</div></div>${denied?'':`<button class="btn sm" data-pon="1">تفعيل</button>`}${inPanel?'':`<button class="pclose" data-phide="1" aria-label="إخفاء">×</button>`}</div>`;
}

function aiMd(t){ const e=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  return e.split('\n').map(l=>{const m=l.match(/^\s*[-•]\s+(.*)/);if(m)return `<li>${m[1]}</li>`;const n=l.match(/^\s*(\d+)[.)]\s+(.*)/);if(n)return `<li class="n"><i>${n[1]}</i>${n[2]}</li>`;return l.trim()?`<p>${l}</p>`:'';}).join('').replace(/(<li[^>]*>.*?<\/li>)+/g,m=>`<ul>${m}</ul>`);}
async function aiLLM(q,onText){
  const ctx=await aiCtx(); const {data:{session}}=await sb.auth.getSession(); if(!session) throw new Error('nosession');
  const ac=new AbortController(); const to=setTimeout(()=>ac.abort(),120000);
  try{
    const r=await fetch(CFG.url+'/functions/v1/'+AI_FN,{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':CFG.key},body:JSON.stringify({question:q,history:(st.aiConv||[]).slice(-10),context:JSON.stringify(ctx)})});
    if(!r.ok||!r.body){ throw new Error('http '+r.status); }
    const rd=r.body.getReader(), dec=new TextDecoder(); let raw='';
    const vis=()=>raw.split('\u001e').pop().replace(/\u0015/g,'');
    while(true){ const {done,value}=await rd.read(); if(done) break; raw+=dec.decode(value,{stream:true}); const v=vis(); onText(v, raw.endsWith('\u001e')); }
    const txt=vis().trim(); const broke=raw.includes('\u0015');
    if(!txt) throw new Error(broke?'upstream':'empty');
    return {txt,broke};
  } finally { clearTimeout(to); }
}

V.users=async()=>{
  const [P,UB,US]=await Promise.all([sb.from('profiles').select('*').neq('role','employee').order('created_at'),sb.from('user_branches').select('*'),sb.from('user_sections').select('*')]);
  if(P.error) throw P.error;
  const ub=UB.data||[],us=US.data||[];
  const canManage=u=>u.role!=='owner'&&(isOwner()||u.role==='user');
  const q=(st.uq||'').trim().toLowerCase(); st.uOpen=st.uOpen||{};
  let h=`<div class="usr-top"><div class="usr-s"><input class="inp" id="usq" type="search" placeholder="🔍 ابحث بالاسم أو اسم المستخدم" value="${esc(st.uq||'')}" autocomplete="off"></div><button class="btn sm" data-uadd="1">${st.uAdd?'إغلاق':'＋ مستخدم'}</button></div>
  <div class="muted" id="usqn" style="font-size:11.5px;margin:-6px 2px 0">${P.data.length} مستخدم</div>`;
  h+=`<div class="card usr" ${st.uAdd?'':'hidden'}><h3 style="font-size:15px">إضافة مستخدم</h3><form class="row" id="nuf" autocomplete="off">
    <div class="field"><label for="nun">الاسم</label><input class="inp" id="nun" required placeholder="مدير فرع العزيزية"></div>
    <div class="field"><label for="nuu">اسم المستخدم (إنجليزي)</label><input class="inp" id="nuu" required dir="ltr" autocapitalize="none" pattern="[a-z0-9._\-]{3,30}" placeholder="azizia"></div>
    <div class="field"><label for="nup">كلمة المرور (8 أحرف على الأقل)</label><input class="inp" id="nup" required dir="ltr" minlength="8"></div>
    <div class="field" style="justify-content:flex-end"><button class="btn" type="submit" id="nub">إنشاء الحساب</button></div></form>
    <div class="muted" style="font-size:12px">بعد الإنشاء حدّد فروعه وأقسامه من القائمة تحت. المستخدم الجديد لا يرى أي شيء حتى تعطيه صلاحية.</div><div class="err" id="nue"></div></div>`;
  h+=P.data.map(u=>{const m=canManage(u),adminLike=u.role!=='user';
    const bn=st.branches.filter(b=>ub.some(x=>x.user_id===u.id&&x.branch_id===b.id)).map(b=>b.name), sn=us.filter(x=>x.user_id===u.id).length;
    const sum=adminLike?(u.role==='sync'?'مهام تلقائية':'كل الفروع والأقسام'):(bn.length?bn.join('، '):'بدون فرع')+' · '+(sn?sn+' شاشة':'بدون صلاحيات');
    const qq=(u.full_name||'')+' '+u.username, open=!!st.uOpen[u.id];
    return `<div class="card ucard usr" data-q="${esc(qq.toLowerCase())}" ${q&&!qq.toLowerCase().includes(q)?'hidden':''}><button class="utop" type="button" data-uo="${u.id}" aria-expanded="${open}"><span class="uav">${esc((u.full_name||u.username).trim().charAt(0))}</span><div style="flex:1;min-width:0;text-align:right"><b>${esc(u.full_name||u.username)}</b> <span class="role ${u.role}">${ROLE_NAME[u.role]}</span> ${u.active?'':'<span class="tag" style="color:var(--down)">موقوف</span>'}<div class="usum"><span dir="ltr">${esc(u.username)}</span> · ${esc(sum)}</div></div><span class="uchev">⌄</span></button><div class="ubody" ${open?'':'hidden'}><div class="uhead">
      <div style="display:flex;flex-wrap:wrap;gap:6px">${isOwner()&&['admin','user'].includes(u.role)?`<button class="btn ghost sm" data-role="${u.id}" data-to="${u.role==='admin'?'user':'admin'}">${u.role==='admin'?'تحويل لمستخدم':'ترقية لآدمن'}</button>`:''}${u.role!=='sync'&&(m||(u.id===st.user.id&&u.role==='owner'))?`<button class="btn ghost sm" data-nmt="${u.id}">تعديل اسم المستخدم</button>`:''}${m?`<button class="btn ghost sm" data-pwt="${u.id}">تغيير كلمة المرور</button><button class="btn ghost sm" data-act="${u.id}" data-to="${u.active?0:1}">${u.active?'إيقاف':'تفعيل'}</button>`:''}</div></div>
      <form class="row nmf" data-uid="${u.id}" data-un="${esc(u.username)}" data-fn="${esc(u.full_name||'')}" hidden autocomplete="off"><div class="field"><label for="nu_${u.id}">اسم المستخدم للدخول (إنجليزي)</label><input class="inp" id="nu_${u.id}" name="un" required dir="ltr" autocapitalize="none" pattern="[a-z0-9._\-]{3,30}" value="${esc(u.username)}"></div><div class="field"><label for="nm_${u.id}">الاسم الظاهر</label><input class="inp" id="nm_${u.id}" name="fn" required maxlength="60" value="${esc(u.full_name||'')}"></div><div class="field" style="justify-content:flex-end;flex:none"><button class="btn sm" type="submit">حفظ</button></div></form>
      ${m?`<form class="row pwf" data-uid="${u.id}" hidden autocomplete="off"><div class="field"><label for="pw_${u.id}">كلمة المرور الجديدة لـ ${esc(u.full_name||u.username)}</label><input class="inp" id="pw_${u.id}" dir="ltr" minlength="8" required autocomplete="new-password"></div><div class="field" style="justify-content:flex-end;flex:none"><button class="btn sm" type="submit">حفظ</button></div></form>`:''}
      ${adminLike?`<div class="muted" style="font-size:13px">${u.role==='owner'?'المالك يرى كل شيء، ولا يمكن تعديل حسابه.':u.role==='sync'?'حساب المهام التلقائية: يكتب أرقام التقارير فقط، ولا يدير المستخدمين.':'الآدمن يرى كل الفروع والأقسام، ويدير المستخدمين.'}</div>`:
      `<div><div class="muted" style="font-size:12px;margin-bottom:4px">الفروع</div><div class="tgrid">${st.branches.map(b=>{const on=ub.some(x=>x.user_id===u.id&&x.branch_id===b.id);return `<button class="tg" data-tb="${u.id}" data-k="b:${b.id}" aria-pressed="${on}" ${m?'':'disabled'}><i class="dot" style="background:${b.color}"></i>${esc(b.name)}</button>`;}).join('')}</div></div>
      <div><div class="muted" style="font-size:12px;margin-bottom:6px">الأقسام والشاشات</div>${PERM_GROUPS.map((g,gi)=>{const n=g.secs.filter(s=>us.some(x=>x.user_id===u.id&&x.section===s)).length;return `<div class="pgrp"><div class="pgh"><b>${g.name}</b><span class="muted num" style="font-size:11.5px">${n} من ${g.secs.length}</span>${m?`<button class="btn ghost sm" type="button" data-pga="${u.id}" data-g="${gi}" data-on="${n<g.secs.length?1:0}">${n<g.secs.length?'تحديد الكل':'إلغاء الكل'}</button>`:''}</div><div class="tgrid">${g.secs.map(s=>{const on=us.some(x=>x.user_id===u.id&&x.section===s);return `<button class="tg" data-tb="${u.id}" data-k="s:${s}" aria-pressed="${on}" ${m?'':'disabled'}>${SEC_NAME[s]}</button>`;}).join('')}</div></div>`;}).join('')}</div>
      ${us.some(x=>x.user_id===u.id&&x.section==='income')?'':us.some(x=>x.user_id===u.id&&x.section==='wh')?'<div class="muted" style="font-size:12px">يرى نسبة تكلفة المستودعات فقط، بدون الإيرادات أو المصروفات.</div>':''}`}
    </div></div>`;}).join('');
  h+=`<div class="card usr"><h3 style="font-size:15px">تغيير كلمة المرور الخاصة بك</h3><form class="row" id="cpf"><div class="field"><label for="cpn">كلمة المرور الجديدة</label><input class="inp" id="cpn" type="password" minlength="8" required dir="ltr" autocomplete="new-password"></div><div class="field" style="justify-content:flex-end"><button class="btn" type="submit">تغيير</button></div></form></div>`;
  return h;
};
document.addEventListener('click',async e=>{
  const uo=e.target.closest('[data-uo]'); if(uo){st.uOpen=st.uOpen||{};const o=!st.uOpen[uo.dataset.uo];st.uOpen[uo.dataset.uo]=o;uo.setAttribute('aria-expanded',o);uo.nextElementSibling.hidden=!o;return;}
  if(e.target.closest('[data-uadd]')){st.uAdd=!st.uAdd;render();return;}
  const ga=e.target.closest('[data-pga]'); if(ga&&!ga.disabled){
    const uid=ga.dataset.pga,g=PERM_GROUPS[+ga.dataset.g],on=ga.dataset.on==='1'; ga.disabled=true;
    let r; if(on){const ex=await sb.from('user_sections').select('section').eq('user_id',uid).in('section',g.secs); const have=(ex.data||[]).map(x=>x.section), add=g.secs.filter(s=>!have.includes(s)); r=ex.error?ex:(add.length?await sb.from('user_sections').insert(add.map(s=>({user_id:uid,section:s}))):{error:null});} else r=await sb.from('user_sections').delete().eq('user_id',uid).in('section',g.secs);
    ga.disabled=false; if(r.error){toast('تعذّر الحفظ: '+r.error.message);return;} toast('تم الحفظ'); render(); return;}
  const t=e.target.closest('[data-tb]'); if(t&&!t.disabled){
    const uid=t.dataset.tb,[k,id]=t.dataset.k.split(':'),on=t.getAttribute('aria-pressed')==='true';
    const tbl=k==='b'?'user_branches':'user_sections',col=k==='b'?'branch_id':'section';
    t.disabled=true;
    const r=on?await sb.from(tbl).delete().eq('user_id',uid).eq(col,id):await sb.from(tbl).insert({user_id:uid,[col]:id});
    t.disabled=false; if(r.error){toast('تعذّر الحفظ: '+r.error.message);return;}
    t.setAttribute('aria-pressed',String(!on)); toast('تم الحفظ'); return;}
  const nt=e.target.closest('[data-nmt]'); if(nt){const f=document.querySelector(`.nmf[data-uid="${nt.dataset.nmt}"]`); if(f){f.hidden=!f.hidden; if(!f.hidden){const i=f.querySelector('input');i.focus();i.select();}} return;}
  const pt=e.target.closest('[data-pwt]'); if(pt){const f=document.querySelector(`.pwf[data-uid="${pt.dataset.pwt}"]`); if(f){f.hidden=!f.hidden; if(!f.hidden) f.querySelector('input').focus();} return;}
  const a=e.target.closest('[data-act]'); if(a){const {error}=await sb.from('profiles').update({active:a.dataset.to==='1'}).eq('id',a.dataset.act);if(error){toast('تعذّر: '+error.message);return;}render();return;}
  const r=e.target.closest('[data-role]'); if(r){const {error}=await sb.from('profiles').update({role:r.dataset.to}).eq('id',r.dataset.role);if(error){toast('تعذّر: '+error.message);return;}render();}
});
document.addEventListener('submit',async e=>{
  if(e.target.classList.contains('nmf')){ e.preventDefault();
    const f=e.target,uid=f.dataset.uid,un=f.querySelector('[name=un]').value.trim().toLowerCase(),fn=f.querySelector('[name=fn]').value.trim(),b=f.querySelector('button');
    if(!/^[a-z0-9._-]{3,30}$/.test(un)){toast('اسم المستخدم بالإنجليزي: حروف وأرقام فقط، 3 أحرف على الأقل');return;}
    if(!fn){toast('اكتب الاسم الظاهر');return;}
    const need=e=>/set_username|set_full_name|function|schema cache/i.test(e.message)?'شغّل ملف names.sql مرة واحدة في Supabase أولاً':e.message;
    b.disabled=true; let err=null;
    if(un!==f.dataset.un){ const r=await sb.rpc('set_username',{p_uid:uid,p_username:un}); if(r.error) err=need(r.error); }
    if(!err&&fn!==f.dataset.fn){ const r=await sb.rpc('set_full_name',{p_uid:uid,p_name:fn}); if(r.error) err=need(r.error); }
    b.disabled=false;
    if(err){toast('تعذّر: '+err);return;}
    if(uid===st.user.id&&st.profile){ st.profile.full_name=fn; st.profile.username=un; $('#uname').textContent=fn||un; $('#urole').textContent=ROLE_NAME[st.profile.role]+' · '+un; }
    toast(un!==f.dataset.un?'تم — الدخول من الآن باسم المستخدم: '+un:'تم الحفظ'); render(); return; }
  if(e.target.id==='nuf'){ e.preventDefault();
    const name=$('#nun').value.trim(),u=$('#nuu').value.trim().toLowerCase(),p=$('#nup').value;
    if(!/^[a-z0-9._-]{3,30}$/.test(u)){$('#nue').textContent='اسم المستخدم بالإنجليزي (حروف وأرقام فقط، 3 أحرف على الأقل)';return;}
    if(p.length<8){$('#nue').textContent='كلمة المرور 8 أحرف على الأقل';return;}
    $('#nub').disabled=true;$('#nue').textContent='';
    const tmp=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'tmp-signup'}});
    const {data,error}=await tmp.auth.signUp({email:u+'@'+DOMAIN,password:p,options:{data:{username:u,full_name:name}}});
    $('#nub').disabled=false;
    if(error){$('#nue').textContent=/registered|exists/i.test(error.message)?'اسم المستخدم مستخدم من قبل':'تعذّر الإنشاء: '+error.message;return;}
    if(data.user&&data.user.identities&&data.user.identities.length===0){$('#nue').textContent='اسم المستخدم مستخدم من قبل';return;}
    toast('تم إنشاء الحساب — حدّد صلاحياته'); render(); }
  if(e.target.classList.contains('pwf')){ e.preventDefault(); const uid=e.target.dataset.uid, inp=$('#pw_'+uid), pw=inp.value;
    if(pw.length<8){toast('كلمة المرور 8 أحرف على الأقل');return;}
    const {error}=await sb.rpc('admin_set_password',{target:uid,new_password:pw});
    if(error){toast(/function|schema cache/i.test(error.message)?'الميزة تحتاج تفعيل في قاعدة البيانات':'تعذّر التغيير: '+error.message);return;}
    inp.value=''; e.target.hidden=true; toast('تم تغيير كلمة المرور — أرسلها لصاحب الحساب'); return; }
  if(e.target.id==='cpf'){ e.preventDefault(); const {error}=await sb.auth.updateUser({password:$('#cpn').value}); toast(error?'تعذّر التغيير: '+error.message:'تم تغيير كلمة المرور'); if(!error) $('#cpn').value=''; }
});

document.addEventListener('input',e=>{ if(e.target.id!=='usq') return; st.uq=e.target.value; const q=e.target.value.trim().toLowerCase(); let n=0;
  document.querySelectorAll('.ucard[data-q]').forEach(c=>{const ok=!q||c.dataset.q.includes(q);c.hidden=!ok;if(ok)n++;}); const el=$('#usqn'); if(el) el.textContent=q?n+' نتيجة':n+' مستخدم'; });
// ----- data entry -----
V.data=async()=>{
  return `<div class="note">إدخال المبيعات والمنافذ وقوائم الدخل صار من داخل كل تطبيق (تبويب «الإدخال» أو «البيانات»)، والتحديث اليومي يصل تلقائياً من المهام المجدولة.</div>
  <div class="card"><h3>استيراد ملف بيانات</h3><p class="muted" style="margin-top:0;font-size:13px">ملف JSON يجهزه Claude من تطبيقاتك. المستندات الموجودة بنفس المعرّف تُستبدل بالجديدة.</p>
    <input type="file" id="impf" class="inp"><div id="impr" style="margin-top:10px"></div></div>`;
};
document.addEventListener('change',async e=>{
  if(e.target.id!=='impf'||!e.target.files[0]) return; const out=$('#impr'); out.innerHTML='<span class="muted">جارِ الاستيراد…</span>';
  try{
    const J=JSON.parse(await e.target.files[0].text()); const docs=J.app_docs||[]; if(!docs.length) throw new Error('الملف لا يحتوي بيانات تطبيقات');
    const now=new Date().toISOString(); const cnt={};
    for(let i=0;i<docs.length;i+=25){ const part=docs.slice(i,i+25).map(d=>({app:d.app,coll:d.coll,id:String(d.id),data:d.data,branches:d.branches||[],updated_at:now}));
      const {error}=await sb.from('app_docs').upsert(part,{onConflict:'app,coll,id'}); if(error) throw new Error(error.message);
      part.forEach(d=>cnt[d.app]=(cnt[d.app]||0)+1); out.innerHTML=`<span class="muted">جارِ الاستيراد… ${Math.min(i+25,docs.length)} / ${docs.length}</span>`; }
    st.cache={}; out.innerHTML=`<div class="ok">تم الاستيراد ✓ — ${Object.entries(cnt).map(([k,v])=>k+': '+v).join(' · ')}</div>`;
  }catch(err){ out.innerHTML=`<div class="err">تعذّر الاستيراد: ${esc(err.message)}</div>`; }
  e.target.value='';
});

// ================= render =================
async function render(){
  if(!allowed(st.tab)&&!(isAdmin()&&SECTIONS.find(s=>s.id===st.tab))) st.tab='home';
  if(st.f!=='all'&&!st.branches.some(b=>b.id===st.f)) st.f='all';
  if(st.branches.length===1) st.f=st.branches[0].id;
  const v=$('#view'); v.innerHTML='<div class="loading">جارِ التحميل…</div>';
  const sec=SECTIONS.find(s=>s.id===st.tab)||{}; document.body.classList.toggle('appmode',!!sec.app); document.body.classList.toggle('aimode',st.tab==='ai');
  try{ v.innerHTML=(['home','me'].includes(st.tab)?pushBox(false):'')+await V[st.tab](); v.querySelectorAll('.sc-end').forEach(s=>s.scrollLeft=s.scrollWidth); if(sec.app) fitApp(); if(sec.page) mountPage(sec); }
  catch(err){ console.error(err); v.innerHTML=`<div class="card"><div class="err">تعذّر تحميل البيانات: ${esc(err.message||err)}</div><button class="btn ghost sm" onclick="location.reload()">إعادة المحاولة</button></div>`; }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState!=='visible'||!st.profile) return; if(st.tab==='fleet'&&st.flEdit) return; const sec=SECTIONS.find(s=>s.id===st.tab)||{}; st.cache={}; st._aiCtx=null; st._alertsAt=0; loadAlerts(); if(!sec.app&&st.tab!=='data'&&st.tab!=='ai') render(); });
sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){ $('#app').hidden=true; $('#login').hidden=false; } });
boot();
})();
</script>
