<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ملصق تقييم العملاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../vendor/qrcode.js"></script>
<style>
@page{size:A5;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#E9E7DE}
body{font-family:'IBM Plex Sans Arabic',sans-serif;display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-family:'Readex Pro',sans-serif}
.tools a,.tools button{border:1px solid #CFCBBE;background:#fff;border-radius:99px;padding:8px 16px;font:inherit;font-size:14px;color:#16231B;text-decoration:none;cursor:pointer}
.tools .on{background:#1E5A3E;color:#fff;border-color:#1E5A3E}
.pg{width:874px;height:1240px;position:relative;overflow:hidden;color:#fff;border-radius:6px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5);
  background:radial-gradient(120% 75% at 85% 0%,var(--b1) 0%,var(--b2) 45%,var(--b3) 100%)}
.pat{position:absolute;inset:0;opacity:.09}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;left:-380px;bottom:-460px;background:radial-gradient(circle,rgba(var(--rgb),.28),transparent 62%)}
.frame{position:absolute;inset:26px;border:2px solid rgba(var(--rgb),.55);border-radius:30px}
.frame::after{content:"";position:absolute;inset:8px;border:1px solid rgba(var(--rgb),.22);border-radius:24px}
.in{position:absolute;inset:26px;display:flex;flex-direction:column;align-items:center;padding:52px 58px 40px;text-align:center}
.brand{display:flex;align-items:center;gap:16px}
.mark{width:66px;height:66px;border-radius:19px;background:linear-gradient(135deg,var(--be2),var(--be3));color:var(--ink);display:grid;place-items:center;font-family:'Readex Pro';font-weight:700;font-size:32px;box-shadow:0 10px 24px -10px rgba(0,0,0,.6)}
.brand b{display:block;font-family:'Readex Pro';font-weight:700;font-size:50px;color:var(--be2);line-height:1.2;text-align:center}
.brand span{display:block;font-size:30px;font-weight:500;opacity:.88;text-align:center;margin-top:4px}
.rule{display:flex;align-items:center;gap:14px;margin:22px 0 18px;width:62%}.rule i{flex:1;height:1.5px;background:linear-gradient(90deg,transparent,rgba(var(--rgb),.8),transparent)}.rule b{color:var(--be);font-size:16px}
h1{font-family:'Readex Pro';font-weight:700;font-size:74px;line-height:1.15;letter-spacing:-.5px}
h1 em{font-style:normal;background:linear-gradient(180deg,var(--be2),var(--be3));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:27px;opacity:.9;margin-top:12px}
.en{font-family:'Readex Pro';font-size:18px;letter-spacing:.6px;opacity:.6;margin-top:6px;direction:ltr}
.qrw{position:relative;margin-top:30px;width:350px;height:350px;border-radius:38px;background:#fff;padding:34px;box-shadow:0 30px 60px -25px rgba(0,0,0,.7),0 0 0 10px rgba(255,255,255,.07)}
.qrw svg.q{width:100%;height:100%;display:block}
.qrw .c{position:absolute;width:62px;height:62px;border:7px solid var(--be3)}
.c.tl{top:-15px;right:-15px;border-left:0;border-bottom:0;border-radius:0 30px 0 0}
.c.tr{top:-15px;left:-15px;border-right:0;border-bottom:0;border-radius:30px 0 0 0}
.c.bl{bottom:-15px;right:-15px;border-left:0;border-top:0;border-radius:0 0 30px 0}
.c.br{bottom:-15px;left:-15px;border-right:0;border-top:0;border-radius:0 0 0 30px}
.qrw .ctr{position:absolute;top:50%;left:50%;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:20px;background:#fff;display:grid;place-items:center}
.qrw .ctr i{width:62px;height:62px;border-radius:16px;background:linear-gradient(135deg,var(--b1),var(--b3));display:grid;place-items:center;color:var(--be2);font-style:normal;font-size:34px}
.scan{margin-top:28px;display:inline-flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:11px 26px;font-family:'Readex Pro';font-weight:600;font-size:22px}
.scan svg{width:28px;height:28px}
.steps{margin-top:32px;display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:start;width:100%;gap:6px}
.st{display:flex;flex-direction:column;align-items:center;gap:10px}
.st .ic{width:78px;height:78px;border-radius:24px;background:rgba(255,255,255,.08);border:1.5px solid rgba(var(--rgb),.5);display:grid;place-items:center}
.st .ic svg{width:40px;height:40px}
.st b{font-family:'Readex Pro';font-weight:600;font-size:21px}
.st span{font-size:15.5px;opacity:.7;line-height:1.35}
.ar{color:var(--be);font-size:26px;margin-top:22px;opacity:.8}
.foot{margin-top:auto;margin-bottom:6px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid rgba(var(--rgb),.3);padding-top:22px}
.foot .l{display:flex;align-items:center;gap:12px;text-align:start;font-size:18px;line-height:1.4}
.foot .l svg{flex:none;width:38px;height:38px}
.foot .l small{display:block;font-size:14.5px;opacity:.65}
.stars{color:var(--be3);font-size:30px;letter-spacing:4px;direction:ltr}
.pg.oud{--b1:#4A1F11;--b2:#3D190D;--b3:#2E1209;--be:#F0DDBA;--be2:#FAEED8;--be3:#E3C99C;--ink:#4A1E10;--rgb:240,221,186}
.pg.mauve{--b1:#B07FDB;--b2:#9D6AD0;--b3:#8A57C2;--be:#F6E7CC;--be2:#FFF6E6;--be3:#F0D9AE;--ink:#5B2D8E;--rgb:246,231,204}
.pg.mauve .in{text-shadow:0 2px 6px rgba(60,20,100,.22)}
.pg.oud .glow,.pg.mauve .glow{display:none}.pg.oud h1 em,.pg.mauve h1 em{background:none;color:var(--be3);-webkit-text-fill-color:var(--be3)}.pg.oud .pat,.pg.mauve .pat{opacity:.06}
.pg.oud,.pg.mauve{background:linear-gradient(180deg,var(--b1) 0%,var(--b2) 55%,var(--b3) 100%)}
.pg.oud .scan,.pg.mauve .scan,.pg.oud .st .ic,.pg.mauve .st .ic{background:rgba(var(--rgb),.14)}
.pg svg [stroke="#F6E7B0"]{stroke:var(--be2)}.pg svg [stroke="#E9CF7A"]{stroke:var(--be)}.pg svg [fill="#E2B93B"]{fill:var(--be3)}.pg svg [stroke="#E9CF7A"][stroke-width="1.2"]{stroke:var(--be)}
.qrw{box-shadow:0 30px 60px -25px rgba(0,0,0,.6),0 0 0 10px rgba(var(--rgb),.14)!important}
@media print{html,body{background:#fff}body{padding:0;gap:0}.tools{display:none}.pg{zoom:.64;border-radius:0;box-shadow:none;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media screen and (max-width:900px){.pg{zoom:calc(100vw / 920px)}}
</style>
</head>
<body>
<div class="tools" id="tools"></div>
<div id="pages"></div>
<script>
(function(){
const BR={az:{n:'مطاعم الشادن',s:'فرع العزيزية',e:'AL-SHADEN RESTAURANTS',m:'ش',t:'oud'},sh:{n:'مطاعم الشادن',s:'فرع شوران',e:'AL-SHADEN RESTAURANTS',m:'ش',t:'oud'},pc:{n:'بروست الباتشينو',s:'Al-Pacino Broast',e:'AL-PACINO BROAST',m:'P',t:'mauve'}};
const q=new URLSearchParams(location.search); const sel=(q.get('b')||'all').toLowerCase(); const list=sel==='all'?Object.keys(BR):[sel].filter(k=>BR[k]);
const url=k=>'https://unifiedplatform.app/review/?b='+k;
function qrSvg(t){const qr=qrcode(0,'H');qr.addData(t);qr.make();const n=qr.getModuleCount();let d='';
  const fin=(r,c)=>(r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7);
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){if(!qr.isDark(r,c)||fin(r,c))continue;d+=`M${c+.12},${r+.12}h.76v.76h-.76z`;}
  const eye=(x,y)=>`<rect x="${x+.5}" y="${y+.5}" width="6" height="6" rx="1.6" fill="none" stroke="var(--ink)" style="stroke:var(--ink)" stroke-width="1"/><rect x="${x+2}" y="${y+2}" width="3" height="3" rx=".8" style="fill:var(--ink)"/>`;
  return `<svg class="q" viewBox="0 0 ${n} ${n}" shape-rendering="geometricPrecision"><path d="${d}" style="fill:var(--ink)"/>${eye(0,0)}${eye(n-7,0)}${eye(0,n-7)}</svg>`;}
const PAT=`<svg class="pat" width="100%" height="100%"><defs><pattern id="p" width="120" height="120" patternUnits="userSpaceOnUse"><g fill="none" stroke="#E9CF7A" stroke-width="1.2"><path d="M60 8 L72 48 L112 60 L72 72 L60 112 L48 72 L8 60 L48 48 Z"/><rect x="38" y="38" width="44" height="44" transform="rotate(45 60 60)"/><circle cx="60" cy="60" r="10"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`;
const I={cam:'<svg viewBox="0 0 24 24" fill="none" stroke="#F6E7B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>',
 star:'<svg viewBox="0 0 24 24" fill="#E2B93B" stroke="#F6E7B0" stroke-width="1" stroke-linejoin="round"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2 6.4 20.2l1.1-6.3L2.9 9.5l6.3-.9z"/></svg>',
 hand:'<svg viewBox="0 0 24 24" fill="none" stroke="#F6E7B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-9.2-9A5 5 0 0 1 12 6.6 5 5 0 0 1 21.2 12C19 16.6 12 21 12 21z"/><path d="M9 12.5l2 2 4-4"/></svg>',
 shield:'<svg viewBox="0 0 24 24" fill="none" stroke="#E9CF7A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.6-3.4 8.3-8 9-4.6-.7-8-4.4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-4.5"/></svg>',
 phone:'<svg viewBox="0 0 24 24" fill="none" stroke="#F6E7B0" stroke-width="1.8" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>'};
document.getElementById('pages').innerHTML=list.map(k=>{const b=BR[k];return `<div class="pg ${b.t}">${PAT}<div class="glow"></div><div class="frame"></div><div class="in">
  <div class="brand"><div><b>${b.n}</b><span>${b.s}</span></div></div>
  <div class="rule"><i></i><b>◆</b><i></i></div>
  <h1>رأيك <em>يصنع الفرق</em></h1>
  <div class="sub">قيّم تجربتك معنا خلال ١٠ ثوانٍ</div>
  <div class="en">YOUR FEEDBACK MATTERS · RATE US IN 10 SECONDS</div>
  <div class="qrw">${qrSvg(url(k))}<i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><div class="ctr"><i>★</i></div></div>
  <div class="scan">${I.phone}<span>وجّه كاميرا جوالك على الكود</span></div>
  <div class="steps">
    <div class="st"><div class="ic">${I.cam}</div><b>امسح الكود</b><span>بدون تحميل<br>أي تطبيق</span></div><div class="ar">‹</div>
    <div class="st"><div class="ic">${I.star}</div><b>قيّم تجربتك</b><span>الطعم، الخدمة<br>والنظافة</span></div><div class="ar">‹</div>
    <div class="st"><div class="ic">${I.hand}</div><b>نتابع معك</b><span>مدير الفرع يتواصل<br>معك شخصياً</span></div>
  </div>
  <div class="foot"><div class="l">${I.shield}<div>ملاحظتك تصل مباشرة لإدارة الفرع<small>Your feedback goes directly to the branch management</small></div></div><div class="stars">★★★★★</div></div>
</div></div>`}).join('');
document.getElementById('tools').innerHTML=[['all','كل الفروع']].concat(Object.keys(BR).map(k=>[k,BR[k].s.startsWith('فرع')?BR[k].s:BR[k].n])).map(([k,n])=>`<a href="?b=${k}" class="${sel===k?'on':''}">${n}</a>`).join('')+'<button onclick="print()">🖨 طباعة</button>';
})();
</script>
</body>
</html>
