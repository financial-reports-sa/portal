<style>:root{color-scheme:light;--bg:#F4F6FA;--card:#FFFFFF;--line:#E1E7EF;--ink:#16233A;--mut:#6B7A90;--gold:#D4AF37;--up:#1FA16B;--down:#D0453A;--soft:#F8FAFC;--soft2:#EEF2F7}*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg)}body{color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}button{cursor:pointer;border:0;background:none}.num{font-family:'Readex Pro',sans-serif;font-variant-numeric:tabular-nums}.wrap{max-width:560px;margin:0 auto;padding:16px 16px 150px}.wrap>*{min-width:0}.top{display:flex;align-items:center;gap:12px;margin:4px 0 16px}.top h1{font-size:22px;font-weight:700}.top .sub{font-size:13px;color:var(--mut)}.logo{width:42px;height:42px;border-radius:12px;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:19px;flex:none}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;overflow:hidden;margin-bottom:12px}.card h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}.card h2 .tag{font-size:12px;color:var(--mut);font-weight:500;margin-inline-start:auto}.lbl{font-size:13px;color:var(--mut);margin-bottom:8px;display:block}.brs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.br{border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;font-weight:600;background:var(--card)}.br i{display:block;width:10px;height:10px;border-radius:50%;margin:0 auto 6px}.br.on{color:#fff}.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft2);border-radius:12px;padding:4px;gap:4px}.seg button{padding:9px;border-radius:9px;font-weight:600;color:var(--mut)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(22,35,58,.12)}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fld{display:block}.fld input,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card);outline:none}input:focus,textarea:focus{border-color:var(--ink)!important}.fld textarea{min-height:70px;resize:vertical}.amt{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft2)}.amt:last-child{border-bottom:0}.amt .dot{width:8px;height:8px;border-radius:50%;flex:none}.amt span{flex:1;font-weight:600;min-width:0}.amt input{width:46%;max-width:190px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;direction:ltr;font-family:'Readex Pro',sans-serif;font-size:17px;background:var(--soft);outline:none}.amt em{font-style:normal;font-size:12px;color:var(--mut);width:22px}.li{display:flex;gap:6px;align-items:center;margin-bottom:8px}.li input{border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--soft);outline:none;min-width:0}.li .la{width:34%;flex:none;direction:ltr;text-align:left;font-size:16px}.li .ln{flex:1;font-size:14px}.lx{width:34px;height:34px;flex:none;border-radius:8px;background:#FBEBEA;color:#B23126;font-size:20px;line-height:1}.ladd{width:100%;padding:10px;border:1.5px dashed var(--line);border-radius:10px;font-weight:600;font-size:14px}.sum{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);padding-top:10px}.sum b{color:var(--ink);font-size:15px}.hint{font-size:12px;color:var(--mut);margin-top:6px}.diff{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}.diff.up{background:#E6F6EF;color:#137A50}.diff.down{background:#FBEBEA;color:#B23126}.diff.eq{background:var(--soft2);color:var(--mut)}.bar{position:fixed;inset-inline:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}.bar .in{max-width:560px;margin:0 auto}.totline{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}.totline small{color:var(--mut);font-size:12px;display:block}.totline b{font-size:22px}.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:13px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:16px}.btn:disabled{opacity:.45}.btn.ghost{background:var(--soft2);color:var(--ink)}.hide{display:none!important}.kv{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;gap:8px}.kv span{color:var(--mut)}.kv.t{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-weight:700}.kv.sub{font-size:12.5px;padding:2px 12px 2px 0}.note{font-size:13px;background:#FFF8E6;border-radius:8px;padding:8px 10px;margin-top:8px;color:#6B5208}.acts{display:flex;gap:8px;margin-top:10px}.acts .btn{flex:1}.empty{text-align:center;color:var(--mut);padding:12px;font-size:14px}.done{text-align:center;padding:26px 16px}.done .ok{width:64px;height:64px;border-radius:50%;background:#E6F6EF;color:var(--up);display:grid;place-items:center;margin:0 auto 12px}.done h2{justify-content:center;font-size:20px}.modal{position:fixed;inset:0;background:rgba(22,35,58,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.sheet h3{font-size:18px;margin-bottom:6px}.sheet p{color:var(--mut);font-size:14px;margin-bottom:14px}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center}.toast.err{background:var(--down)}.err-in{border-color:var(--down)!important}body{font-size:13.5px!important}.card{padding:13px!important}.card h2{font-size:14px!important}.top h1{font-size:19px!important}.logo{width:36px!important;height:36px!important;font-size:16px!important}.br{padding:9px 4px!important;font-size:13.5px}.amt{padding:6px 0!important}.amt span{font-size:13.5px}.amt input{font-size:15px!important;padding:8px 10px!important}.li input{padding:8px!important}.li .la{font-size:14.5px!important}.li .ln{font-size:13px!important}.fld input,.fld textarea{padding:9px 10px!important}.lbl{font-size:12px!important}.hint{font-size:11.5px!important}.totline b{font-size:19px!important}.btn{font-size:15px!important;padding:11px!important}.kv{font-size:13px!important}.ladd{font-size:13px!important;padding:8px!important}.minebtn{margin-inline-start:auto;flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px}.top{justify-content:space-between}.bansh{display:block;width:100%;text-align:right;background:#fbebea;border:1px solid #f3c9c4;color:#b23126;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:12px}.mrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}.mrow .t{display:flex;justify-content:space-between;align-items:center;gap:8px}.mrow .t b{font-size:14px}.mst{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px}.mst.ok{background:#e6f6ef;color:#137a50}.mst.issue{background:#fff1d6;color:#9a6a06}.mst.p{background:var(--soft2);color:var(--mut)}.msum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.msum div{border:1px solid var(--line);border-radius:12px;padding:10px}.msum small{display:block;color:var(--mut);font-size:12px}.msum b{font-size:18px}.retwide{display:block;width:100%;margin:0 0 12px;padding:13px;border-radius:14px;background:#B91C1C;color:#fff;font-weight:800;font-size:15px;box-shadow:0 6px 16px rgba(185,28,28,.25)}.retwide small{font-weight:500;opacity:.85;font-size:12px}.retbtn{background:#B91C1C!important;color:#fff!important;border-color:#B91C1C!important;font-weight:800}.rcard{border:1.5px solid rgba(185,28,28,.35)}.rlist .kv{font-size:13px}.rwarn{background:rgba(185,28,28,.08);color:#991B1B;border-radius:10px;padding:9px 11px;font-size:13px;font-weight:700;margin-top:8px}.rok{background:rgba(15,118,110,.08);color:#0F766E;border-radius:10px;padding:9px 11px;font-size:13px;font-weight:700;margin-top:8px}.rchips{display:flex;flex-wrap:wrap;gap:6px}.rchips button{border:1.5px solid var(--line);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;background:var(--card)}.rchips button.on{background:#B91C1C;border-color:#B91C1C;color:#fff}.rph{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:12px;padding:14px;font-weight:700;cursor:pointer}.rph img{max-height:120px;border-radius:8px}.nochk{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-weight:700;font-size:14px;margin-bottom:10px}.nochk input{width:20px;height:20px}.rph1{margin:2px 0 6px}.rocr{font-size:12.5px;color:var(--mut);margin:0 2px 10px;min-height:0}.rocr:empty{display:none}.rocr.busy{color:#8A6D1F;animation:rpulse 1.2s ease-in-out infinite}.rocr.ok{color:#137A50;font-weight:600}@keyframes rpulse{50%{opacity:.45}}.ocr-on{background:#ECF8F1!important;border-color:#7CC9A0!important}
.rit{margin:0 0 12px;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--soft)}.ritm{display:grid;grid-template-columns:1fr 1fr;gap:6px}.ritm button{font:inherit;font-size:13px;font-weight:600;padding:9px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}.ritm button.on{background:#16233A;color:#fff;border-color:#16233A}.ritl{margin-top:8px;display:flex;flex-direction:column;gap:6px}.riti{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;background:#fff;border:1px solid var(--line)}.riti.on{border-color:#B91C1C;background:#FEF2F2}.ritn{flex:1;min-width:0}.ritn b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ritn small{font-size:11px;color:var(--mut)}.ritq{display:flex;align-items:center;gap:8px}.ritq button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700;cursor:pointer;color:var(--ink)}.ritq b{min-width:18px;text-align:center}.rits{margin-top:8px;text-align:center;font-size:13px}.rits b{color:#B91C1C;font-size:16px}
</style>
<style>
.topbtns{display:flex;gap:6px;align-items:center;margin-inline-start:auto;flex:none}.topbtns .minebtn{margin:0;padding:7px 11px}
.msgbtn{position:relative}
.msgbtn .bd{position:absolute;top:-6px;inset-inline-start:-6px;min-width:19px;height:19px;border-radius:99px;background:var(--down);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.cmban{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:14px;padding:12px 14px;margin-bottom:12px;color:#fff;font:inherit;font-weight:600;text-align:start;cursor:pointer;background:#8E1F17;animation:cmPulse 2s infinite}
@keyframes cmPulse{0%,100%{box-shadow:0 0 0 0 rgba(142,31,23,.35)}50%{box-shadow:0 0 0 6px rgba(142,31,23,0)}}
.cmmsgs{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;padding:4px 2px 10px}
.cmb{max-width:88%;border-radius:14px;padding:9px 12px;font-size:14.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.cmb.a{align-self:flex-start;background:var(--ink);color:#fff;border-end-start-radius:4px}
.cmb.a.notice{background:#2F5D8C}.cmb.a.warn{background:#9A5B00}.cmb.a.final{background:#8E1F17}
.cmb.c{align-self:flex-end;background:var(--soft2);border-end-end-radius:4px}
.cmb .k{display:inline-block;font-size:11px;font-weight:700;background:rgba(255,255,255,.2);border-radius:99px;padding:1px 9px;margin-bottom:4px}
.cmb .m{display:block;font-size:11px;opacity:.7;margin-top:3px}
.cmta{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:15px;background:var(--soft);resize:vertical}
.cmhd{display:flex;align-items:center;gap:10px;margin-bottom:10px}.cmhd .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}

<body>
<div class="wrap">
<div class="top">
<div style="display:flex;gap:12px;align-items:center;min-width:0">
<div class="logo">ت</div>
<div style="min-width:0"><h1>تسليم الوردية</h1><div class="sub">عهدة الكاشير عند نهاية الوردية</div></div>
</div>
<div class="topbtns"><button id="msgBtn" class="minebtn msgbtn">💬 الرسائل<span class="bd" id="msgBd" hidden></span></button><button id="mineBtn" class="minebtn">تسليماتي</button></div>
</div>
<button id="retBtn" class="retwide">↩️ توثيق مرتجع <small>— خلال نص ساعة من الفاتورة</small></button><div id="cmBan"></div><div id="mineBan"></div>
<section id="vForm"></section>
</div>
<div class="bar" id="bar"><div class="in" id="formBar">
<div class="totline">
<div><small>إجمالي الوردية</small><b class="num" id="barTotal">0.00</b> <small style="display:inline">ر.س</small></div>
<div id="barDiff"></div>
</div>
<button class="btn" id="submitBtn">تسليم الوردية</button>
</div></div>
<script>
const BR=[
{k:'az',  n:'العزيزية', c:'#D4AF37', apps:['تطبيق الشادن','هنقرستيشن','كيتا','نينجا']},
{k:'sh',n:'شوران',    c:'#5B8FD0', apps:['تطبيق الشادن','هنقرستيشن','كيتا','نينجا']},
{k:'pc',n:'الباتشينو',c:'#A07BE6', apps:['هنقرستيشن','كيتا','نينجا']},
];
const BM=Object.fromEntries(BR.map(b=>[b.k,b]));
const SH=[{k:'am',n:'الوردية الصباحية'},{k:'pm',n:'الوردية المسائية'}];
const SM=Object.fromEntries(SH.map(s=>[s.k,s]));
const PAY=[{k:'cash',n:'كاش',c:'#0F766E'},{k:'card',n:'شبكة',c:'#334E9E'},{k:'credit',n:'آجل',c:'#B45309'}];
const APPC='#BE185D';
const LISTS=[{k:'transfers',t:'التحويلات البنكية',add:'إضافة تحويل',ph:'اسم المحوِّل / رقم العملية',c:'#0891B2'},{k:'reservations',t:'الحجوزات',add:'إضافة حجز',ph:'اسم العميل / نوع الحجز',c:'#7C3AED'},{k:'returns',t:'المردود',add:'إضافة مردود',ph:'سبب المردود',c:'#64748B'},{k:'invoices',t:'الفواتير',add:'إضافة فاتورة',ph:'رقم الفاتورة / اسم العميل',c:'#4D7C0F'}];
const $=s=>document.querySelector(s);
const SB=(window.supabase&&window.PORTAL_CONFIG)?window.supabase.createClient(window.PORTAL_CONFIG.url,window.PORTAL_CONFIG.key,{auth:{persistSession:false,autoRefreshToken:false}}):null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toEn=s=>String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.').replace(/[,٬\s]/g,'').replace(/[^\d.]/g,'');
const pn=v=>{const x=parseFloat(toEn(v));return isFinite(x)?Math.round(x*100)/100:0};
const r2=n=>Math.round((n||0)*100)/100;
const fmt=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const bizDate=()=>{const d=new Date();if(d.getHours()<6)d.setDate(d.getDate()-1);return iso(d)};
const dShort=s=>pd(s).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{weekday:'long',day:'numeric',month:'long'});
const appsTotal=r=>Object.values(r.apps||{}).reduce((a,b)=>a+(+b||0),0);
const listSum=a=>r2((a||[]).reduce((s,x)=>s+(+x.a||0),0));
const totOf=r=>r2((+r.cash||0)+(+r.card||0)+(+r.credit||0)+(+r.transfer||0)+(+r.invoice||0)+appsTotal(r));
const docOf=()=>r2((S.rets||[]).reduce((a,x)=>a+(+x.amount||0),0));
const undocOf=r=>r.no_ret?0:(r.sys_ret==null?0:Math.max(0,r2(r.sys_ret-docOf())));
const diffOf=r=>r.system==null?null:r2(totOf(r)-r.system-undocOf(r));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function diffBadge(d){if(d==null)return'';if(Math.abs(d)<0.005)return`<span class="diff eq">مطابق</span>`;return d>0?`<span class="diff up">زيادة <span class="num">${fmt(d)}</span></span>`:`<span class="diff down">عجز <span class="num">${fmt(-d)}</span></span>`}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),err?4200:2400)}
function ask(title,body,ok){return new Promise(res=>{const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet"><h3>${title}</h3><div>${body}</div><div class="acts"><button class="btn ghost" data-a="0">رجوع</button><button class="btn" data-a="1">${ok}</button></div></div>`;m.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a||e.target===m){m.remove();res(a?.dataset.a==='1')}});document.body.appendChild(m)})}
const h=new Date().getHours();
const S={done:null,f:{branch:lsGet('ho_branch')||'',shift:'am',date:bizDate(),cashier:lsGet('ho_cashier')||'',pin:lsGet('ho_pin')||'',cash:'',card:'',credit:'',apps:{},transfers:[],reservations:[],returns:[],invoices:[],system:'',notes:'',noRet:false,sysRet:''},rets:null};
function listCard(L){const items=S.f[L.k];return`<div class="card"><h2><i class="dot" style="width:8px;height:8px;border-radius:50%;background:${L.c};display:inline-block"></i>${L.t}${L.k==='returns'?'<span class="tag">للعلم — لا يُخصم</span>':L.k==='reservations'?'<span class="tag">لا يُجمع مع اليومية</span>':''}</h2>${items.map((it,i)=>`<div class="li"><input class="la num" data-l="${L.k}" data-i="${i}" data-f="a" inputmode="decimal" placeholder="المبلغ" value="${esc(it.a)}"><input class="ln" data-l="${L.k}" data-i="${i}" data-f="n" placeholder="${L.ph}" value="${esc(it.n)}"><button class="lx" data-lx="${L.k}" data-i="${i}">×</button></div>`).join('')}<button class="ladd" data-ladd="${L.k}">+ ${L.add}</button>${items.length?`<div class="sum"><span>المجموع (${items.length})</span><b class="num" id="ls_${L.k}">0.00</b></div>`:''}</div>`}
const cleanList=a=>(a||[]).map(x=>({a:pn(x.a),n:String(x.n||'').trim()})).filter(x=>x.a>0);
function amtRow(id,label,color,val){return`<label class="amt"><i class="dot" style="background:${color}"></i><span>${label}</span><input id="${id}" inputmode="decimal" placeholder="0" value="${esc(val)}" autocomplete="off"><em>ر.س</em></label>`}
function detailHTML(r){
const li=a=>(a||[]).map(x=>`<div class="kv sub"><span>${esc(x.n)||'—'}</span><span class="num">${fmt(x.a)}</span></div>`).join('');

function mineBanner(rows){
const sh=rows.filter(r=>r.adj!=null&&+r.adj<0&&String(r.date).slice(0,7)===mon()).reduce((a,r)=>a-(+r.adj),0);
$('#mineBan').innerHTML=sh?`<button class="bansh" id="banBtn">⚠ عليك عجز مسجّل هذا الشهر: <b class="num">${fmt(sh)}</b> ر.س — اضغط للتفاصيل</button>`:'';
const b=$('#banBtn');if(b)b.onclick=()=>showMine(rows);
}
function showMine(rows){
const m=mon(),cur=rows.filter(r=>String(r.date).slice(0,7)===m);
const sh=cur.filter(r=>r.adj!=null&&+r.adj<0).reduce((a,r)=>a-(+r.adj),0),ov=cur.filter(r=>r.adj!=null&&+r.adj>0).reduce((a,r)=>a+(+r.adj),0);
const st=r=>r.status==='ok'?'<span class="mst ok">تمت المراجعة</span>':r.status==='issue'?'<span class="mst issue">عليه ملاحظة</span>':'<span class="mst p">بانتظار المراجعة</span>';
const md=document.createElement('div');md.className='modal';
md.innerHTML=`<div class="sheet"><h3>تسليماتي</h3><p class="hint" style="margin:-4px 0 12px">فرع ${BM[S.f.branch].n} · آخر ٤٥ يوم</p>
<div class="msum"><div><small>العجز هذا الشهر</small><b class="num" style="color:${sh?'#b23126':'var(--ink)'}">${fmt(sh)}</b></div><div><small>تسليماتي هذا الشهر</small><b class="num">${cur.length}</b></div></div>
${ov?`<p class="hint" style="margin:-4px 0 10px">زيادة هذا الشهر: <b class="num" style="color:#137a50">${fmt(ov)}</b></p>`:''}
${rows.length?rows.map(r=>`<div class="mrow"><div class="t"><b>${dShort(r.date)}</b><b class="num">${fmt(r.total)}</b></div>
<div class="t" style="margin-top:6px">${st(r)}${r.adj!=null?diffBadge(+r.adj):''}</div>
${r.note?`<div class="note" style="margin-top:8px">${esc(r.note)}</div>`:''}</div>`).join(''):'<div class="empty">ما فيه تسليمات</div>'}
<p class="hint">إذا عندك اعتراض على عجز، كلّم المحاسب.</p>
<div class="acts"><button class="btn" data-a="0">إغلاق</button></div></div>`;
md.addEventListener('click',e=>{if(e.target===md||e.target.closest('[data-a]'))md.remove()});
document.body.appendChild(md);
}
// ===== رسائل الإدارة =====
const CMK={msg:['رسالة من الإدارة','#16233A','✉️'],notice:['تنبيه','#2F5D8C','🔔'],warn:['إنذار','#9A5B00','⚠️'],final:['إنذار نهائي','#8E1F17','⛔'],reply:['ردّك','#6B7A90','↩']};
const cmT=t=>{const d=new Date(t);return d.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('ar-SA-u-ca-gregory-nu-latn',{hour:'numeric',minute:'2-digit'})};
async function cmFetch(mark){const f=S.f,pin=toEn(f.pin||'').trim();if(!f.branch||!pin||!SB)return null;
 try{const {data:j,error}=await SB.rpc('cmsg_mine',{p_branch:f.branch,p_pin:pin,p_mark:!!mark});if(error||!j||!j.ok)return null;return j.msgs||[]}catch(e){return null}}
function cmPaintBadge(msgs){const un=(msgs||[]).filter(m=>m.side==='admin'&&!m.read);const bd=$('#msgBd');bd.hidden=!un.length;bd.textContent=un.length;
 const last=un[un.length-1];
 $('#cmBan').innerHTML=last?`<button class="cmban" id="cmBanBtn" style="background:${CMK[last.kind][1]}"><span style="font-size:20px">${CMK[last.kind][2]}</span><span style="flex:1">${un.length>1?`عندك ${un.length} رسائل جديدة من الإدارة`:`${CMK[last.kind][0]} من الإدارة — اضغط للقراءة والرد`}</span><span>‹</span></button>`:'';
 const b=$('#cmBanBtn');if(b)b.onclick=()=>cmShow(msgs,true);}
async function cmShow(msgs,fromBan){
 const un=(msgs||[]).filter(m=>m.side==='admin'&&!m.read); const top=un[un.length-1];
 const needReason=un.some(m=>m.kind==='warn'||m.kind==='final');
 const md=document.createElement('div');md.className='modal';
 const k=top?CMK[top.kind]:CMK.msg;
 md.innerHTML=`<div class="sheet"><div class="cmhd"><span class="ic" style="background:${k[1]}1A">${k[2]}</span><div><h3 style="margin:0">${top?k[0]:'الرسائل'}</h3><p class="hint" style="margin:0">من إدارة الفرع · ${BM[S.f.branch]?BM[S.f.branch].n:''}</p></div></div>
 <div class="cmmsgs" id="cmBox">${msgs.length?msgs.map(m=>`<div class="cmb ${m.side==='admin'?'a '+m.kind:'c'}">${m.side==='admin'&&m.kind!=='msg'?`<span class="k">${CMK[m.kind][0]}</span><br>`:''}${esc(m.body)}<span class="m">${m.side==='admin'?esc(m.by||'الإدارة')+' · ':'أنت · '}${cmT(m.at)}</span></div>`).join(''):'<div class="empty">ما فيه رسائل</div>'}</div>
 ${needReason?`<p class="hint" style="color:#8E1F17;font-weight:600;margin:0 0 6px">مطلوب منك كتابة السبب قبل المتابعة.</p>`:''}
 <textarea class="cmta" id="cmRe" placeholder="${needReason?'اكتب السبب هنا…':'اكتب ردّك (اختياري)…'}"></textarea>
 <div class="acts"><button class="btn" id="cmSendBtn">${needReason?'إرسال السبب':un.length?'تم الاطلاع':'إرسال'}</button>${needReason?'':`<button class="btn" data-a="0" style="background:var(--soft2);color:var(--ink);flex:0 0 auto;width:auto;padding-inline:20px">إغلاق</button>`}</div></div>`;
 document.body.appendChild(md);
 const box=md.querySelector('#cmBox');box.scrollTop=box.scrollHeight;
 const close=async()=>{md.remove();const m2=await cmFetch(false);if(m2)cmPaintBadge(m2)};
 md.addEventListener('click',async e=>{
  if((e.target===md&&!needReason)||e.target.closest('[data-a]')){if(un.length)await cmFetch(true);close();return}
  if(e.target.closest('#cmSendBtn')){const v=$('#cmRe').value.trim();
   if(needReason&&v.length<3){toast('اكتب السبب أولاً',1);$('#cmRe').focus();return}
   const bt=$('#cmSendBtn');bt.disabled=true;
   await cmFetch(true);
   if(v){try{const {data:j,error}=await SB.rpc('cmsg_reply',{p_branch:S.f.branch,p_pin:toEn(S.f.pin||'').trim(),p_body:v});if(error||!j||!j.ok){toast((j&&j.message)||'تعذّر الإرسال',1);bt.disabled=false;return}}catch(_){toast('ما فيه اتصال',1);bt.disabled=false;return}
    toast('تم إرسال ردّك للإدارة ✓')}else toast('تم ✓');
   close();}
 });
}
$('#msgBtn').onclick=async()=>{const f=S.f;if(!f.branch||!toEn(f.pin||'').trim()){toast('اختر الفرع واكتب رمزك الشخصي أولاً',1);return}
 const b=$('#msgBtn');b.disabled=true;const m=await cmFetch(false);b.disabled=false;if(!m){toast('تعذّر فتح الرسائل — تأكد من الرمز والاتصال',1);return}cmShow(m)};
async function cmCheck(){const m=await cmFetch(false);if(!m)return;cmPaintBadge(m);
 const un=m.filter(x=>x.side==='admin'&&!x.read);if(un.some(x=>x.kind==='warn'||x.kind==='final'))cmShow(m);}
$('#mineBtn').onclick=async()=>{const b=$('#mineBtn');b.disabled=true;const rows=await fetchMine();b.disabled=false;if(rows){mineBanner(rows);showMine(rows)}};
if(S.f.branch&&S.f.pin){fetchMine(true).then(r=>r&&mineBanner(r));cmCheck();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.f.branch&&S.f.pin)cmCheck()});
render();
</script>
</body>
</html>
