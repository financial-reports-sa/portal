<script>
const BR=[
{k:'az',n:'العزيزية',c:'#D4AF37',d:'#9A7B12',apps:['تطبيق الشادن','هنقرستيشن','كيتا','نينجا']},
{k:'sh',n:'شوران',c:'#5B8FD0',d:'#2F67AE',apps:['تطبيق الشادن','هنقرستيشن','كيتا','نينجا']},
{k:'pc',n:'الباتشينو',c:'#A07BE6',d:'#7A52C9',apps:['هنقرستيشن','كيتا','نينجا']}];
const BM=Object.fromEntries(BR.map(b=>[b.k,b]));
const SH=[{k:'am',n:'الوردية الصباحية',s:'صباحية'},{k:'pm',n:'الوردية المسائية',s:'مسائية'}];
const SM=Object.fromEntries(SH.map(s=>[s.k,s]));
const PAY=[{k:'cash',n:'كاش',c:'#0F766E'},{k:'card',n:'شبكة',c:'#334E9E'},{k:'credit',n:'آجل',c:'#B45309'},{k:'transfer',n:'تحويلات',c:'#0891B2',list:1},{k:'invoice',n:'فواتير',c:'#4D7C0F',list:1}];
const RESC='#7C3AED';
const RETC='#64748B',APPC='#BE185D',AUTHOR='Ameer Alarifi';
const SLOTS={az:5,sh:3,pc:3};
const CASHIER_URL=new URL('../handover/',location.href).href;
const SBC=window.supabase.createClient(window.PORTAL_CONFIG.url,window.PORTAL_CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true}});
const r2=n=>Math.round((n||0)*100)/100;
const listSum=a=>r2((a||[]).reduce((s,x)=>s+(+x.a||0),0));
const slotNo=c=>{const m=/(\d+)$/.exec(c||'');return m?+m[1]:0};
const slotLabel=c=>slotNo(c)?'كاشير '+slotNo(c):'—';
const RV={ok:{t:'تمت المراجعة',cl:'rv-ok'},issue:{t:'عليه ملاحظة',cl:'rv-issue'},'':{t:'بانتظار المراجعة',cl:'rv-pend'}};
const rvOf=r=>RV[r.reviewStatus||'']||RV[''];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toEn=s=>String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[^\d]/g,'');
const fmt=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const fmtK=n=>{n=+n||0;return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':fmt0(n)};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const bizDate=()=>{const d=new Date();if(d.getHours()<6)d.setDate(d.getDate()-1);return iso(d)};
const LOC='ar-SA-u-ca-gregory-nu-latn';
const dLong=s=>pd(s).toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const dShort=s=>pd(s).toLocaleDateString(LOC,{weekday:'short',day:'numeric',month:'short'});
const mLong=m=>pd(m+'-01').toLocaleDateString(LOC,{month:'long',year:'numeric'});
const daysIn=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const tm=s=>{try{return new Date(s).toLocaleTimeString(LOC,{hour:'numeric',minute:'2-digit'})}catch(e){return''}};
const appsTotal=r=>Object.values(r.apps||{}).reduce((a,b)=>a+(+b||0),0);
const totOf=r=>r2((+r.cash||0)+(+r.card||0)+(+r.credit||0)+(+r.transfer||0)+(+r.invoice||0)+appsTotal(r));
const diffOf=r=>(r.system==null||r.system==='')?null:r2(totOf(r)-(+r.system));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function diffBadge(d){if(d==null)return'';if(Math.abs(d)<0.005)return`<span class="diff eq">مطابق</span>`;return d>0?`<span class="diff up">زيادة <span class="num">${fmt(d)}</span></span>`:`<span class="diff down">عجز <span class="num">${fmt(-d)}</span></span>`}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),err?4200:2400)}
const S={tab:'dash',view:'day',onlyPending:false,date:bizDate(),month:bizDate().slice(0,7),filter:'all',rows:[],loaded:false,open:{},key:'',ready:false,rep:{type:'day',date:bizDate(),month:bizDate().slice(0,7),scope:'all',cashier:'',pages:null,busy:false}};
function knownName(code){const r=[...S.rows].filter(x=>x.code===code).sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)))[0];return r?r.cashier:''}
function detailHTML(r){
const li=a=>(a||[]).map(x=>`<div class="kv sub"><span>${esc(x.n)||'—'}</span><span class="num">${fmt(x.a)}</span></div>`).join('');
return `${PAY.filter(p=>!p.list).map(p=>`<div class="kv"><span>${p.n}</span><b class="num">${fmt(r[p.k])}</b></div>`).join('')}
${r.transfer?`<div class="kv"><span>التحويلات البنكية (${(r.transfers||[]).length})</span><b class="num">${fmt(r.transfer)}</b></div>${li(r.transfers)}`:''}
${r.invoice?`<div class="kv"><span>الفواتير (${(r.invoices||[]).length})</span><b class="num">${fmt(r.invoice)}</b></div>${li(r.invoices)}`:''}
${Object.entries(r.apps||{}).map(([a,v])=>`<div class="kv"><span>${esc(a)}</span><b class="num">${fmt(v)}</b></div>`).join('')}
<div class="kv t"><span style="color:var(--ink)">الإجمالي</span><b class="num">${fmt(totOf(r))}</b></div>
${r.system!=null?`<div class="kv"><span>إجمالي النظام</span><b class="num">${fmt(r.system)}</b></div><div class="kv"><span>الفرق</span>${diffBadge(diffOf(r))}</div>`:''}
${r.reserve?`<div class="kv" style="margin-top:6px"><span>الحجوزات — خارج اليومية (${(r.reservations||[]).length})</span><b class="num" style="color:${RESC}">${fmt(r.reserve)}</b></div>${li(r.reservations)}`:''}
${r.returnsTotal?`<div class="kv" style="margin-top:6px"><span>المردود (${(r.returns||[]).length})</span><b class="num" style="color:${RETC}">${fmt(r.returnsTotal)}</b></div>${li(r.returns)}`:''}
${r.notes?`<div class="note">${esc(r.notes)}</div>`:''}`;
}
const pj=(v,d)=>{try{return typeof v==='string'?(v?JSON.parse(v):d):(v||d)}catch(e){return d}};
function normRow(x){const apps=pj(x.apps,{}),transfers=pj(x.transfers,[]),reservations=pj(x.reservations,[]),returns=pj(x.returns,[]),invoices=pj(x.invoices,[]);

function buildCashier(all,month,code){
const b=BM[code.replace(/\d+$/,'')];
const list=all.filter(r=>r.code===code).sort((x,y)=>(x.date+x.shift).localeCompare(y.date+y.shift));
const nm=list.length?list[list.length-1].cashier:'';
const R=new Rep('كشف تسليمات كاشير',`${nm?nm+' · ':''}${slotLabel(code)} · فرع ${b.n} · ${mLong(month)}`);
const t=agg(list);
R.kpis([{l:'إجمالي التسليمات',v:fmt(t.total),dark:1},{l:'عدد التسليمات',v:String(t.n)},{l:'كاش',v:fmt(t.cash),c:PAY[0].c},{l:'شبكة',v:fmt(t.card),c:PAY[1].c},
{l:'تحويلات',v:fmt(t.transfer),c:PAY[3].c},{l:'فواتير',v:fmt(t.invoice),c:PAY[4].c},{l:'تطبيقات',v:fmt(t.apps),c:APPC},{l:'آجل',v:fmt(t.credit),c:PAY[2].c},
{l:'إجمالي العجز',v:fmt(t.short),vc:t.short?'#B23126':'#16233A'},{l:'إجمالي الزيادة',v:fmt(t.over),vc:t.over?'#137A50':'#16233A'},{l:'المردود (للعلم)',v:fmt(t.ret),c:RETC},{l:'المراجعة',v:`${t.n-t.pend} / ${t.n}`,vc:t.pend?'#9A6A06':'#137A50'},{l:'الحجوزات (خارج اليومية)',v:fmt(t.reserve),c:RESC}]);
if(!list.length){R.para(['لا توجد تسليمات لهذا الكاشير في هذا الشهر.']);return R.finish()}
R.section('التسليمات',b.c,fmt(t.total)+' ر.س');
handoverTable(R,list,true);
const apps=b.apps.filter(a=>t.appsBy[a]);
if(apps.length){R.section('تطبيقات التوصيل',APPC);R.table([{h:'التطبيق',w:2,t:1},{h:'المبلغ',w:1.3},{h:'النسبة',w:1}],apps.map(a=>[a,fmt(t.appsBy[a]),t.apps?Math.round(t.appsBy[a]/t.apps*100)+'%':'—']))}
if(list.some(r=>(r.transfers||[]).length||(r.invoices||[]).length||(r.reservations||[]).length||(r.returns||[]).length)){R.section('تفاصيل التحويلات والفواتير والحجوزات والمردود');detailTable(R,list,true)}
const notes=list.filter(r=>r.notes||r.reviewNote).flatMap(r=>[r.notes?`• ${dShort(r.date)}: ${r.notes}`:null,r.reviewNote?`• ملاحظة المراجعة ${dShort(r.date)}: ${r.reviewNote}`:null].filter(Boolean));
if(notes.length){R.section('الملاحظات');R.para(notes)}
return R.finish();
}
function buildDay(all,date,scopeBr){
const rows=all.filter(r=>r.date===date&&scopeBr.some(b=>b.k===r.branch));
const R=new Rep('تقرير تسليم الورديات — يومي',`${dLong(date)} · ${scopeBr.length>1?'كل الفروع':'فرع '+scopeBr[0].n}`);
repKpis(R,agg(rows),'إجمالي التسليمات');
if(scopeBr.length>1)branchSummary(R,rows,scopeBr);
scopeBr.forEach(b=>{
const br=rows.filter(r=>r.branch===b.k),bt=agg(br);
R.section('فرع '+b.n,b.c,fmt(bt.total)+' ر.س');
const list=[...br].sort((x,y)=>(x.shift+slotNo(x.code)).localeCompare(y.shift+slotNo(y.code)));
if(!list.length){R.para(['لا توجد تسليمات لهذا الفرع في هذا اليوم.']);return}
handoverTable(R,list,false);
const apps=b.apps.filter(a=>bt.appsBy[a]);
if(apps.length)R.table([{h:'تطبيق التوصيل',w:2,t:1},...apps.map(a=>({h:a,w:1.2})),{h:'الإجمالي',w:1.3}],[[{t:'المجموع',w:600},...apps.map(a=>fmt(bt.appsBy[a])),{t:fmt(bt.apps),w:700}]],{after:12});
detailTable(R,list,false);
const rvn=list.filter(r=>r.reviewNote).map(r=>`• ملاحظة المراجعة — ${r.cashier}: ${r.reviewNote}`);
if(rvn.length)R.para(rvn);
const notes=list.filter(r=>r.notes).map(r=>`• ${r.cashier}: ${r.notes}`);
if(notes.length)R.para(notes);else R.gap(10);
});
return R.finish();
}
function buildMonth(all,month,scopeBr){
const rows=all.filter(r=>scopeBr.some(b=>b.k===r.branch));
const R=new Rep('تقرير تسليم الورديات — شهري',`${mLong(month)} · ${scopeBr.length>1?'كل الفروع':'فرع '+scopeBr[0].n}`);
const t=agg(rows);
repKpis(R,t,'إجمالي الشهر');
if(scopeBr.length>1)branchSummary(R,rows,scopeBr);
const apps=[...new Set(scopeBr.flatMap(b=>b.apps))];
R.section('تطبيقات التوصيل',APPC,fmt(t.apps)+' ر.س');
R.table([{h:'التطبيق',w:1.6,t:1},...scopeBr.map(b=>({h:b.n,w:1.2})),...(scopeBr.length>1?[{h:'الإجمالي',w:1.3}]:[]),{h:'النسبة من التطبيقات',w:1.3}],
[...apps.map(a=>{let s=0;const c=scopeBr.map(b=>{const v=rows.filter(r=>r.branch===b.k).reduce((x,r)=>x+(+(r.apps||{})[a]||0),0);s+=v;return b.apps.includes(a)?fmt(v):'—'});
return[a,...c,...(scopeBr.length>1?[{t:fmt(s),w:700}]:[]),t.apps?Math.round(s/t.apps*100)+'%':'0%']}),
Object.assign(['الإجمالي',...scopeBr.map(b=>fmt(agg(rows.filter(r=>r.branch===b.k)).apps)),...(scopeBr.length>1?[fmt(t.apps)]:[]),'100%'],{_tot:1})]);
R.section('التسليمات اليومية');
const N=daysIn(month),drs=[];
for(let d=1;d<=N;d++){const ds=`${month}-${pad(d)}`;const dr=rows.filter(r=>r.date===ds);if(!dr.length)continue;const a=agg(dr);
drs.push([dShort(ds),...scopeBr.map(b=>{const v=agg(dr.filter(r=>r.branch===b.k));return v.n?fmt(v.total):{t:'—',c:'#9AA6B8'}}),...(scopeBr.length>1?[{t:fmt(a.total),w:700}]:[]),a.ret?{t:fmt(a.ret),c:RETC}:'—',netD(a)])}
drs.push(Object.assign(['الإجمالي',...scopeBr.map(b=>fmt(agg(rows.filter(r=>r.branch===b.k)).total)),...(scopeBr.length>1?[fmt(t.total)]:[]),t.ret?fmt(t.ret):'—',netD(t)],{_tot:1}));
R.table([{h:'اليوم',w:1.5,t:1},...scopeBr.map(b=>({h:b.n,w:1.2})),...(scopeBr.length>1?[{h:'الإجمالي',w:1.3}]:[]),{h:'المردود',w:1},{h:'الفرق',w:1}],drs);
const cl=cashierStats(rows);
if(cl.length){R.section('الكاشيرات');
R.table([{h:'الكاشير',w:1.6,t:1},{h:'الفرع',w:1.1,t:1},{h:'التسليمات',w:.9},{h:'الإجمالي',w:1.3},{h:'العجز',w:1},{h:'الزيادة',w:1},{h:'صافي الفرق',w:1.15},{h:'المراجعة',w:.95}],
cl.map(c=>Object.assign([`${c.n} · ${slotLabel(c.code)}`,{t:BM[c.b].n,c:BM[c.b].d,w:600},String(c.c),fmt(c.t),c.sh?{t:fmt(c.sh),c:'#B23126'}:'—',c.ov?{t:fmt(c.ov),c:'#137A50'}:'—',c.hd?dCell(r2(c.d)):{t:'—',c:'#9AA6B8'},`${c.rv}/${c.c}`],{_mark:BM[c.b].c})));}
return R.finish();
}
function setTab(t){
S.tab=t;
document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
$('#vDash').classList.toggle('hide',t!=='dash');$('#vRep').classList.toggle('hide',t!=='rep');
if(t==='dash')renderDash();if(t==='rep')renderRep();
window.scrollTo(0,0);
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
(async function boot(){
const {data:{session}}=await SBC.auth.getSession();
if(!session){(window.top||window).location.href=new URL('../',location.href).href;return}
try{const p=await SBC.from('profiles').select('role,active').eq('id',session.user.id).maybeSingle();S.writer=!!(p.data&&p.data.active&&['owner','admin'].includes(p.data.role))}catch(e){S.writer=false}
if(S.writer){try{const c=await SBC.rpc('handover_codes');S.codes=c.data||[]}catch(e){}}
S.ready=true;setTab('dash');loadMonth(S.date.slice(0,7),true);
setInterval(()=>{if(document.visibilityState==='visible'&&S.tab==='dash')loadMonth(S.subMonth,true)},120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.tab==='dash'&&S.lastLoad&&Date.now()-S.lastLoad>60000)loadMonth(S.subMonth,true)});
})();
</script>
