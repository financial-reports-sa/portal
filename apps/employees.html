<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F5F1">
<title>الموظفين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js?v=8"></script>
<style>
:root{color-scheme:light;--bg:#F5F5F1;--card:#FFFFFF;--line:#E6E6E0;--ink:#18231C;--mut:#6B706A;--gold:#D4AF37;--gold-d:#9A7B12;--green:#1F5E43;--up:#1FA16B;--down:#D0453A;--warn:#B7791F;--soft:#FAFAF7;--soft2:#EFEFEA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:13.5px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:0 0}
.num{font-family:"Readex Pro",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 120px}
.wrap>*{min-width:0}
.hide{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:12px;overflow:hidden}
.card h2{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h2 .tag{margin-inline-start:auto;font-size:11.5px;font-weight:500;color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-bottom:10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:12px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .c{font-family:"Readex Pro";font-weight:500;opacity:.7}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.kpi small{display:block;font-size:11px;color:var(--mut)}
.kpi b{display:block;font-size:19px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11px;color:var(--mut)}
.kpi.big{grid-column:1/-1;background:var(--green);border-color:var(--green);color:#fff}
.kpi.big small,.kpi.big .s{color:#cfe0d6}
.kpi.big b{color:var(--gold);font-size:24px}
.bcard{border-top:4px solid}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.bhead h3{font-size:14.5px;display:flex;align-items:center;gap:8px}
.bhead h3 i{width:10px;height:10px;border-radius:50%}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft2);margin:6px 0 8px}
.sbar i{display:block;height:100%;transform-origin:right;animation:grow .8s ease-out}
.sbar i+i{border-inline-start:2px solid #fff}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tile{background:var(--soft);border-radius:10px;padding:7px 6px;text-align:center;min-width:0;border:1.5px solid transparent;cursor:pointer}
.tile:active{transform:scale(.97)}
.tile b{display:block;font-size:17px;font-family:"Readex Pro"}
.tile small{display:block;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.z{opacity:.55}
.tile i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:3px;vertical-align:middle}
.sec{font-size:12px;font-weight:700;margin-top:12px;display:flex;align-items:center;justify-content:space-between}
.sec span{font-weight:500;color:var(--mut);font-size:11px}
.cmp td b{font-family:"Readex Pro"}
.cmp td.bad b{color:var(--down)}.cmp td.warn b{color:#9a6a06}.cmp td.ok b{color:#137a50}
.dedbox{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--soft)}
.dedbox h4{font-size:13px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ded{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.ded:last-child{border-bottom:0}
.ded .nm{flex:1;min-width:0}
.ded .nm small{display:block;color:var(--mut);font-size:11px}
.ded .amt{color:var(--down);font-weight:700;font-family:"Readex Pro"}
.ded button{flex:none;width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:14px}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchips button{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:12.5px}
.rchips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.phbox{border:1.5px dashed var(--line);border-radius:12px;padding:10px;text-align:center;color:var(--mut);font-size:12.5px;cursor:pointer;background:var(--soft)}
.phbox img{max-width:100%;max-height:180px;border-radius:8px;display:block;margin:0 auto}
.fbar{display:flex;align-items:center;gap:8px;background:#fff8e6;border:1px solid #f1dfa6;color:#6b5208;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:12.5px;font-weight:600}
.fbar span{flex:1}.fbar button{font-size:12px;font-weight:700;color:#6b5208;text-decoration:underline}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.mini div{background:var(--soft);border-radius:10px;padding:7px 8px;min-width:0}
.mini small{display:block;font-size:10.5px;color:var(--mut)}
.mini b{font-size:15px}
.jobs{display:flex;flex-direction:column;gap:6px}
.jr{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;align-items:center;gap:8px;font-size:12px}
.jr span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr .bar{display:block;height:8px;border-radius:4px;background:var(--soft2);overflow:hidden}
.jr .bar i{display:block;height:100%;border-radius:4px;transform-origin:right;animation:grow .7s ease-out}
.jr b{text-align:left;font-weight:600}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.alert{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft2);font-size:12.5px}
.alert:last-child{border-bottom:0}
.alert .nm{flex:1;min-width:0}
.alert .nm b{display:block;font-size:13px}
.alert .nm small{color:var(--mut)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:#e6f6ef;color:#137a50}.p-warn{background:#fff1d6;color:#9a6a06}.p-bad{background:#fbebea;color:#b23126}.p-mut{background:var(--soft2);color:var(--mut)}.p-vac{background:#eaf0fb;color:#2F67AE}
.log{font-size:12px;padding:7px 0;border-bottom:1px solid var(--soft2)}
.log:last-child{border-bottom:0}
.log b{font-weight:600}
.log small{color:var(--mut);display:block}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px}
.search input{flex:1;border:0;outline:0;background:0 0;padding:10px 0;min-width:0}
.emp{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--soft2);width:100%;text-align:right}
.emp:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:15px;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}.phbox{display:flex;align-items:center;gap:12px}.phbox .pv{width:76px;height:76px;border-radius:18px;background:var(--soft2,#eee);display:grid;place-items:center;overflow:hidden;flex:none;font-size:28px;color:#999}.phbox .pv img{width:100%;height:100%;object-fit:cover}.phbtn{display:inline-flex;align-items:center;gap:6px;border:1px dashed #C9A227;border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:600;font-size:13px}.bigph{width:100%;max-height:60vh;object-fit:contain;border-radius:14px;display:block;margin:0 auto 10px}
.emp .nm{flex:1;min-width:0}
.emp .nm b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp .nm small{display:block;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp .v{text-align:left;flex:none}
.emp .v b{display:block;font-size:13.5px}
.emp.left{opacity:.6}
.grp{font-size:12px;font-weight:700;color:var(--mut);margin:4px 0 2px;display:flex;align-items:center;gap:6px}
.grp i{width:8px;height:8px;border-radius:50%}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
.btn:disabled{opacity:.45}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.ghost{background:var(--soft2);color:var(--ink)}
.btn.del{background:#fbebea;color:#b23126}
.btn.sm{width:auto;padding:8px 12px;font-size:13px}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:21;background:var(--gold);color:var(--ink);font-weight:700;border-radius:999px;padding:12px 18px;box-shadow:0 6px 18px rgba(24,35,28,.22);display:flex;align-items:center;gap:6px;font-size:14px}
.bar{position:fixed;inset-inline:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;padding:7px 4px;border-radius:10px;font-size:11px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--ink);background:var(--soft2)}
.modal{position:fixed;inset:0;background:rgba(24,35,28,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;overflow-x:hidden}
.sheet h3{font-size:17px;margin-bottom:12px}
.fg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fg .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);min-width:0}
.fld em{color:var(--down);font-style:normal}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:9px 10px;background:var(--soft);outline:0;font-size:14.5px;color:var(--ink);min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--ink);background:#fff}
.fld input.ltr{direction:ltr;text-align:right}
.fld textarea{min-height:64px;resize:vertical}
.fld input[type=date]{min-height:40px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft2);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:7px;border-radius:9px;font-weight:600;color:var(--mut);font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(22,35,58,.12)}
.acts{display:flex;gap:8px;margin-top:14px}
.acts .btn{flex:1}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--soft2);font-size:13px}
.kv span{color:var(--mut)}
.kv b{font-weight:600;text-align:left}
.note{font-size:12.5px;background:#fff8e6;border-radius:8px;padding:8px 10px;margin-top:8px;color:#6b5208}
.hint{color:var(--mut);font-size:11.5px}
.err{color:var(--down);font-size:12.5px;min-height:18px;margin-top:8px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{color:var(--mut);font-weight:600;font-size:11px;text-align:center;padding:7px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--soft2);white-space:nowrap}
.tbl td:first-child,.tbl th:first-child{text-align:right}
.tbl tr.tot td{font-weight:700;border-top:1.5px solid var(--line);border-bottom:0}
.tscroll{overflow-x:auto}
.empty{text-align:center;padding:26px 10px;color:var(--mut);font-size:13.5px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:60;max-width:90vw;text-align:center}
.toast.err{background:var(--down)}
.docbox{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px}
.docbox>b{display:block;font-size:12.5px;margin-bottom:8px}
.docbox .fld input{background:#fff}
.seg.yn{grid-template-columns:1fr 1fr}
.seg.idt{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
</style>
</head>
<body>
<div class="wrap">
<section id="vDash"></section>
<section id="vList" class="hide"></section>
<section id="vExp" class="hide"></section>
</div>
<button class="fab hide" id="fab"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>موظف جديد</button>
<div class="bar"><div class="in"><nav class="tabs" id="tabs">
<button data-t="dash" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>الملخص</button>
<button data-t="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg>الموظفين</button>
<button data-t="exp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 13l3 3 3-3M12 16v-6"/></svg>تصدير Excel</button>
</nav></div></div>
<script>
'use strict';
const SBC=window.supabase.createClient(window.PORTAL_CONFIG.url,window.PORTAL_CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true}});
const AUTHOR='إعداد أمير العريفي';
const BR_FALLBACK=[{id:'az',name:'العزيزية',color:'#D4AF37'},{id:'sh',name:'شوران',color:'#5B8FD0'},{id:'pc',name:'الباتشينو',color:'#A07BE6'}];
const JOBS=['مدير فرع','مشرف','كاشير','طباخ','مساعد طباخ','معلم بروست','معلم شاورما','عامل تحضير','عامل نظافة','مباشر صالة','سائق','محاسب'];
const ST={active:{t:'على رأس العمل',cl:'p-ok'},vacation:{t:'إجازة',cl:'p-vac'},left:{t:'منتهية خدماته',cl:'p-bad'}};
const IDT={resident:{s:'مقيم',t:'هوية مقيم',n:'رقم الإقامة'},visitor:{s:'زائر',t:'هوية زائر',n:'رقم هوية الزائر'},citizen:{s:'مواطن',t:'هوية وطنية',n:'رقم الهوية الوطنية'},none:{s:'لا يوجد',t:'لا يوجد',n:''}};
const idOf=r=>r.id_type&&IDT[r.id_type]?r.id_type:(r.has_iqama||r.iqama?'resident':'none');
const DED_R=['تأخير','غياب','مخالفة بلدية','مخالفة نظافة','تلف أو كسر','عجز كاشير','سلفة','أخرى'];
const HC={ok:{t:'سارية',c:'#1FA16B'},soon:{t:'تنتهي قريباً',c:'#E0A526'},exp:{t:'منتهية',c:'#D0453A'},none:{t:'بدون شهادة',c:'#B9BDB5'}};
const IDC={resident:'#2F67AE',visitor:'#8A6BD1',citizen:'#1F5E43',none:'#B9BDB5'};
const DF={hc_ok:'الشهادات السارية',hc_soon:'شهادات تنتهي خلال 30 يوم',hc_exp:'الشهادات المنتهية',hc_none:'بدون شهادة صحية',id_resident:'هوية مقيم',id_visitor:'هوية زائر',id_citizen:'هوية وطنية',id_none:'بدون هوية',ded:'عليهم خصم هذا الشهر'};
const REASONS=['استقالة','إنهاء من الشركة','انتهاء العقد','انقطاع عن العمل','نقل كفالة','خروج نهائي','أخرى'];
const FLD={name:'الاسم',branch:'الفرع',job:'المسمى',nationality:'الجنسية',phone:'الجوال',iqama:'رقم الهوية',id_type:'نوع الهوية',has_health:'يوجد شهادة صحية',health_no:'رقم الشهادة الصحية',health_exp:'انتهاء الشهادة الصحية',start_date:'تاريخ المباشرة',salary:'الراتب',status:'الحالة',left_date:'تاريخ انتهاء الخدمة',end_reason:'سبب الانتهاء',notes:'ملاحظات'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toEn=s=>String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const fmt=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const fmt2=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const xd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const today=()=>iso(new Date());
const curMonth=()=>today().slice(0,7);
const daysIn=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const LOC='ar-SA-u-ca-gregory-nu-latn';
const dLong=s=>s?pd(s).toLocaleDateString(LOC,{day:'numeric',month:'long',year:'numeric'}):'—';
const dShort=s=>s?pd(s).toLocaleDateString(LOC,{day:'numeric',month:'short',year:'numeric'}):'—';
const mLong=m=>pd(m+'-01').toLocaleDateString(LOC,{month:'long',year:'numeric'});
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),err?4200:2400)}

const S={ded:[],dedOK:false,df:'',tab:'dash',writer:false,branches:[],rows:[],log:[],loaded:false,err:'',f:'all',stf:'active',q:'',exp:{month:'',branch:'all',busy:false}};
const brById=id=>S.branches.find(b=>b.id===id)||BR_FALLBACK.find(b=>b.id===id)||{id,name:id,color:'#888'};
const scopeBr=()=>S.f==='all'?S.branches:S.branches.filter(b=>b.id===S.f);
const inScope=r=>S.f==='all'||r.branch===S.f;
const isOn=r=>r.status!=='left';

// ---------- data ----------
async function load(){
  try{
    const [e,l]=await Promise.all([
      SBC.from('employees').select('*').order('branch').order('start_date'),
      SBC.from('employee_log').select('*').order('at',{ascending:false}).limit(40)
    ]);
    if(e.error)throw e.error;

const avOf=(r,b,sz)=>`<span class="av" style="background:${b.color}${sz?`;width:${sz}px;height:${sz}px`:''}">${S.th&&S.th[r.id]?`<img src="${S.th[r.id]}" alt="">`:esc((r.name||'?').trim().charAt(0))}</span>`;
function shrinkImg(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=fr.result};fr.readAsDataURL(file)})}

function hcOf(r){if(!(r.has_health||r.health_exp))return'none';const s=docState(r.health_exp);if(!s)return'ok';return s.n<0?'exp':s.n<=30?'soon':'ok'}

function docState(d){

function fv(k,v){
  if(v==null||v==='')return'—';
  if(k==='branch')return brById(v).name;
  if(k==='status')return(ST[v]||{}).t||v;
  if(k==='salary')return fmt(v);
  if(typeof v==='boolean')return v?'نعم':'لا';
  if(/_exp$|_date$/.test(k))return dShort(String(v));
  return String(v);
}
function logLine(x){
  const when=new Date(x.at).toLocaleString(LOC,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
  let what=x.action==='add'?'أضاف':x.action==='delete'?'حذف':x.action==='deduct'?'سجّل خصم على':x.action==='undeduct'?'ألغى خصم على':'عدّل';
  let det='';
  if(/deduct/.test(x.action)&&x.changes){det=`${fmt(x.changes.amount)} ر.س · ${esc(x.changes.reason||'')}`}
  if(x.action==='edit'){det=Object.entries(x.changes||{}).filter(([k])=>FLD[k]).map(([k,[a,b]])=>`${FLD[k]}: ${esc(fv(k,a))} ← ${esc(fv(k,b))}`).join(' · ')}
  return `<div class="log"><b>${esc(x.by_name||'—')}</b> ${what} <b>${esc(x.name)}</b>${S.branches.length>1?` <span class="hint">(${esc(brById(x.branch).name)})</span>`:''}${det?`<small>${det}</small>`:''}<small>${when}</small></div>`;
}

// الموظف يدخل الكشف إذا كان على رأس العمل في أي يوم من الشهر. المستحق = الراتب كامل للشهر الكامل، وإلا (الراتب ÷ 30) × أيام العمل
function payroll(month,branch){
  const N=daysIn(month),a=month+'-01',z=month+'-'+pad(N);
  return S.rows.filter(r=>r.branch===branch&&r.start_date<=z&&!(r.status==='left'&&r.left_date&&r.left_date<a)).map(r=>{
    const from=r.start_date>a?r.start_date:a;
    const to=(r.status==='left'&&r.left_date&&r.left_date<z)?r.left_date:z;
    const days=Math.max(0,daysBetween(from,to)+1);
    const sal=+r.salary||0;const due=days>=N?sal:Math.min(sal,Math.round(sal/30*days*100)/100);
    const dl=dedOf(r.id,month),ded=dsum(dl);
    return{...r,days,due,ded,dl,net:Math.round((due-ded)*100)/100,isNew:r.start_date>=a,isLeft:r.status==='left'&&r.left_date&&r.left_date<=z};
  }).sort((x,y)=>(x.start_date<y.start_date?-1:x.start_date>y.start_date?1:x.name.localeCompare(y.name,'ar')));
}

    <label class="fld">الشهر<select id="xm">${monthsList().map(m=>`<option value="${m}" ${m===E.month?'selected':''}>${esc(mLong(m))}</option>`).join('')}</select></label>
    ${S.branches.length>1?`<label class="fld">الفرع<select id="xb"><option value="all" ${E.branch==='all'?'selected':''}>كل الفروع</option>${S.branches.map(b=>`<option value="${b.id}" ${E.branch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label>`:''}
  </div><button class="btn gold" id="xGo" style="margin-top:12px" ${E.busy?'disabled':''}>${E.busy?'جاري التجهيز…':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>تصدير Excel'}</button>
  <p class="hint" style="margin-top:8px">«كل الفروع» يطلع ملف واحد فيه ورقة لكل فرع. المستحق: الشهر الكامل بالراتب كامل، والمباشر أو المنتهية خدماته خلال الشهر يُحسب (الراتب ÷ 30) × أيام العمل.</p></div>`;
  let gT=0,gD=0,gN=0;
  const tblH=(rows,ended)=>`<div class="tscroll"><table class="tbl"><tr><th>الموظف</th><th>الراتب</th><th>الأيام</th><th>المستحق</th><th>الخصم</th><th>الصافي</th></tr>
    ${rows.map(r=>`<tr><td>${esc(r.name)}<br><small class="hint">${esc(r.job)}${ended?' · انتهت '+esc(r.left_date)+(r.end_reason?' · '+esc(r.end_reason):''):(r.isNew?' · <b style="color:var(--up)">جديد</b>':'')+(r.status==='vacation'?' · إجازة':'')}</small></td><td class="num">${fmt(r.salary)}</td><td class="num">${r.days}</td><td class="num">${fmt2(r.due)}</td><td class="num" style="color:${r.ded?'var(--down)':'inherit'}">${r.ded?fmt2(r.ded):'—'}</td><td class="num"><b>${fmt2(r.net)}</b></td></tr>`).join('')}
    <tr class="tot"><td>المجموع</td><td class="num">${fmt(rows.reduce((s,r)=>s+(+r.salary||0),0))}</td><td></td><td class="num">${fmt2(rows.reduce((s,r)=>s+r.due,0))}</td><td class="num">${fmt2(rows.reduce((s,r)=>s+r.ded,0))}</td><td class="num">${fmt2(rows.reduce((s,r)=>s+r.net,0))}</td></tr></table></div>`;
  brs.forEach(b=>{
    const p=payroll(E.month,b.id),act=p.filter(r=>!r.isLeft),end=p.filter(r=>r.isLeft);
    const t=p.reduce((s,r)=>s+(+r.salary||0),0),d=p.reduce((s,r)=>s+r.net,0);gT+=t;gD+=d;gN+=p.length;
    h+=`<div class="card bcard" style="border-top-color:${b.color}"><div class="bhead"><h3><i style="background:${b.color}"></i>${esc(b.name)}</h3><span class="pill p-mut num">${act.length} نشيط${end.length?' · '+end.length+' منتهي':''}</span></div>
    ${act.length?`<div class="grp">الموظفين النشيطين</div>${tblH(act,0)}`:'<div class="empty" style="padding:12px">ما فيه موظفين نشيطين في هذا الشهر</div>'}
    ${end.length?`<div class="grp" style="margin-top:12px;color:var(--down)">انتهت خدماتهم خلال الشهر</div>${tblH(end,1)}`:''}
    ${end.length&&act.length?`<div class="kv" style="margin-top:8px;border:0"><span>صافي المستحق للفرع</span><b class="num">${fmt2(d)}</b></div>`:''}</div>`;
  });
  if(brs.length>1)h+=`<div class="kpis"><div class="kpi big"><small>صافي المستحق بعد الخصومات · ${esc(mLong(E.month))}</small><b class="num">${fmt2(gD)} <span style="font-size:13px">ر.س</span></b><span class="s">${gN} موظف · الرواتب المتفق عليها ${fmt(gT)}</span></div></div>`;
  el.innerHTML=h;
}
let xlLoad=null;
function loadExcelJS(){
  if(window.ExcelJS)return Promise.resolve();
  return xlLoad||(xlLoad=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';s.onload=res;s.onerror=()=>{xlLoad=null;rej(new Error('lib'))};document.head.appendChild(s)}));
}
async function doExport(){
  const E=S.exp;if(E.busy)return;E.busy=true;renderExp();
  try{
    await loadExcelJS();
    const brs=E.branch==='all'?S.branches:S.branches.filter(b=>b.id===E.branch);
    const wb=new ExcelJS.Workbook();wb.creator='Ameer Alarifi';wb.created=new Date();
    const thin={style:'thin',color:{argb:'FF000000'}};const box={top:thin,bottom:thin,left:thin,right:thin};
    const F='Arial';
    const L=n=>{let x='';while(n>0){const m=(n-1)%26;x=String.fromCharCode(65+m)+x;n=Math.floor((n-1)/26)}return x};
    const money='#,##0.00';
    brs.forEach(b=>{
      const p=payroll(E.month,b.id),act=p.filter(r=>!r.isLeft),end=p.filter(r=>r.isLeft);
      const ws=wb.addWorksheet(b.name.slice(0,30),{views:[{rightToLeft:true}],
        pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.4,right:.4,top:.6,bottom:.6,header:.3,footer:.3}},
        headerFooter:{oddHeader:'&R&"Arial,Bold"كشف الموظفين الشهري&L&"Arial"'+b.name,oddFooter:'&R&"Arial"'+AUTHOR+'&C&"Arial"صفحة &P من &N&L&"Arial"&D'}});
      const C=[
        {h:'م',w:5,v:(r,i)=>i+1},
        {h:'اسم الموظف',w:26,v:r=>r.name,al:'right'},
        {h:'المسمى الوظيفي',w:16,v:r=>r.job,al:'right'},
        {h:'الجنسية',w:11,v:r=>r.nationality||''},
        {h:'الجوال',w:13,v:r=>r.phone||'',tx:1},
        {h:'نوع الهوية',w:12,v:r=>IDT[idOf(r)].t},
        {h:'رقم الهوية',w:14,v:r=>idOf(r)==='none'?'':(r.iqama||''),tx:1},
        {h:'رقم الشهادة الصحية',w:15,v:r=>r.health_no||'لا يوجد',tx:1},
        {h:'انتهاء الشهادة الصحية',w:13,v:r=>r.health_exp?xd(r.health_exp):'',dt:1},
        {h:'تاريخ المباشرة',w:13,v:r=>xd(r.start_date),dt:1},
        {h:(e)=>e?'سبب الانتهاء':'الحالة',w:15,v:(r,i,e)=>e?(r.end_reason||'—'):r.status==='vacation'?'إجازة':(r.isNew?'مباشر جديد':'على رأس العمل')},
        {h:(e)=>e?'آخر يوم عمل':'',w:13,v:(r,i,e)=>e&&r.left_date?xd(r.left_date):'',dt:1},
        {h:'الراتب المتفق عليه',w:14,v:r=>+r.salary||0,m:1,sum:1,k:'sal'},
        {h:'أيام العمل',w:9,v:r=>r.days},
        {h:'المستحق للشهر',w:14,v:r=>r.due,m:1,sum:1,k:'due'},
        {h:'الخصومات',w:12,v:r=>r.ded,m:1,sum:1,k:'ded'},
        {h:'صافي المستحق',w:14,v:r=>r.net,m:1,sum:1,k:'net',b:1},
        {h:'ملاحظات',w:26,v:r=>r.notes||'',al:'right',wrap:1}];
      ws.columns=C.map(c=>({width:c.w}));const last=C.length;const firstSum=C.findIndex(c=>c.sum)+1,netCol=C.findIndex(c=>c.k==='net')+1;
      ws.mergeCells(1,1,1,last);ws.getCell(1,1).value='كشف الموظفين — فرع '+b.name;
      ws.getCell(1,1).font={name:F,bold:true,size:15};ws.getCell(1,1).alignment={horizontal:'center',vertical:'middle'};ws.getRow(1).height=26;
      ws.mergeCells(2,1,2,last);ws.getCell(2,1).value='عن شهر '+mLong(E.month)+'  ·  تاريخ الإصدار '+dLong(today());
      ws.getCell(2,1).font={name:F,size:11};ws.getCell(2,1).alignment={horizontal:'center'};
      const allD=p.flatMap(r=>r.dl.map(d=>({...d,emp:r.name})));
      ws.mergeCells(3,1,3,last);ws.getCell(3,1).value=`الموظفين النشيطين: ${act.length}   ·   مباشرين خلال الشهر: ${act.filter(r=>r.isNew).length}   ·   انتهت خدماتهم خلال الشهر: ${end.length}   ·   الخصومات: ${allD.length}`;
      ws.getCell(3,1).font={name:F,size:10};ws.getCell(3,1).alignment={horizontal:'center'};
      let rn=5;const sums=[];
      const head=(row,titles)=>{titles.forEach((t,i)=>{const c=row.getCell(i+1);c.value=t;c.font={name:F,bold:true,size:11};c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border={top:{style:'medium'},bottom:{style:'medium'},left:thin,right:thin};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEDEDED'}}});row.height=30};
      const title=t=>{ws.mergeCells(rn,1,rn,last);const tc=ws.getCell(rn,1);tc.value=t;tc.font={name:F,bold:true,size:12};tc.alignment={horizontal:'right'};rn++};
      const block=(t,rows,ended)=>{
        title(t);head(ws.getRow(rn++),C.map(c=>typeof c.h==='function'?c.h(ended):c.h));
        const f0=rn;
        rows.forEach((r,i)=>{const row=ws.getRow(rn++);C.forEach((c,j)=>{const cell=row.getCell(j+1);cell.value=c.v(r,i,ended);cell.font={name:F,size:11,bold:!!c.b};cell.border=box;cell.alignment={vertical:'middle',horizontal:c.al||'center',wrapText:!!c.wrap};if(c.dt)cell.numFmt='yyyy-mm-dd';if(c.m)cell.numFmt=money;if(c.tx)cell.numFmt='@'})});
        if(!rows.length){ws.mergeCells(rn,1,rn,last);const c=ws.getCell(rn,1);c.value='لا يوجد';c.font={name:F,size:10,italic:true};c.alignment={horizontal:'center'};c.border=box;rn++}
        const f1=rn-1,tr=ws.getRow(rn);ws.mergeCells(rn,1,rn,firstSum-1);tr.getCell(1).value='المجموع';
        C.forEach((c,j)=>{if(!c.sum)return;const col=L(j+1);tr.getCell(j+1).value=rows.length?{formula:`SUM(${col}${f0}:${col}${f1})`,result:Math.round(rows.reduce((x,r)=>x+(+c.v(r,0,ended)||0),0)*100)/100}:0;tr.getCell(j+1).numFmt=money});
        for(let j=1;j<=last;j++){const c=tr.getCell(j);c.font={name:F,bold:true,size:11};c.border={top:{style:'double'},bottom:{style:'medium'},left:thin,right:thin};c.alignment={horizontal:'center',vertical:'middle'}}
        tr.height=22;sums.push(rn);rn+=2;
      };
      block('أولاً: الموظفين النشيطين',act,0);
      if(end.length)block('ثانياً: الموظفين المنتهية خدماتهم خلال الشهر',end,1);
      if(sums.length>1){const g=ws.getRow(rn);ws.mergeCells(rn,1,rn,netCol-1);g.getCell(1).value='صافي المستحق للفرع';g.getCell(netCol).value={formula:sums.map(x=>L(netCol)+x).join('+'),result:Math.round(p.reduce((x,r)=>x+r.net,0)*100)/100};
        for(let j=1;j<=last;j++){const c=g.getCell(j);c.font={name:F,bold:true,size:12};c.border={top:{style:'medium'},bottom:{style:'double'},left:thin,right:thin};c.alignment={horizontal:'center',vertical:'middle'}}g.getCell(netCol).numFmt=money;g.height=24;rn+=2}
      if(allD.length){
        title((end.length?'ثالثاً':'ثانياً')+': تفاصيل الخصومات');
        const DH=['م','اسم الموظف','التاريخ','سبب الخصم','التفاصيل','سجّله','صورة المخالفة','المبلغ'];
        const pos=[1,2,3,4,5,7,8,9];
        const hr=ws.getRow(rn++);ws.mergeCells(hr.number,5,hr.number,6);head(hr,[]);DH.forEach((t,i)=>{const c=hr.getCell(pos[i]);c.value=t;c.font={name:F,bold:true,size:11};c.alignment={horizontal:'center',vertical:'middle'};c.border={top:{style:'medium'},bottom:{style:'medium'},left:thin,right:thin};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEDEDED'}}});hr.height=24;
        const f0=rn;
        allD.sort((x,y)=>String(x.date).localeCompare(String(y.date))).forEach((d,i)=>{const row=ws.getRow(rn);ws.mergeCells(rn,5,rn,6);[i+1,d.emp,xd(String(d.date)),d.reason,d.notes||'',d.created_by||'',d.has_photo?'مرفقة في النظام':'—',+d.amount].forEach((v,k)=>{const c=row.getCell(pos[k]);c.value=v;c.font={name:F,size:11};c.border=box;c.alignment={vertical:'middle',horizontal:[1,4].includes(k)?'right':'center',wrapText:k===4}});row.getCell(3).numFmt='yyyy-mm-dd';row.getCell(9).numFmt=money;rn++});
        const tr=ws.getRow(rn);ws.mergeCells(rn,1,rn,8);tr.getCell(1).value='مجموع الخصومات';tr.getCell(9).value={formula:`SUM(I${f0}:I${rn-1})`,result:dsum(allD)};tr.getCell(9).numFmt=money;
        for(let j=1;j<=9;j++){const c=tr.getCell(j);c.font={name:F,bold:true,size:11};c.border={top:{style:'double'},bottom:{style:'medium'},left:thin,right:thin};c.alignment={horizontal:'center',vertical:'middle'}}
        rn+=2;
      }
      ws.mergeCells(rn,1,rn,last);ws.getCell(rn,1).value='المستحق: الشهر الكامل بالراتب المتفق عليه، والمباشر أو المنتهية خدماته خلال الشهر (الراتب ÷ 30) × أيام العمل. صافي المستحق = المستحق − الخصومات.';ws.getCell(rn,1).font={name:F,size:9,italic:true};
      const sr=rn+3;
      [['مدير الفرع',2],['المحاسب',8],['الاعتماد',15]].forEach(([t,c])=>{ws.getCell(sr,c).value=t+':';ws.getCell(sr,c).font={name:F,bold:true,size:11};ws.getCell(sr+1,c).value='التوقيع: ____________________';ws.getCell(sr+1,c).font={name:F,size:10}});
      ws.pageSetup.printArea=`A1:${L(last)}${sr+1}`;
    });
    const buf=await wb.xlsx.writeBuffer();
    const name=`كشف-الموظفين-${E.branch==='all'?'كل-الفروع':brById(E.branch).name}-${E.month}.xlsx`;
    saveFile(name,new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  }catch(e){console.error(e);toast(e.message==='lib'?'تعذّر تحميل مكتبة Excel — تأكد من الإنترنت':'تعذّر إنشاء الملف',1)}
  E.busy=false;renderExp();
}
function saveFile(name,blob){
  try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000);toast('تم التحميل')}catch(e){toast('تعذّر التحميل',1)}
}

// ---------- shell ----------
function render(){
  $('#fab').classList.toggle('hide',S.tab!=='list'||!S.loaded||!!S.err||!S.branches.length);
  if(S.tab==='dash')renderDash();if(S.tab==='list')renderList();if(S.tab==='exp')renderExp();
}
function setTab(t){
  S.tab=t;lsSet('emp_tab',t);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ['dash','list','exp'].forEach(k=>$('#v'+k.charAt(0).toUpperCase()+k.slice(1)).classList.toggle('hide',k!==t));
  render();window.scrollTo(0,0);
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$('#fab').onclick=()=>openForm(null);
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');if(f){S.f=f.dataset.f;render();return}
  const s=e.target.closest('[data-st]');if(s){S.stf=s.dataset.st;S.df='';render();return}
  const g=e.target.closest('[data-go]');if(g&&!e.target.closest('.modal')){const[b,k]=g.dataset.go.split('|');if(S.branches.length>1)S.f=b;S.df=k;S.stf='active';setTab('list');return}
  const dfx=e.target.closest('[data-df]');if(dfx){S.df='';render();return}
  const o=e.target.closest('[data-open]');if(o&&!e.target.closest('.modal')){openDetail(o.dataset.open);return}
  if(e.target.closest('#xGo'))doExport();
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const p=e.target.selectionStart;renderList();const q=$('#q');q.focus();try{q.setSelectionRange(p,p)}catch(x){}}});
document.addEventListener('change',e=>{if(e.target.id==='xm'){S.exp.month=e.target.value;renderExp()}if(e.target.id==='xb'){S.exp.branch=e.target.value;renderExp()}});
(async function boot(){
  const {data:{session}}=await SBC.auth.getSession();
  if(!session){(window.top||window).location.href=new URL('../',location.href).href;return}
  try{const p=await SBC.from('profiles').select('role,active').eq('id',session.user.id).maybeSingle();S.writer=!!(p.data&&p.data.active&&['owner','admin'].includes(p.data.role))}catch(e){S.writer=false}
  try{const b=await SBC.from('branches').select('*').order('sort');S.branches=(b.data||[]).map(x=>({id:x.id,name:x.name,color:x.color||brById(x.id).color}))}catch(e){}
  if(!S.branches.length&&S.writer)S.branches=BR_FALLBACK;
  if(S.branches.length===1)S.f=S.branches[0].id;
  const t=lsGet('emp_tab');setTab(['dash','list','exp'].includes(t)?t:'dash');
  load();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
})();
</script>
